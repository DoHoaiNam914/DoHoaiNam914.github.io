<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03060b">
  <title>AI Workbench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%2303060b'/%3E%3Cpath d='M8 32 21 17l11 15-11 15L8 32Zm24 0 11-15 13 15-13 15-11-15Z' fill='none' stroke='%2300f6ff' stroke-width='6'/%3E%3C/svg%3E">
  <!-- CSS variables compiled from Tailwind CSS @theme static; no runtime CDN or build. -->
  <style>
    :root{
      --color-accent:#00f6ff;--accent-rgb:0,246,255;--color-accent-soft:rgba(var(--accent-rgb),.11);
      --color-accent-strong:#9dffff;--color-accent-ink:#020b10;--color-bg:#03060b;--color-panel:#071019;
      --color-panel-2:#0a1a26;--color-border:#143242;--color-border-strong:#2b4d5e;--color-text:#e6fbff;
      --color-muted:#a1b2bb;--color-faint:#78909c;--color-success:#39ff88;--color-error:#ff2e55;
      --font-ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-mono:ui-monospace,Consolas,monospace
    }
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#010305;color:var(--color-text)}
    body{font:14px/1.5 var(--font-ui);background:var(--color-bg)}button,input,textarea,select{font:inherit;color:inherit}
    button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}input,textarea,select{width:100%;padding:9px 10px;
      background:var(--color-panel-2);border:1px solid var(--color-border);border-radius:2px}
    textarea{resize:none;min-height:76px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
      outline:1px solid var(--color-accent);outline-offset:2px;box-shadow:0 0 12px rgba(var(--accent-rgb),.35)}
    [hidden]{display:none!important}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--color-border-strong)}
    .cut{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
    .app{display:grid;grid-template-columns:290px minmax(0,1fr) 330px;height:100dvh}.panel{min-width:0;overflow:hidden;
      background:linear-gradient(180deg,rgba(var(--accent-rgb),.04),transparent 150px),var(--color-panel)}
    .sidebar{border-right:1px solid var(--color-border)}.settings{border-left:1px solid var(--color-border)}
    .column,.main{display:flex;flex-direction:column;height:100%;min-width:0}.main{overflow:hidden}
    .head,.topbar{display:flex;align-items:center;gap:8px;flex:none}.head{padding:12px 14px;border-bottom:1px solid var(--color-border)}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.mark{display:grid;place-items:center;width:34px;height:34px;
      border:1px solid var(--color-accent);background:var(--color-accent-soft);color:var(--color-accent);font-weight:900;flex:none}
    .brand strong{display:block;font-size:14px;text-transform:uppercase;white-space:nowrap}.brand small{display:block;color:var(--color-accent);
      font:10px var(--font-mono);white-space:nowrap}.icon,.button,.send{display:inline-flex;align-items:center;justify-content:center;gap:7px;
      border:1px solid var(--color-border-strong);background:var(--color-panel-2);min-height:34px}
    .icon{width:34px;padding:0;flex:none}.button{padding:7px 11px;font-size:11px;font-weight:650}.accent,.send{
      background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink)}
    .side-body{display:flex;flex-direction:column;gap:10px;min-height:0;padding:12px;flex:1}.new{width:100%;min-height:42px;
      border:1px solid var(--color-accent);background:var(--color-accent-soft);color:var(--color-accent-strong);font-size:12px;font-weight:700}
    .conversation-list{min-height:0;overflow:auto;flex:1}.section-label{margin:12px 5px 5px;color:var(--color-faint);font:10px var(--font-mono)}
    .section-label:before,.section-title:before{content:"// "}.conversation{display:flex;align-items:center;border:1px solid transparent}
    .conversation.active{background:var(--color-accent-soft);border-color:var(--color-accent)}.conversation-select{background:transparent;
      border:0;text-align:left;min-width:0;flex:1;padding:9px}.conversation-title,.conversation-meta{display:block;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}.conversation-meta{color:var(--color-faint);font:10px var(--font-mono);margin-top:2px}
    .conversation-delete{border:0;background:transparent;color:var(--color-muted);width:30px;height:30px}.foot{padding:10px 14px;
      border-top:1px solid var(--color-border);color:var(--color-faint);font:10px var(--font-mono)}
    .topbar{height:54px;padding:9px 14px;background:rgba(7,16,25,.97);border-bottom:1px solid var(--color-border-strong)}
    .top-title{flex:1;text-align:center;color:var(--color-muted);font:11px var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .status{display:flex;align-items:center;gap:6px;border:1px solid var(--color-border-strong);padding:7px 10px;font:11px var(--font-mono)}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--color-success);box-shadow:0 0 8px var(--color-success)}
    .status.offline{border-color:var(--color-error);color:var(--color-error)}.status.offline .dot{background:var(--color-error)}
    .chat{display:flex;flex:1;min-height:0;flex-direction:column}.chat-scroll{flex:1;min-height:0;overflow:auto;background:
      linear-gradient(rgba(20,50,66,.25) 1px,transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg,rgba(20,50,66,.25) 1px,transparent 1px) 0 0/32px 32px,var(--color-bg)}
    .messages{width:100%;max-width:880px;margin:auto;padding:18px 20px}.welcome{text-align:center;padding:18vh 20px}.welcome h1{
      margin:12px 0 5px;font-size:26px;text-transform:uppercase}.welcome p{color:var(--color-muted)}
    .message{display:flex;gap:12px;padding:16px 4px;border-bottom:1px dashed rgba(20,50,66,.65)}.avatar{display:grid;place-items:center;
      flex:0 0 32px;width:32px;height:32px;color:var(--color-accent);border:1px solid var(--color-border);background:var(--color-panel-2);
      clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}.message-main{min-width:0;flex:1}
    .message-head{margin-bottom:7px}.role{font:10px var(--font-mono);border:1px solid var(--color-border);background:var(--color-panel-2);
      color:var(--color-muted);padding:2px 7px}.message-content{background:var(--color-panel-2);border:1px solid var(--color-border);
      padding:10px 13px;white-space:pre-wrap;overflow-wrap:anywhere}.attachments{display:grid;gap:7px;margin-top:8px}
    .attachment{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:9px;background:var(--color-panel-2);
      border:1px solid var(--color-border);padding:8px 9px;min-width:0}.attachment-icon{color:var(--color-accent)}
    .attachment-info{min-width:0}.attachment-name,.attachment-meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .attachment-name{font-weight:650}.attachment-meta{font:10px var(--font-mono);color:var(--color-faint)}.attachment button,.message-actions button{
      border:0;background:transparent;color:var(--color-muted);min-width:28px;height:28px}.message-actions{display:flex;gap:3px;margin-top:8px}
    .edit-box{border:1px solid var(--color-accent);background:var(--color-panel);padding:10px}.edit-tools,.edit-actions{display:flex;
      flex-wrap:wrap;gap:7px;margin-top:9px}.edit-actions{justify-content:flex-end}.composer-wrap{flex:none;padding:8px 14px calc(12px + env(safe-area-inset-bottom));
      background:linear-gradient(to top,var(--color-bg) 75%,transparent)}.composer{max-width:880px;margin:auto}.pending{display:flex;gap:7px;
      overflow:auto;margin-bottom:7px}.composer-box{border:1px solid var(--color-border-strong);background:var(--color-panel)}
    .composer-box:focus-within{border-color:var(--color-accent);box-shadow:inset 0 0 24px var(--color-accent-soft)}
    .composer textarea{border:0;background:transparent;min-height:54px;max-height:180px;outline:0}.composer-tools{display:flex;align-items:center;
      padding:6px 8px 8px}.send{width:42px;height:42px;padding:0;margin-left:auto}.settings-body{flex:1;overflow:auto;padding:14px}
    .settings-section{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--color-border)}.section-title{margin:0;color:var(--color-accent);
      font:10px var(--font-mono)}.field{margin-top:12px}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:650}
    .hint{color:var(--color-faint);font-size:11px;margin:6px 0 0}.safety-grid{display:grid;gap:10px}.safety-row{display:grid;
      grid-template-columns:minmax(0,1fr) minmax(145px,1fr);align-items:center;gap:10px}.safety-row label{margin:0;font:10px var(--font-mono);
      overflow-wrap:anywhere}.empty{border:1px dashed var(--color-border-strong);padding:16px;text-align:center;color:var(--color-faint)}
    dialog{padding:0;color:var(--color-text);background:var(--color-panel);border:1px solid var(--color-border-strong);
      width:min(700px,calc(100vw - 28px));max-height:calc(100dvh - 28px)}dialog::backdrop{background:rgba(0,3,8,.82)}
    .dialog-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--color-border);
      background:linear-gradient(90deg,var(--color-accent-soft),transparent)}.dialog-head h2{font-size:14px;margin:0;text-transform:uppercase;flex:1}
    .dialog-body{padding:14px;max-height:calc(100dvh - 90px);overflow:auto}.library-list{list-style:none;margin:12px 0 0;padding:0}
    .library-item{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--color-border)}.library-info{flex:1;min-width:0}
    .library-actions{display:flex;gap:4px;flex-wrap:wrap}.toasts{position:fixed;z-index:100;right:16px;top:16px;display:grid;gap:8px;
      width:min(360px,calc(100vw - 32px));pointer-events:none}.toast{pointer-events:auto;background:var(--color-panel);
      border:1px solid var(--color-border-strong);border-left:3px solid var(--color-accent);padding:10px 12px}.toast.error{
      border-left-color:var(--color-error)}.toast.success{border-left-color:var(--color-success)}.backdrop{display:none}.mobile{display:none}
    @media(hover:hover){button:hover:not(:disabled){border-color:var(--color-accent);color:var(--color-accent-strong)}
      .accent:hover:not(:disabled),.send:hover:not(:disabled){background:var(--color-accent-strong);color:var(--color-accent-ink)}
      .attachment .remove:hover,.conversation-delete:hover{color:var(--color-error)}}
    @media(max-width:1279px){.app{grid-template-columns:1fr}.panel{position:fixed;z-index:50;top:0;bottom:0;width:min(350px,92vw);
      transition:transform .2s;box-shadow:0 18px 46px rgba(0,0,0,.6)}.sidebar{left:0;transform:translateX(-104%)}.settings{right:0;
      transform:translateX(104%)}.panel.open{transform:translateX(0)}.backdrop{display:block;position:fixed;z-index:40;inset:0;
      background:rgba(0,3,8,.78);opacity:0;pointer-events:none}.backdrop.open{opacity:1;pointer-events:auto}.mobile{display:inline-flex}}
    @media(max-width:767px){.topbar{padding:8px 10px}.top-title{display:none}.brand-copy{display:none}.messages{padding:10px 12px}
      .message{gap:9px}.composer-wrap{padding-left:11px;padding-right:11px}input,textarea,select{font-size:16px}.safety-row{grid-template-columns:1fr}
      .library-item{align-items:flex-start;flex-wrap:wrap}.library-actions{width:100%}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel sidebar" id="sidebar" aria-label="Conversation history">
      <div class="column">
        <div class="head">
          <div class="brand"><span class="mark cut">◇</span><div class="brand-copy"><strong>AI Workbench</strong><small>Multi-model workbench</small></div></div>
          <button class="icon mobile" data-action="close-drawers" aria-label="Close">×</button>
        </div>
        <div class="side-body">
          <button class="new cut" data-action="new-conversation">＋ New conversation</button>
          <input id="conversation-search" type="search" placeholder="Search titles or messages" aria-label="Search conversations">
          <nav class="conversation-list" id="conversation-list"></nav>
        </div>
        <div class="foot">Saved on this device</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon mobile" data-action="open-sidebar" aria-label="Open conversations">☰</button>
        <span class="mark cut mobile">◇</span>
        <div class="top-title" id="top-title"></div>
        <div class="status" id="status"><span class="dot"></span><span id="status-label">Ready</span></div>
        <button class="icon" data-action="open-library" data-target="composer" aria-label="File library" title="File library">▤</button>
        <button class="icon" data-action="open-settings" aria-label="Settings" title="Settings">☷</button>
      </header>
      <section class="chat">
        <div class="chat-scroll" id="chat-scroll"><div class="messages" id="message-list" role="log" aria-live="polite"></div></div>
        <div class="composer-wrap">
          <div class="composer">
            <div class="pending" id="pending-list" hidden></div>
            <div class="composer-box">
              <textarea id="composer-input" placeholder="Enter a message" aria-label="Message"></textarea>
              <div class="composer-tools">
                <button class="icon" data-action="choose-files" data-target="composer" aria-label="Attach files" title="Attach files">⌕</button>
                <button class="send cut" data-action="send-message" aria-label="Send message" title="Send message">➤</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <aside class="panel settings" id="settings" aria-label="Settings">
      <div class="column">
        <div class="head"><strong style="flex:1;text-transform:uppercase">Settings</strong>
          <button class="button" data-action="reset-settings">↻ Reset</button>
          <button class="icon mobile" data-action="close-drawers" aria-label="Close">×</button>
        </div>
        <div class="settings-body">
          <section class="settings-section"><h3 class="section-title">Appearance</h3>
            <div class="field"><label for="accent-input">Accent color</label><input id="accent-input" type="color" style="height:38px;padding:4px"></div>
          </section>
          <section class="settings-section"><h3 class="section-title">Endpoint and model</h3>
            <div class="field"><label for="api-format">API format</label><select id="api-format">
              <option value="gemini">Gemini Generate Content</option><option value="openai">OpenAI Responses</option></select></div>
            <div class="field"><label for="base-url">Base URL</label><input id="base-url" type="url" spellcheck="false"></div>
            <div class="field"><label for="model-id">Model</label><input id="model-id" spellcheck="false" placeholder="Model ID"></div>
            <div class="field"><label for="api-key">API key</label><input id="api-key" type="password" autocomplete="off" spellcheck="false"></div>
          </section>
          <section class="settings-section"><h3 class="section-title">System prompt</h3>
            <div class="field"><label for="system-prompt">Instructions</label><textarea id="system-prompt" placeholder="Enter shared instructions"></textarea></div>
          </section>
          <section class="settings-section"><h3 class="section-title">Generation parameters</h3>
            <div class="field"><label for="temperature">Temperature</label><input id="temperature" type="number" min="0" max="2" step="0.1"></div>
            <div class="field"><label for="max-tokens">Max tokens</label><input id="max-tokens" type="number" min="1" step="1" placeholder="Default"></div>
          </section>
          <section class="settings-section" id="safety-section"><h3 class="section-title">Safety settings</h3>
            <p class="hint">Each friendly label keeps its provider threshold value in the request.</p><div class="safety-grid" id="safety-grid"></div>
          </section>
          <section class="settings-section"><h3 class="section-title">Request body</h3>
            <div class="field"><textarea id="request-preview" readonly spellcheck="false" style="min-height:260px;font:11px/1.5 var(--font-mono)"></textarea></div>
            <button class="button" data-action="copy-request">Copy</button>
          </section>
        </div>
      </div>
    </aside>
  </div>

  <div class="backdrop" id="backdrop" data-action="close-drawers"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input id="file-input" type="file" multiple hidden>

  <dialog id="library-dialog">
    <div class="dialog-head"><h2>File library</h2><button class="button" data-action="cleanup-files">Delete unused</button>
      <button class="icon" data-action="close-dialog" data-dialog="library-dialog" aria-label="Close">×</button></div>
    <div class="dialog-body"><input id="library-search" type="search" placeholder="Search files" aria-label="Search files">
      <ul class="library-list" id="library-list"></ul></div>
  </dialog>
  <dialog id="preview-dialog">
    <div class="dialog-head"><h2 id="preview-title">File preview</h2>
      <button class="icon" data-action="close-dialog" data-dialog="preview-dialog" aria-label="Close">×</button></div>
    <div class="dialog-body" id="preview-body"></div>
  </dialog>

  <script>
    'use strict'
    const STORAGE_KEY='ai-workbench-fixed-v2',DB_NAME='ai-workbench-fixed-files',DB_STORE='files'
    const safetyCategories=[
      ['HARM_CATEGORY_HARASSMENT','Harassment'],['HARM_CATEGORY_HATE_SPEECH','Hate speech'],
      ['HARM_CATEGORY_SEXUALLY_EXPLICIT','Sexually explicit'],['HARM_CATEGORY_DANGEROUS_CONTENT','Dangerous content'],
      ['HARM_CATEGORY_JAILBREAK','Jailbreak']
    ]
    const safetyThresholds=[
      ['OFF','Off'],['BLOCK_NONE','Block none'],['BLOCK_ONLY_HIGH','Block few'],
      ['BLOCK_MEDIUM_AND_ABOVE','Block some'],['BLOCK_LOW_AND_ABOVE','Block most']
    ]
    const defaults=()=>({accent:'#00f6ff',apiFormat:'gemini',baseUrl:'https://generativelanguage.googleapis.com/v1beta',
      model:'',apiKey:'',systemPrompt:'',temperature:1,maxTokens:null,
      safety:Object.fromEntries(safetyCategories.map(item=>[item[0],'OFF']))})
    const state={conversations:[],activeConversationId:null,composerText:'',composerAttachmentIds:[],editDraft:null,
      fileTarget:'composer',libraryTarget:'composer',settings:defaults()}
    let db=null,previewUrl=''
    const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random()
    const active=()=>state.conversations.find(item=>item.id===state.activeConversationId)||null
    const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))
    const bytes=size=>size<1024?size+' B':size<1048576?(size/1024).toFixed(1)+' KB':(size/1048576).toFixed(1)+' MB'
    function toast(message,type=''){const item=document.createElement('div');item.className='toast '+type;item.textContent=message;
      $('toasts').append(item);setTimeout(()=>item.remove(),3600)}
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({conversations:state.conversations,
      activeConversationId:state.activeConversationId,composerText:state.composerText,
      composerAttachmentIds:state.composerAttachmentIds,settings:state.settings}))}
    function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved){
      state.conversations=Array.isArray(saved.conversations)?saved.conversations:[];state.activeConversationId=saved.activeConversationId;
      state.composerText=typeof saved.composerText==='string'?saved.composerText:'';
      state.composerAttachmentIds=Array.isArray(saved.composerAttachmentIds)?saved.composerAttachmentIds:[];
      state.settings={...defaults(),...(saved.settings||{}),safety:{...defaults().safety,...(saved.settings?.safety||{})}}}}
      catch(error){toast('Unable to read saved state: '+error.message,'error')}
      if(!state.conversations.length)newConversation(false)
      if(!state.conversations.some(item=>item.id===state.activeConversationId))state.activeConversationId=state.conversations[0].id}
    function openDb(){return new Promise((resolve,reject)=>{const request=indexedDB.open(DB_NAME,1);request.onupgradeneeded=()=>{
      const database=request.result;if(!database.objectStoreNames.contains(DB_STORE))database.createObjectStore(DB_STORE,{keyPath:'id'})}
      request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
    function storeRequest(mode,fn){return new Promise((resolve,reject)=>{if(!db)return reject(new Error('File storage is unavailable.'));
      const request=fn(db.transaction(DB_STORE,mode).objectStore(DB_STORE));request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
    const getFile=id=>storeRequest('readonly',store=>store.get(id)),getFiles=()=>storeRequest('readonly',store=>store.getAll())
    const putFile=file=>storeRequest('readwrite',store=>store.put(file)),deleteFile=id=>storeRequest('readwrite',store=>store.delete(id))
    function newConversation(render=true){if(state.editDraft&&!confirm('Discard the open message edit?'))return
      state.editDraft=null;const conversation={id:uid(),title:'New conversation',messages:[]};state.conversations.unshift(conversation);
      state.activeConversationId=conversation.id;state.composerText='';state.composerAttachmentIds=[];save();if(render)renderAll()}
    function title(conversation){const text=conversation.messages.find(message=>message.role==='user'&&message.content.trim())?.content;
      return text?text.replace(/\s+/g,' ').trim().slice(0,60):'New conversation'}
    function selectConversation(id){if(state.editDraft&&state.editDraft.conversationId!==id&&!confirm('Discard the unsaved edit and switch conversations?'))return
      state.editDraft=null;if(!state.conversations.some(item=>item.id===id))return;state.activeConversationId=id;
      state.composerText='';state.composerAttachmentIds=[];save();renderAll();closeDrawers()}
    function deleteConversation(id){if(!confirm('Delete this conversation? Files remain in the library.'))return
      state.conversations=state.conversations.filter(item=>item.id!==id);if(state.editDraft?.conversationId===id)state.editDraft=null;
      state.activeConversationId=state.conversations[0]?.id||null;if(!state.conversations.length)newConversation(false);save();renderAll()}
    function beginEdit(id){if(state.editDraft)return toast('Save or cancel the current edit first.','error')
      const conversation=active(),message=conversation?.messages.find(item=>item.id===id);if(!message)return
      state.editDraft={sessionId:uid(),conversationId:conversation.id,messageId:id,role:message.role,
        content:message.content,attachmentIds:[...(message.attachmentIds||[])]};renderMessages()}
    function saveEdit(){const draft=state.editDraft,conversation=active();if(!draft||draft.conversationId!==conversation?.id)return
      const message=conversation.messages.find(item=>item.id===draft.messageId);if(!message)return
      draft.content=$('edit-content')?.value??draft.content;draft.role=$('edit-role')?.value??draft.role
      if(!draft.content.trim()&&!draft.attachmentIds.length)return toast('A message needs text or a file.','error')
      message.content=draft.content;message.role=draft.role;message.attachmentIds=[...draft.attachmentIds]
      state.editDraft=null;conversation.title=title(conversation);save();renderAll();toast('Message updated.','success')}
    function cancelEdit(){if(state.editDraft&&confirm('Discard this message edit?')){state.editDraft=null;renderMessages()}}
    function removeEditFile(id){if(!state.editDraft)return;state.editDraft.attachmentIds=state.editDraft.attachmentIds.filter(item=>item!==id);renderMessages()}
    function removeComposerFile(id){state.composerAttachmentIds=state.composerAttachmentIds.filter(item=>item!==id);save();renderComposerFiles();preview()}
    function deleteMessage(id){const conversation=active();if(!conversation||!confirm('Delete this message? Files remain in the library.'))return
      conversation.messages=conversation.messages.filter(item=>item.id!==id);conversation.title=title(conversation);save();renderAll()}
    async function addFiles(files,target){const intent=target==='edit'&&state.editDraft?
      {type:'edit',sessionId:state.editDraft.sessionId,conversationId:state.editDraft.conversationId,messageId:state.editDraft.messageId}:
      {type:'composer',conversationId:state.activeConversationId}
      for(const file of files){const record={id:uid(),name:file.name||'File',type:file.type||'application/octet-stream',
        size:file.size,blob:file,createdAt:Date.now()};try{await putFile(record)
        if(intent.type==='edit'){const draft=state.editDraft;if(draft&&draft.sessionId===intent.sessionId&&
          draft.conversationId===intent.conversationId&&draft.messageId===intent.messageId){
          if(!draft.attachmentIds.includes(record.id))draft.attachmentIds.push(record.id);renderMessages()}
          else toast('The file was saved to the library, but the edit session is closed.')}
        else if(state.activeConversationId===intent.conversationId){state.composerAttachmentIds.push(record.id);save();renderComposerFiles()}
        else toast('The file was saved to the library, but was not attached to another conversation.')}
        catch(error){toast('Unable to save “'+record.name+'”: '+error.message,'error')}}
      renderLibrary();preview()}
    async function attachFromLibrary(id){if(state.libraryTarget==='edit'){if(!state.editDraft)return toast('The edit session is closed.','error')
      if(!state.editDraft.attachmentIds.includes(id))state.editDraft.attachmentIds.push(id);renderMessages()}
      else{if(!state.composerAttachmentIds.includes(id))state.composerAttachmentIds.push(id);save();renderComposerFiles()}
      toast('File attached.','success');preview()}
    function send(){const conversation=active();if(!conversation)return;const content=$('composer-input').value
      if(!content.trim()&&!state.composerAttachmentIds.length)return
      conversation.messages.push({id:uid(),role:'user',content,attachmentIds:[...state.composerAttachmentIds]})
      conversation.title=title(conversation);state.composerText='';state.composerAttachmentIds=[];$('composer-input').value='';save();renderAll();
      $('chat-scroll').scrollTop=$('chat-scroll').scrollHeight}
    function usedIds(){const ids=new Set(state.composerAttachmentIds);for(const conversation of state.conversations)
      for(const message of conversation.messages)for(const id of message.attachmentIds||[])ids.add(id)
      for(const id of state.editDraft?.attachmentIds||[])ids.add(id);return ids}
    async function download(id){const file=await getFile(id);if(!file?.blob)return toast('File content is unavailable.','error')
      const url=URL.createObjectURL(file.blob),link=document.createElement('a');link.href=url;link.download=file.name.replace(/[/\\]/g,'_');
      document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
    async function showPreview(id){const file=await getFile(id);if(!file?.blob)return toast('File content is unavailable.','error')
      $('preview-title').textContent=file.name;const body=$('preview-body');body.replaceChildren()
      if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=''}
      if(file.type.startsWith('image/')){const image=document.createElement('img');image.style.cssText='display:block;max-width:100%;max-height:65dvh;margin:auto';
        image.alt=file.name;previewUrl=URL.createObjectURL(file.blob);image.src=previewUrl;body.append(image)}
      else if(file.type.startsWith('text/')||/json|xml|javascript/.test(file.type)){const pre=document.createElement('pre');
        pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 var(--font-mono)';
        pre.textContent=await file.blob.slice(0,262144).text();body.append(pre)}
      else{const p=document.createElement('p');p.textContent='No preview is available for this format.';body.append(p)}
      $('preview-dialog').showModal()}
    async function removeStored(id){if(usedIds().has(id))return toast('Remove the file from messages and drafts before deleting it.','error')
      const file=await getFile(id);if(file&&confirm('Permanently delete “'+file.name+'” from this device?')){await deleteFile(id);renderLibrary();toast('File deleted.','success')}}
    async function cleanup(){const used=usedIds(),files=await getFiles(),unused=files.filter(file=>!used.has(file.id))
      if(!unused.length)return toast('No unused files.');if(!confirm('Permanently delete '+unused.length+' unused files?'))return
      for(const file of unused)await deleteFile(file.id);renderLibrary();toast('Unused files deleted.','success')}
    function renderSidebar(){const query=$('conversation-search').value.trim().toLowerCase(),items=state.conversations.filter(conversation=>
      !query||conversation.title.toLowerCase().includes(query)||conversation.messages.some(message=>message.content.toLowerCase().includes(query)))
      $('conversation-list').innerHTML=items.length?'<div class="section-label">Recent</div>'+items.map(conversation=>
        '<div class="conversation '+(conversation.id===state.activeConversationId?'active':'')+'">'+
        '<button class="conversation-select" data-action="select-conversation" data-id="'+esc(conversation.id)+'">'+
        '<span class="conversation-title">'+esc(conversation.title)+'</span><span class="conversation-meta">'+conversation.messages.length+' messages</span></button>'+
        '<button class="conversation-delete" data-action="delete-conversation" data-id="'+esc(conversation.id)+'" aria-label="Delete">×</button></div>').join(''):
        '<div class="empty">No matching conversations.</div>'}
    async function fileRows(ids,mode){const files=await Promise.all(ids.map(id=>getFile(id).catch(()=>null)));return files.map((file,index)=>{
      const id=ids[index],remove=mode==='edit'?'<button class="remove" data-action="remove-edit-file" data-id="'+esc(id)+'" aria-label="Remove">×</button>':
        mode==='composer'?'<button class="remove" data-action="remove-composer-file" data-id="'+esc(id)+'" aria-label="Remove">×</button>':''
      return '<div class="attachment"><span class="attachment-icon">▱</span><span class="attachment-info"><span class="attachment-name">'+
        esc(file?.name||'Missing file')+'</span><span class="attachment-meta">'+esc(file?.type||'application/octet-stream')+' · '+
        bytes(file?.size||0)+'</span></span><button data-action="preview-file" data-id="'+esc(id)+'" aria-label="Preview">⌕</button>'+remove+'</div>'}).join('')}
    async function renderMessages(){const conversation=active(),list=$('message-list');$('top-title').textContent=conversation?.title||''
      if(!conversation?.messages.length){list.innerHTML='<div class="welcome"><span class="mark cut" style="margin:auto;width:60px;height:60px">◇</span>'+
        '<h1>AI Workbench</h1><p>Compose messages, attach files, and inspect request settings.</p></div>';return}
      const token=uid();list.dataset.token=token;const rows=[]
      for(const message of conversation.messages){const editing=state.editDraft?.messageId===message.id&&state.editDraft?.conversationId===conversation.id
        if(editing){const draft=state.editDraft,files=await fileRows(draft.attachmentIds,'edit');rows.push(
          '<article class="message"><div class="avatar">✎</div><div class="message-main"><div class="edit-box">'+
          '<div class="field" style="margin-top:0"><label for="edit-role">Role</label><select id="edit-role">'+
          ['system','developer','user','assistant'].map(role=>'<option value="'+role+'" '+(role===draft.role?'selected':'')+'>'+role+'</option>').join('')+
          '</select></div><div class="field"><label for="edit-content">Message</label><textarea id="edit-content">'+esc(draft.content)+'</textarea></div>'+
          '<div class="attachments">'+files+'</div><div class="edit-tools"><button class="button" data-action="choose-files" data-target="edit">⌕ From device</button>'+
          '<button class="button" data-action="open-library" data-target="edit">▤ File library</button></div><div class="edit-actions">'+
          '<button class="button" data-action="cancel-edit">Cancel</button><button class="button accent" data-action="save-edit">✓ Save</button>'+
          '</div></div></div></article>');continue}
        const files=await fileRows(message.attachmentIds||[],'message');rows.push('<article class="message"><div class="avatar">'+
          (message.role==='user'?'♙':message.role==='assistant'?'✦':'⌘')+'</div><div class="message-main"><div class="message-head"><span class="role">'+
          esc(message.role)+'</span></div>'+(message.content?'<div class="message-content">'+esc(message.content)+'</div>':'')+
          (files?'<div class="attachments">'+files+'</div>':'')+'<div class="message-actions"><button data-action="edit-message" data-id="'+esc(message.id)+
          '" aria-label="Edit">✎</button><button data-action="delete-message" data-id="'+esc(message.id)+'" aria-label="Delete">♲</button></div></div></article>')}
      if(list.dataset.token===token)list.innerHTML=rows.join('')}
    async function renderComposerFiles(){const html=await fileRows(state.composerAttachmentIds,'composer');$('pending-list').hidden=!html;$('pending-list').innerHTML=html}
    function renderSafety(){$('safety-grid').innerHTML=safetyCategories.map(item=>'<div class="safety-row"><label for="safety-'+esc(item[0])+'">'+
      esc(item[1])+'</label><select id="safety-'+esc(item[0])+'" data-safety="'+esc(item[0])+'">'+safetyThresholds.map(option=>
      '<option value="'+option[0]+'" '+(state.settings.safety[item[0]]===option[0]?'selected':'')+'>'+option[1]+'</option>').join('')+'</select></div>').join('')}
    function renderSettings(){$('accent-input').value=state.settings.accent;$('api-format').value=state.settings.apiFormat;
      $('base-url').value=state.settings.baseUrl;$('model-id').value=state.settings.model;$('api-key').value=state.settings.apiKey;
      $('system-prompt').value=state.settings.systemPrompt;$('temperature').value=state.settings.temperature;
      $('max-tokens').value=state.settings.maxTokens??'';$('safety-section').hidden=state.settings.apiFormat!=='gemini';renderSafety();applyAccent();preview()}
    function requestBody(){const conversation=active(),contents=(conversation?.messages||[]).map(message=>({role:message.role==='assistant'?'model':'user',
      parts:[...(message.content?[{text:message.content}]:[]),...(message.attachmentIds||[]).map(id=>({inlineData:{mimeType:'[file MIME]',data:'[base64]'},fileId:id}))]}))
      if(state.composerText.trim()||state.composerAttachmentIds.length)contents.push({role:'user',parts:[...(state.composerText?[{text:state.composerText}]:[]),
        ...state.composerAttachmentIds.map(id=>({inlineData:{mimeType:'[file MIME]',data:'[base64]'},fileId:id}))]})
      if(state.settings.apiFormat==='openai')return{model:state.settings.model||'[model]',input:contents,
        ...(state.settings.systemPrompt?{instructions:state.settings.systemPrompt}:{}),temperature:Number(state.settings.temperature),
        ...(state.settings.maxTokens?{max_output_tokens:Number(state.settings.maxTokens)}:{})}
      return{contents,...(state.settings.systemPrompt?{systemInstruction:{parts:[{text:state.settings.systemPrompt}]}}:{}),
        generationConfig:{temperature:Number(state.settings.temperature),...(state.settings.maxTokens?{maxOutputTokens:Number(state.settings.maxTokens)}:{})},
        safetySettings:safetyCategories.map(item=>({category:item[0],threshold:state.settings.safety[item[0]]}))}}
    let previewTimer
    function preview(){clearTimeout(previewTimer);previewTimer=setTimeout(()=>$('request-preview').value=JSON.stringify(requestBody(),null,2),50)}
    async function renderLibrary(){if(!db||!$('library-dialog').open)return;const query=$('library-search').value.toLowerCase(),used=usedIds()
      const files=(await getFiles()).sort((a,b)=>b.createdAt-a.createdAt).filter(file=>file.name.toLowerCase().includes(query))
      $('library-list').innerHTML=files.length?files.map(file=>'<li class="library-item"><span class="library-info"><strong class="attachment-name">'+
        esc(file.name)+'</strong><span class="attachment-meta">'+esc(file.type)+' · '+bytes(file.size)+(used.has(file.id)?' · In use':'')+
        '</span></span><span class="library-actions"><button class="icon" data-action="preview-file" data-id="'+esc(file.id)+'" aria-label="Preview">⌕</button>'+
        '<button class="icon" data-action="download-file" data-id="'+esc(file.id)+'" aria-label="Download">↓</button>'+
        '<button class="icon" data-action="attach-library-file" data-id="'+esc(file.id)+'" aria-label="Attach">＋</button>'+
        '<button class="icon" data-action="delete-file" data-id="'+esc(file.id)+'" '+(used.has(file.id)?'disabled':'')+' aria-label="Delete">×</button></span></li>').join(''):
        '<li class="empty">No matching files.</li>'}
    function applyAccent(){const color=/^#[0-9a-f]{6}$/i.test(state.settings.accent)?state.settings.accent:'#00f6ff';
      const rgb=[1,3,5].map(index=>parseInt(color.slice(index,index+2),16)).join(',');document.documentElement.style.setProperty('--color-accent',color);
      document.documentElement.style.setProperty('--accent-rgb',rgb)}
    function connection(){const online=navigator.onLine;$('status').classList.toggle('offline',!online);$('status-label').textContent=online?'Ready':'Offline'}
    function renderAll(){$('composer-input').value=state.composerText;renderSidebar();renderMessages();renderComposerFiles();renderSettings();connection()}
    function openDrawer(id){closeDrawers();$(id).classList.add('open');$('backdrop').classList.add('open')}
    function closeDrawers(){$('sidebar').classList.remove('open');$('settings').classList.remove('open');$('backdrop').classList.remove('open')}
    function closeDialog(id){if($(id)?.open)$(id).close();if(id==='preview-dialog'&&previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=''}}
    async function action(button){const name=button.dataset.action,id=button.dataset.id
      if(name==='new-conversation')newConversation();else if(name==='select-conversation')selectConversation(id)
      else if(name==='delete-conversation')deleteConversation(id);else if(name==='open-sidebar')openDrawer('sidebar')
      else if(name==='open-settings')openDrawer('settings');else if(name==='close-drawers')closeDrawers()
      else if(name==='choose-files'){state.fileTarget=button.dataset.target||'composer';$('file-input').click()}
      else if(name==='send-message')send();else if(name==='edit-message')beginEdit(id);else if(name==='save-edit')saveEdit()
      else if(name==='cancel-edit')cancelEdit();else if(name==='remove-edit-file')removeEditFile(id)
      else if(name==='remove-composer-file')removeComposerFile(id);else if(name==='delete-message')deleteMessage(id)
      else if(name==='open-library'){state.libraryTarget=button.dataset.target||'composer';$('library-dialog').showModal();await renderLibrary()}
      else if(name==='close-dialog')closeDialog(button.dataset.dialog);else if(name==='attach-library-file')await attachFromLibrary(id)
      else if(name==='preview-file')await showPreview(id);else if(name==='download-file')await download(id)
      else if(name==='delete-file')await removeStored(id);else if(name==='cleanup-files')await cleanup()
      else if(name==='copy-request'){try{await navigator.clipboard.writeText($('request-preview').value);toast('Request body copied.','success')}
        catch{toast('Unable to copy.','error')}}
      else if(name==='reset-settings'&&confirm('Reset settings? Conversations and files are retained.')){
        state.settings=defaults();save();renderSettings()}}
    document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button&&!button.disabled)action(button).catch(error=>toast(error.message,'error'))})
    document.addEventListener('input',event=>{const element=event.target
      if(element.id==='conversation-search')renderSidebar();else if(element.id==='library-search')renderLibrary()
      else if(element.id==='composer-input'){state.composerText=element.value;save();preview()}
      else if(element.id==='edit-content'&&state.editDraft)state.editDraft.content=element.value
      else{const fields={accent-input:'accent',base-url:'baseUrl',model-id:'model',api-key:'apiKey',system-prompt:'systemPrompt',
        temperature:'temperature',max-tokens:'maxTokens'};const property=fields[element.id];if(property){state.settings[property]=
        property==='temperature'?Number(element.value):property==='maxTokens'?(element.value?Number(element.value):null):element.value;
        if(property==='accent')applyAccent();save();preview()}}})
    document.addEventListener('change',event=>{const element=event.target
      if(element.id==='file-input'){const files=Array.from(element.files||[]);element.value='';addFiles(files,state.fileTarget);state.fileTarget='composer'}
      else if(element.id==='api-format'){state.settings.apiFormat=element.value;state.settings.baseUrl=element.value==='gemini'?
        'https://generativelanguage.googleapis.com/v1beta':'https://api.openai.com/v1';save();renderSettings()}
      else if(element.id==='edit-role'&&state.editDraft)state.editDraft.role=element.value
      else if(element.dataset.safety){state.settings.safety[element.dataset.safety]=element.value;save();preview()}})
    document.addEventListener('keydown',event=>{if(event.isComposing)return;if(event.key==='Escape')closeDrawers()
      if(event.key==='Enter'&&!event.shiftKey&&event.target.id==='composer-input'){event.preventDefault();send()}})
    $('library-dialog').addEventListener('close',()=>state.libraryTarget='composer')
    window.addEventListener('online',connection);window.addEventListener('offline',connection)
    async function init(){load();try{db=await openDb()}catch(error){toast('File storage is unavailable: '+error.message,'error')}renderAll()}
    init().catch(error=>toast(error.message,'error'))
  </script>
</body>
</html>
