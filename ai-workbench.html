<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05080d">
  <title>AI Workbench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%2305080d'/%3E%3Cpath d='M8 32 21 17l11 15-11 15L8 32Zm24 0 11-15 13 15-13 15-11-15Z' fill='none' stroke='%2300f6ff' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    /* Tailwind CSS @theme static output: tokens are compiled, no runtime Tailwind dependency. */
    :root {
      color-scheme: dark;
      --color-bg:#05080d;
      --color-bg-deep:#020408;
      --color-panel:#09121b;
      --color-panel-2:#0d1b27;
      --color-panel-3:#122635;
      --color-border:#1b3d4d;
      --color-border-strong:#326174;
      --color-text:#e9fbff;
      --color-muted:#9fb3bd;
      --color-faint:#708791;
      --color-accent:#00f6ff;
      --accent-rgb:0,246,255;
      --color-accent-soft:rgba(var(--accent-rgb),.12);
      --color-accent-strong:#a9fdff;
      --color-accent-ink:#021014;
      --color-danger:#ff4166;
      --color-danger-soft:rgba(255,65,102,.12);
      --color-success:#42f593;
      --color-success-soft:rgba(66,245,147,.11);
      --font-ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --font-mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
      --radius:4px;
      --shadow:0 18px 50px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--color-bg-deep)}
    body{color:var(--color-text);font:14px/1.55 var(--font-ui)}
    button,input,select,textarea{color:inherit;font:inherit}
    button{cursor:pointer}
    button:disabled,input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.48}
    :focus-visible{outline:1px solid var(--color-accent);outline-offset:2px;box-shadow:0 0 12px rgba(var(--accent-rgb),.35)}
    ::selection{background:var(--color-accent);color:var(--color-accent-ink)}
    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-thumb{background:var(--color-border-strong)}
    [hidden]{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
    .mono{font-family:var(--font-mono)}
    .app{display:grid;grid-template-columns:280px minmax(0,1fr) 330px;height:100dvh;background:var(--color-bg)}
    .sidebar,.settings{min-width:0;background:linear-gradient(180deg,rgba(var(--accent-rgb),.05),transparent 160px),var(--color-panel);overflow:hidden}
    .sidebar{border-right:1px solid var(--color-border)}
    .settings{border-left:1px solid var(--color-border)}
    .panel-inner{display:flex;flex-direction:column;height:100%}
    .panel-head,.topbar{display:flex;align-items:center;gap:8px}
    .panel-head{padding:12px 13px;border-bottom:1px solid rgba(50,97,116,.45)}
    .brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
    .brand-mark{display:grid;place-items:center;width:32px;height:32px;flex:none;border:1px solid var(--color-accent);background:var(--color-accent-soft);clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
    .brand-mark svg{width:21px;height:21px}
    .brand strong{display:block;font-size:13px;text-transform:uppercase}
    .brand small{display:block;color:var(--color-accent);font:9px var(--font-mono)}
    .panel-body{flex:1;min-height:0;overflow:auto;padding:12px}
    .sidebar .panel-body{display:flex;flex-direction:column;gap:9px}
    .conversation-list{flex:1;min-height:0;overflow:auto}
    .conversation{display:grid;grid-template-columns:minmax(0,1fr) auto;border:1px solid transparent}
    .conversation.active{background:var(--color-accent-soft);border-color:rgba(var(--accent-rgb),.42)}
    .conversation-select{min-width:0;padding:9px 8px;background:none;border:0;text-align:left}
    .conversation-title,.conversation-meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .conversation-meta{color:var(--color-faint);font:10px var(--font-mono)}
    .conversation-actions{display:flex;align-items:center}
    .topbar{height:54px;flex:none;padding:9px 13px;border-bottom:1px solid var(--color-border-strong);background:rgba(9,18,27,.96)}
    .topbar-title{min-width:0;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-muted);font-size:12px}
    .status{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--color-border-strong);padding:6px 9px;font:10px var(--font-mono);color:var(--color-muted)}
    .main{display:flex;flex-direction:column;min-width:0;min-height:0}
    .chat{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}
    .messages{flex:1;min-height:0;overflow:auto;background:linear-gradient(rgba(27,61,77,.25) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(27,61,77,.25) 1px,transparent 1px) 0 0/32px 32px,var(--color-bg)}
    .message-list{width:100%;max-width:900px;margin:auto;padding:16px 18px}
    .welcome{min-height:calc(100dvh - 180px);display:grid;place-items:center;text-align:center}
    .welcome h1{font-size:28px;margin:0;text-transform:uppercase;text-shadow:0 0 22px rgba(var(--accent-rgb),.4)}
    .message{display:grid;grid-template-columns:34px minmax(0,1fr);gap:11px;padding:15px 2px}
    .message+.message{border-top:1px dashed rgba(50,97,116,.5)}
    .avatar{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--color-border);background:var(--color-panel-2);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
    .message.assistant .avatar,.message.system .avatar,.message.developer .avatar{border-color:var(--color-accent);color:var(--color-accent)}
    .message-head{display:flex;gap:7px;align-items:center;margin-bottom:6px}
    .role,.model{padding:2px 7px;border:1px solid var(--color-border);background:var(--color-panel-2);color:var(--color-muted);font:10px var(--font-mono)}
    .bubble,.editor{position:relative;padding:11px 13px;border:1px solid var(--color-border);background:var(--color-panel-2);overflow-wrap:anywhere}
    .message.system .bubble,.message.developer .bubble{background:var(--color-accent-soft);border-left:3px solid var(--color-accent)}
    .message-actions,.row-actions,.dialog-actions,.toolbar,.inline-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
    .message-actions{margin-top:7px}
    .part-stack,.output-stack{display:grid;gap:7px;margin-top:8px}
    .secondary,.file-row,.part-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 9px;border:1px solid var(--color-border);background:var(--color-panel)}
    .secondary button{justify-self:end}
    .secondary-main{min-width:0}
    .secondary-main strong,.secondary-main small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .secondary-main small{color:var(--color-faint)}
    .reasoning{margin-top:8px;border:1px solid rgba(var(--accent-rgb),.4);background:var(--color-panel)}
    .reasoning summary{padding:7px 9px;color:var(--color-accent);font:10px var(--font-mono);cursor:pointer}
    .reasoning-body{padding:8px 10px;border-top:1px solid rgba(var(--accent-rgb),.2)}
    .error{margin-top:8px;padding:9px 11px;border:1px solid var(--color-danger);background:var(--color-danger-soft)}
    .composer-wrap{flex:none;padding:8px 13px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--color-bg) 72%,transparent)}
    .composer{max-width:900px;margin:auto}
    .parts-tabs{display:flex;gap:5px;overflow:auto;padding:0 1px 6px}
    .part-tab{display:flex;align-items:stretch;flex:none;max-width:250px;border:1px solid var(--color-border);background:var(--color-panel-2)}
    .part-tab.active{border-color:var(--color-accent);background:var(--color-accent-soft)}
    .part-tab>button:first-child{min-width:0;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .composer-box{border:1px solid var(--color-border-strong);background:var(--color-panel)}
    .composer-box:focus-within{border-color:var(--color-accent);box-shadow:inset 0 0 30px var(--color-accent-soft)}
    .composer textarea{display:block;width:100%;max-height:210px;min-height:54px;padding:12px 13px 4px;border:0;outline:0;resize:none;background:none}
    .toolbar{padding:6px 8px 8px}
    .toolbar .spacer{flex:1}
    .selected-file{padding:12px}
    .button,.icon-button,.send{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--color-border-strong);background:var(--color-panel-2);min-height:34px;padding:6px 11px;color:var(--color-text)}
    .button.accent,.send{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink);font-weight:700}
    .button.danger{border-color:var(--color-danger);color:var(--color-danger);background:var(--color-danger-soft)}
    .button.small{min-height:29px;padding:4px 8px;font-size:11px}
    .icon-button,.send{width:34px;height:34px;padding:0;flex:none}
    .send{width:40px;height:40px}
    .button:hover:not(:disabled),.icon-button:hover:not(:disabled){border-color:var(--color-accent);color:var(--color-accent-strong);background:var(--color-accent-soft)}
    .send:hover:not(:disabled){background:var(--color-accent-strong);color:var(--color-accent-ink)}
    .primary{width:100%;min-height:40px}
    .field{margin-bottom:14px}
    .field label,.section-title{display:block;margin-bottom:5px;font-weight:650}
    .section{padding-bottom:17px;margin-bottom:17px;border-bottom:1px solid rgba(50,97,116,.45)}
    .section-title{color:var(--color-accent);font:600 10px var(--font-mono)}
    .section-title::before{content:"// ";color:var(--color-faint)}
    .input,.select,.textarea{width:100%;border:1px solid var(--color-border);background:var(--color-panel-2);padding:8px 10px;border-radius:var(--radius)}
    .textarea{resize:vertical;min-height:76px}
    .hint{margin:5px 0 0;color:var(--color-faint);font-size:11px}
    .search-wrap{position:relative}
    .search-wrap input{padding-right:35px}
    .search-clear{position:absolute;right:3px;top:3px}
    .storage-warning{padding:8px 12px;background:var(--color-danger-soft);border-bottom:1px solid var(--color-danger);font-size:12px}
    .markdown{line-height:1.65;overflow-wrap:anywhere}
    .markdown>:first-child{margin-top:0}.markdown>:last-child{margin-bottom:0}
    .markdown p,.markdown ul,.markdown ol,.markdown blockquote,.markdown pre{margin:8px 0}
    .markdown h1,.markdown h2,.markdown h3{line-height:1.3;margin:14px 0 6px}
    .markdown h1{font-size:20px}.markdown h2{font-size:17px}.markdown h3{font-size:15px}
    .markdown blockquote{border-left:3px solid var(--color-accent);background:var(--color-accent-soft);padding:5px 11px;color:var(--color-muted)}
    .markdown code{font-family:var(--font-mono);background:var(--color-panel);color:var(--color-accent-strong);padding:1px 4px}
    .code-block{margin:10px 0;border:1px solid var(--color-border);background:var(--color-bg-deep)}
    .code-head{display:flex;justify-content:flex-end;padding:4px;border-bottom:1px solid var(--color-border)}
    .code-block pre{margin:0;overflow:auto;padding:10px 12px}
    .code-block pre code{padding:0;background:none;color:var(--color-text)}
    dialog{width:min(650px,calc(100vw - 28px));max-height:calc(100dvh - 28px);padding:0;border:1px solid var(--color-border-strong);background:var(--color-panel);color:var(--color-text);box-shadow:var(--shadow)}
    dialog::backdrop{background:rgba(0,3,8,.8)}
    .dialog-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--color-border);background:linear-gradient(90deg,var(--color-accent-soft),transparent)}
    .dialog-head h2{margin:0;font-size:14px;text-transform:uppercase}
    .dialog-body{padding:14px;max-height:calc(100dvh - 82px);overflow:auto}
    .dialog-actions{justify-content:flex-end;margin-top:14px}
    .file-list{display:grid;gap:7px;margin-top:10px}
    .empty{padding:15px;border:1px dashed var(--color-border-strong);text-align:center;color:var(--color-faint)}
    .toast-region{position:fixed;z-index:1000;right:16px;top:16px;display:grid;gap:7px;width:min(360px,calc(100vw - 32px));pointer-events:none}
    .toast{padding:9px 11px;border:1px solid var(--color-border-strong);border-left:3px solid var(--color-accent);background:var(--color-panel);box-shadow:var(--shadow);pointer-events:auto}
    .toast.error-toast{border-left-color:var(--color-danger)}
    .loading-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--color-success);box-shadow:0 0 8px var(--color-success)}
    @media(max-width:1199px){
      .app{grid-template-columns:1fr}
      .sidebar,.settings{position:fixed;z-index:50;top:0;bottom:0;width:min(340px,92vw);box-shadow:var(--shadow);transition:transform .2s}
      .sidebar{left:0;transform:translateX(-105%)}.settings{right:0;transform:translateX(105%)}
      .sidebar.open,.settings.open{transform:translateX(0)}
    }
    @media(max-width:640px){
      .message-list{padding:10px}.message{grid-template-columns:28px minmax(0,1fr);gap:7px}.avatar{width:27px;height:27px}
      .topbar{padding:7px 9px}.status{max-width:150px}.settings{width:94vw}
      .secondary,.file-row,.part-row{grid-template-columns:auto minmax(0,1fr)}.secondary>.row-actions,.file-row>.row-actions,.part-row>.row-actions{grid-column:1/-1}
      input,select,textarea{font-size:16px}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
  <script src="https://unpkg.com/json5@2.2.3/dist/index.min.js"></script>
  <script src="https://unpkg.com/commonmark@0.31.2/dist/commonmark.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Lịch sử hội thoại">
      <div class="panel-inner">
        <div class="panel-head">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12 7 5l5 7-5 7-5-7Zm10 0 5-7 5 7-5 7-5-7Z"/></svg></span>
            <span><strong>AI Workbench</strong><small>Multi-model workbench</small></span>
          </div>
          <button class="icon-button" data-action="close-panels" aria-label="Đóng">×</button>
        </div>
        <div class="panel-body">
          <button class="button accent primary" data-action="new-conversation">＋ Hội thoại mới</button>
          <div class="search-wrap">
            <label class="sr-only" for="conversation-search">Tìm hội thoại</label>
            <input class="input" id="conversation-search" type="search" placeholder="Tìm tiêu đề hoặc nội dung">
            <button class="icon-button search-clear" data-action="clear-search" aria-label="Xoá tìm kiếm">×</button>
          </div>
          <nav class="conversation-list" id="conversation-list"></nav>
          <button class="button small" data-action="export-state">Xuất lịch sử và cài đặt</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button" data-action="toggle-sidebar" aria-label="Mở lịch sử">☰</button>
        <div class="topbar-title" id="conversation-heading"></div>
        <span class="status" id="status"><span class="loading-dot"></span> Sẵn sàng</span>
        <button class="icon-button" data-action="open-library" data-target="composer" aria-label="Thư viện tệp">▤</button>
        <button class="icon-button" data-action="toggle-settings" aria-label="Mở cài đặt">☷</button>
      </header>
      <div class="storage-warning" id="dependency-warning" hidden></div>
      <section class="chat" aria-label="Hội thoại hiện tại">
        <div class="messages" id="messages-scroll">
          <div class="message-list" id="message-list"></div>
        </div>
        <div class="composer-wrap">
          <div class="composer">
            <div class="parts-tabs" id="composer-tabs"></div>
            <div class="composer-box">
              <textarea id="composer-input" rows="1" placeholder="Nhập tin nhắn"></textarea>
              <div class="selected-file" id="composer-file" hidden></div>
              <div class="toolbar">
                <button class="icon-button" data-action="add-text" data-scope="composer" aria-label="Thêm phần văn bản" title="Thêm văn bản">T</button>
                <button class="icon-button" data-action="pick-file" data-scope="composer" aria-label="Thêm tệp từ thiết bị" title="Tệp từ thiết bị">＋</button>
                <button class="icon-button" data-action="attach-url" data-scope="composer" aria-label="Thêm tệp từ URL" title="Tệp từ URL">↗</button>
                <button class="icon-button" data-action="open-library" data-target="composer" aria-label="Thư viện tệp" title="Thư viện tệp">▤</button>
                <span class="spacer"></span>
                <button class="send" id="send-button" data-action="send" aria-label="Gửi">➤</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <aside class="settings" id="settings" aria-label="Cài đặt">
      <div class="panel-inner">
        <div class="panel-head">
          <strong>Cài đặt</strong>
          <span style="flex:1"></span>
          <button class="icon-button" data-action="close-panels" aria-label="Đóng">×</button>
        </div>
        <div class="panel-body">
          <section class="section">
            <h3 class="section-title">Endpoint và model</h3>
            <div class="field"><label for="api-format">Định dạng API</label><select class="select" id="api-format">
              <option value="responses">Responses</option><option value="chat-completions">Chat Completions</option>
              <option value="messages">Messages</option><option value="generate-content">Generate Content</option>
              <option value="interactions">Interactions</option>
            </select></div>
            <div class="field"><label for="base-url">Base URL</label><input class="input mono" id="base-url" type="url"></div>
            <div class="field"><label for="api-key">API key</label><input class="input mono" id="api-key" type="password" autocomplete="off"></div>
            <div class="field"><label for="model-id">Model ID</label><input class="input mono" id="model-id" type="text"></div>
          </section>
          <section class="section">
            <h3 class="section-title">System prompt</h3>
            <textarea class="textarea" id="system-prompt" rows="4" placeholder="Chỉ dẫn dùng chung"></textarea>
          </section>
          <section class="section" id="safety-section">
            <h3 class="section-title">Safety thresholds</h3>
            <div id="safety-fields"></div>
            <p class="hint">Default không được gửi. Các giá trị khác được gửi nguyên dạng.</p>
          </section>
          <section class="section">
            <h3 class="section-title">Yêu cầu</h3>
            <textarea class="textarea mono" id="request-preview" rows="14" readonly></textarea>
            <div class="inline-actions" style="margin-top:7px"><button class="button small" data-action="copy-preview">Sao chép</button></div>
          </section>
          <section class="section">
            <h3 class="section-title">Dữ liệu cục bộ</h3>
            <div class="inline-actions">
              <button class="button small" data-action="import-state">Nhập</button>
              <button class="button small" data-action="export-state">Xuất</button>
              <button class="button small danger" data-action="cleanup-files">Dọn tệp không dùng</button>
            </div>
          </section>
        </div>
      </div>
    </aside>
  </div>

  <dialog id="edit-dialog">
    <div class="dialog-head"><h2>Sửa tin nhắn</h2><button class="icon-button" data-action="cancel-edit" aria-label="Đóng">×</button></div>
    <div class="dialog-body">
      <div class="field"><label for="edit-role">Vai trò</label><select class="select" id="edit-role">
        <option value="system">system</option><option value="developer">developer</option><option value="user">user</option><option value="assistant">assistant</option>
      </select></div>
      <div class="parts-tabs" id="edit-tabs"></div>
      <textarea class="textarea" id="edit-input" rows="6"></textarea>
      <div class="selected-file" id="edit-file" hidden></div>
      <div class="inline-actions" style="margin-top:8px">
        <button class="button small" data-action="add-text" data-scope="edit">＋ Văn bản</button>
        <button class="button small" data-action="pick-file" data-scope="edit">＋ Tệp</button>
        <button class="button small" data-action="attach-url" data-scope="edit">＋ URL</button>
        <button class="button small" data-action="open-library" data-target="edit">Thư viện</button>
      </div>
      <section id="edit-output-section" style="margin-top:15px">
        <h3 class="section-title">Tệp do AI tạo</h3>
        <div class="output-stack" id="edit-output-files"></div>
      </section>
      <div class="dialog-actions">
        <button class="button" data-action="cancel-edit">Huỷ</button>
        <button class="button accent" id="save-edit-button" data-action="save-edit">Lưu</button>
      </div>
    </div>
  </dialog>

  <dialog id="library-dialog">
    <div class="dialog-head"><h2>Thư viện tệp</h2><button class="icon-button" data-action="close-library" aria-label="Đóng">×</button></div>
    <div class="dialog-body">
      <input class="input" id="library-search" type="search" placeholder="Tìm tệp">
      <div class="file-list" id="file-list"></div>
    </div>
  </dialog>

  <dialog id="metadata-dialog">
    <div class="dialog-head"><h2>Sửa metadata tệp</h2><button class="icon-button" data-action="close-metadata" aria-label="Đóng">×</button></div>
    <div class="dialog-body">
      <div class="field"><label for="metadata-name">Tên tệp</label><input class="input" id="metadata-name" type="text"></div>
      <div class="field"><label for="metadata-mime">MIME type</label><input class="input mono" id="metadata-mime" type="text">
        <div class="inline-actions" style="margin-top:6px"><button class="button small" data-action="detect-mime">Nhận diện lại</button></div>
      </div>
      <div class="dialog-actions"><button class="button" data-action="close-metadata">Huỷ</button><button class="button accent" data-action="save-metadata">Lưu</button></div>
    </div>
  </dialog>

  <dialog id="text-preview-dialog">
    <div class="dialog-head"><h2 id="text-preview-title">Văn bản</h2><button class="icon-button" data-action="close-text-preview" aria-label="Đóng">×</button></div>
    <div class="dialog-body markdown" id="text-preview-content"></div>
  </dialog>

  <dialog id="file-preview-dialog">
    <div class="dialog-head"><h2 id="file-preview-title">Tệp</h2><button class="icon-button" data-action="close-file-preview" aria-label="Đóng">×</button></div>
    <div class="dialog-body" id="file-preview-content"></div>
  </dialog>

  <input id="file-input" type="file" multiple hidden>
  <input id="import-input" type="file" accept=".json,application/json" hidden>
  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

  <script>
  'use strict'
  ;(() => {
    const STORAGE_KEY = 'ai-workbench.compact.state'
    const DB_NAME = 'ai-workbench'
    const DB_STORE = 'files'
    const DEFAULT_THRESHOLD = 'HARM_BLOCK_THRESHOLD_UNSPECIFIED'
    const safetyCategories = [
      ['HARM_CATEGORY_HARASSMENT','Harassment'],
      ['HARM_CATEGORY_HATE_SPEECH','Hate speech'],
      ['HARM_CATEGORY_SEXUALLY_EXPLICIT','Sexually explicit'],
      ['HARM_CATEGORY_DANGEROUS_CONTENT','Dangerous content'],
      ['HARM_CATEGORY_JAILBREAK','Jailbreak']
    ]
    const safetyOptions = [
      [DEFAULT_THRESHOLD,'Default'],
      ['OFF','Off'],
      ['BLOCK_NONE','Block none'],
      ['BLOCK_ONLY_HIGH','Block few'],
      ['BLOCK_MEDIUM_AND_ABOVE','Block some'],
      ['BLOCK_LOW_AND_ABOVE','Block most']
    ]
    const baseUrls = {
      responses:'https://api.openai.com/v1',
      'chat-completions':'https://api.openai.com/v1',
      messages:'https://api.anthropic.com',
      'generate-content':'https://generativelanguage.googleapis.com/v1beta',
      interactions:'https://generativelanguage.googleapis.com/v1beta'
    }
    const state = {
      conversations:[],
      activeId:null,
      search:'',
      draft:{main:'',parts:[],active:'main',selections:{}},
      settings:{
        format:'responses',baseUrl:baseUrls.responses,apiKey:'',model:'',systemPrompt:'',
        safety:Object.fromEntries(safetyCategories.map(([key])=>[key,DEFAULT_THRESHOLD]))
      }
    }
    const files = new Map()
    let db = null
    let editDraft = null
    let libraryTarget = 'composer'
    let metadataDraft = null
    let metadataFromEdit = false
    let pendingEditFiles = 0
    let requestController = null
    let dependencyFailure = false

    const $ = id => document.getElementById(id)
    const $$ = (selector,root=document) => Array.from(root.querySelectorAll(selector))
    const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2)
    const clone = value => structuredClone ? structuredClone(value) : JSON.parse(JSON.stringify(value))
    const esc = value => String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))
    const currentConversation = () => state.conversations.find(item=>item.id===state.activeId)||null
    const fileRecord = id => files.get(id)||null
    const textMime = type => /^text\//.test(type)||/\/(?:json|xml|x-ndjson)$/.test(type)
    const humanBytes = size => size<1024?size+' B':size<1048576?(size/1024).toFixed(1)+' KB':(size/1048576).toFixed(1)+' MB'
    const dataUrl = async record => {
      const bytes = new Uint8Array(await record.blob.arrayBuffer())
      let binary=''
      for(let i=0;i<bytes.length;i+=32768) binary+=String.fromCharCode(...bytes.subarray(i,i+32768))
      return 'data:'+record.mime+';base64,'+btoa(binary)
    }
    const base64 = async blob => {
      const bytes=new Uint8Array(await blob.arrayBuffer());let binary=''
      for(let i=0;i<bytes.length;i+=32768) binary+=String.fromCharCode(...bytes.subarray(i,i+32768))
      return btoa(binary)
    }
    function toast(message,error=false){
      const item=document.createElement('div');item.className='toast'+(error?' error-toast':'');item.textContent=message
      $('toasts').append(item);setTimeout(()=>item.remove(),4200)
    }
    function showDialog(id){const dialog=$(id);if(!dialog.open)dialog.showModal()}
    function closeDialog(id){const dialog=$(id);if(dialog.open)dialog.close()}
    function save(){
      localStorage.setItem(STORAGE_KEY,JSON.stringify({
        conversations:state.conversations,activeId:state.activeId,draft:state.draft,settings:state.settings
      }))
    }
    function load(){
      try{
        const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')
        if(saved&&Array.isArray(saved.conversations)){
          state.conversations=saved.conversations
          state.activeId=saved.activeId
          state.draft={main:'',parts:[],active:'main',selections:{},...(saved.draft||{})}
          state.settings={...state.settings,...(saved.settings||{})}
          state.settings.safety={...state.settings.safety,...(saved.settings?.safety||{})}
        }
      }catch(error){toast('Không đọc được dữ liệu cục bộ: '+error.message,true)}
    }
    function openDatabase(){
      return new Promise((resolve,reject)=>{
        const request=indexedDB.open(DB_NAME,1)
        request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(DB_STORE))request.result.createObjectStore(DB_STORE,{keyPath:'id'})}
        request.onsuccess=()=>resolve(request.result)
        request.onerror=()=>reject(request.error)
      })
    }
    function dbRequest(mode,operation){
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(DB_STORE,mode),store=tx.objectStore(DB_STORE),request=operation(store)
        request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)
      })
    }
    async function loadFiles(){
      const records=await dbRequest('readonly',store=>store.getAll())
      files.clear();records.forEach(record=>files.set(record.id,record))
    }
    async function putFile(record){await dbRequest('readwrite',store=>store.put(record));files.set(record.id,record)}
    async function deleteFile(id){await dbRequest('readwrite',store=>store.delete(id));files.delete(id)}
    async function detectMime(blob,name){
      const bytes=new Uint8Array(await blob.slice(0,8192).arrayBuffer())
      const ascii=new TextDecoder().decode(bytes)
      if(bytes.length>=8&&[137,80,78,71,13,10,26,10].every((v,i)=>bytes[i]===v))return'image/png'
      if(bytes[0]===255&&bytes[1]===216&&bytes[2]===255)return'image/jpeg'
      if(/^GIF8[79]a/.test(ascii))return'image/gif'
      if(ascii.slice(0,4)==='RIFF'&&ascii.slice(8,12)==='WEBP')return'image/webp'
      if(ascii.startsWith('%PDF-'))return'application/pdf'
      if(ascii.slice(0,4)==='PK\x03\x04')return'application/zip'
      if(/^\s*<svg[\s>]/i.test(ascii))return'image/svg+xml'
      if(/^\s*(?:<!doctype html|<html[\s>])/i.test(ascii))return'text/html'
      const ext=String(name).toLowerCase().split('.').pop()
      const map={txt:'text/plain',md:'text/markdown',json:'application/json',csv:'text/csv',html:'text/html',css:'text/css',js:'text/javascript',ts:'text/typescript',xml:'application/xml',pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp'}
      if(map[ext])return map[ext]
      if(!bytes.includes(0))return'text/plain'
      return'application/octet-stream'
    }
    async function storeBlob(blob,name,origin='attachment'){
      const mime=blob.type&&blob.type!=='application/octet-stream'?blob.type:await detectMime(blob,name)
      const record={id:uid(),name:name||'file',mime,size:blob.size,blob:blob.slice(0,blob.size,mime),origin,createdAt:Date.now()}
      await putFile(record);return record
    }
    function capture(scope){
      const target=scope==='edit'?editDraft:state.draft
      const input=scope==='edit'?$('edit-input'):$('composer-input')
      if(!target||input.hidden)return
      const id=target.active||'main'
      if(id==='main')target.main=input.value
      else{const part=target.parts.find(item=>item.id===id&&item.type==='text');if(part)part.content=input.value}
      target.selections[id]={start:input.selectionStart||0,end:input.selectionEnd||0}
    }
    function target(scope){return scope==='edit'?editDraft:state.draft}
    function activePart(targetValue){
      return targetValue.active==='main'?{id:'main',type:'text',content:targetValue.main}:targetValue.parts.find(item=>item.id===targetValue.active)
    }
    function partLabel(part,index){
      if(part.id==='main')return'Tin nhắn'
      if(part.type==='text')return'Văn bản '+(index+1)
      return fileRecord(part.fileId)?.name||'Tệp'
    }
    function tabsHtml(targetValue,scope){
      const all=[{id:'main',type:'text'},...targetValue.parts]
      return all.map((part,index)=>{
        const active=part.id===targetValue.active,main=part.id==='main'
        return '<div class="part-tab '+(active?'active':'')+'">'+
          '<button class="button small" data-action="select-part" data-scope="'+scope+'" data-id="'+esc(part.id)+'">'+esc(partLabel(part,index-1))+'</button>'+
          (main?'':'<button class="icon-button" data-action="move-part" data-scope="'+scope+'" data-id="'+esc(part.id)+'" data-direction="-1" '+(index===1?'disabled':'')+' aria-label="Sang trái">←</button>'+
          '<button class="icon-button" data-action="move-part" data-scope="'+scope+'" data-id="'+esc(part.id)+'" data-direction="1" '+(index===all.length-1?'disabled':'')+' aria-label="Sang phải">→</button>'+
          '<button class="icon-button" data-action="remove-part" data-scope="'+scope+'" data-id="'+esc(part.id)+'" aria-label="Xoá">×</button>')+'</div>'
      }).join('')
    }
    function fileCard(record,context='composer'){
      if(!record)return'<div class="empty">Không tìm thấy tệp.</div>'
      return '<div class="file-row"><span aria-hidden="true">▤</span><span class="secondary-main"><strong>'+esc(record.name)+'</strong><small>'+esc(record.mime)+' · '+humanBytes(record.size)+'</small></span>'+
        '<span class="row-actions"><button class="icon-button" data-action="preview-file" data-file-id="'+record.id+'" aria-label="Xem">⌕</button>'+
        '<button class="icon-button" data-action="open-metadata" data-file-id="'+record.id+'" data-context="'+context+'" aria-label="Sửa metadata">✎</button></span></div>'
    }
    function renderComposer(){
      const draft=state.draft
      if(!draft.parts.some(item=>item.id===draft.active))draft.active='main'
      $('composer-tabs').innerHTML=tabsHtml(draft,'composer')
      const part=activePart(draft),input=$('composer-input'),file=$('composer-file')
      if(part?.type==='file'){input.hidden=true;file.hidden=false;file.innerHTML=fileCard(fileRecord(part.fileId),'composer')}
      else{
        input.hidden=false;file.hidden=true;file.innerHTML=''
        const value=part?.id==='main'?draft.main:part?.content||''
        if(input.value!==value)input.value=value
        input.placeholder=part?.id==='main'?'Nhập tin nhắn':'Nhập phần văn bản'
        input.style.height='auto';input.style.height=Math.min(210,input.scrollHeight)+'px'
      }
      updateSend();schedulePreview()
    }
    function renderEdit(){
      if(!editDraft)return
      if(!editDraft.parts.some(item=>item.id===editDraft.active))editDraft.active='main'
      $('edit-role').value=editDraft.role
      $('edit-tabs').innerHTML=tabsHtml(editDraft,'edit')
      const part=activePart(editDraft),input=$('edit-input'),file=$('edit-file')
      if(part?.type==='file'){input.hidden=true;file.hidden=false;file.innerHTML=fileCard(fileRecord(part.fileId),'edit')}
      else{input.hidden=false;file.hidden=true;file.innerHTML='';input.value=part?.id==='main'?editDraft.main:part?.content||''}
      const outputFiles=(editDraft.outputs||[]).filter(item=>item.type==='file')
      $('edit-output-section').hidden=!outputFiles.length
      $('edit-output-files').innerHTML=outputFiles.map(item=>{
        const record=fileRecord(item.fileId)
        return '<div class="file-row"><span>◆</span><span class="secondary-main"><strong>'+esc(record?.name||item.name||'Tệp')+'</strong><small>Tệp do AI tạo · '+esc(record?.mime||'')+'</small></span>'+
          '<span class="row-actions"><button class="icon-button" data-action="preview-file" data-file-id="'+esc(item.fileId)+'" aria-label="Xem">⌕</button>'+
          '<button class="icon-button" data-action="open-metadata" data-file-id="'+esc(item.fileId)+'" data-context="edit" aria-label="Sửa metadata">✎</button>'+
          '<button class="icon-button" data-action="remove-output-file-edit" data-output-id="'+esc(item.id)+'" aria-label="Xoá khỏi tin nhắn">×</button></span></div>'
      }).join('')
      $('save-edit-button').disabled=pendingEditFiles>0
      $('save-edit-button').textContent=pendingEditFiles?'Đang thêm tệp…':'Lưu'
    }
    function safeMarkdown(source){
      if(dependencyFailure||!window.commonmark)return'<div style="white-space:pre-wrap">'+esc(source)+'</div>'
      const escaped=String(source||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      const parser=new commonmark.Parser(),renderer=new commonmark.HtmlRenderer({softbreak:'<br>'})
      const template=document.createElement('template');template.innerHTML=renderer.render(parser.parse(escaped))
      $$('a[href],img[src]',template.content).forEach(element=>{
        const attr=element.tagName==='IMG'?'src':'href',value=element.getAttribute(attr)||''
        try{
          const url=new URL(value,location.href)
          const ok=element.tagName==='IMG'?url.protocol==='https:':['http:','https:','mailto:'].includes(url.protocol)||value.startsWith('#')
          if(!ok)element.removeAttribute(attr)
        }catch{element.removeAttribute(attr)}
        if(element.tagName==='A'){element.target='_blank';element.rel='noopener noreferrer'}
        if(element.tagName==='IMG'){element.loading='lazy';element.referrerPolicy='no-referrer'}
      })
      $$('pre',template.content).forEach(pre=>{
        const wrapper=document.createElement('div');wrapper.className='code-block'
        const head=document.createElement('div');head.className='code-head'
        const button=document.createElement('button');button.className='button small';button.dataset.action='copy-code';button.dataset.code=btoa(unescape(encodeURIComponent(pre.textContent||'')));button.textContent='Sao chép'
        pre.replaceWith(wrapper);head.append(button);wrapper.append(head,pre)
      })
      return template.innerHTML
    }
    function messagePartsHtml(message){
      return (message.parts||[]).map((part,index)=>{
        if(part.type==='text')return'<button class="secondary" data-action="preview-text" data-message-id="'+message.id+'" data-part-id="'+part.id+'"><span>T</span><span class="secondary-main"><strong>Văn bản '+((message.parts||[]).filter(item=>item.type==='text').indexOf(part)+1)+'</strong><small>'+esc(part.content.replace(/\s+/g,' ').trim()||'Trống')+'</small></span><span>⌕</span></button>'
        const record=fileRecord(part.fileId)
        return'<button class="secondary" data-action="preview-file" data-file-id="'+esc(part.fileId)+'"><span>▤</span><span class="secondary-main"><strong>'+esc(record?.name||'Tệp')+'</strong><small>'+esc(record?.mime||'')+'</small></span><span>⌕</span></button>'
      }).join('')
    }
    function outputHtml(message){
      const outputs=message.outputs||[]
      let html='',reasoning=''
      for(const block of outputs){
        if(block.type==='text')html+='<div class="markdown">'+safeMarkdown(block.content)+'</div>'
        if(block.type==='reasoning')reasoning+='<div class="markdown">'+safeMarkdown(block.content)+'</div>'
        if(block.type==='file'){
          const record=fileRecord(block.fileId)
          html+='<div class="file-row"><span>◆</span><span class="secondary-main"><strong>'+esc(record?.name||block.name||'Tệp')+'</strong><small>'+esc(record?.mime||'')+'</small></span><span class="row-actions"><button class="icon-button" data-action="preview-file" data-file-id="'+esc(block.fileId)+'">⌕</button></span></div>'
        }
      }
      if(reasoning)html='<details class="reasoning"><summary>Suy luận</summary><div class="reasoning-body">'+reasoning+'</div></details>'+html
      return html
    }
    function renderMessages(){
      const conversation=currentConversation(),list=$('message-list')
      $('conversation-heading').textContent=conversation?.title||''
      if(!conversation?.messages.length){list.innerHTML='<div class="welcome"><div><h1>AI Workbench</h1><p class="hint">Soạn nội dung nhiều phần, đính kèm tệp và gọi endpoint AI.</p></div></div>';return}
      list.innerHTML=conversation.messages.map(message=>{
        const body=message.role==='assistant'
          ? ((message.content?'<div class="markdown">'+safeMarkdown(message.content)+'</div>':'')+outputHtml(message))
          : '<div class="bubble markdown">'+safeMarkdown(message.content||'')+'</div>'
        const parts=messagePartsHtml(message)
        return'<article class="message '+message.role+'" data-message-id="'+message.id+'"><div class="avatar">'+(message.role==='user'?'U':'AI')+'</div><div><div class="message-head"><span class="role">'+message.role+'</span>'+(message.model?'<span class="model">'+esc(message.model)+'</span>':'')+'</div>'+
          body+(parts?'<div class="part-stack">'+parts+'</div>':'')+(message.error?'<div class="error">'+esc(message.error)+'</div>':'')+
          '<div class="message-actions"><button class="button small" data-action="copy-message" data-message-id="'+message.id+'">Sao chép</button><button class="button small" data-action="edit-message" data-message-id="'+message.id+'">Sửa</button><button class="button small danger" data-action="delete-message" data-message-id="'+message.id+'">Xoá</button></div></div></article>'
      }).join('')
      $('messages-scroll').scrollTop=$('messages-scroll').scrollHeight
    }
    function conversationText(conversation){
      return conversation.messages.flatMap(message=>[message.content,...(message.parts||[]).filter(p=>p.type==='text').map(p=>p.content)]).join(' ').toLowerCase()
    }
    function renderSidebar(){
      const query=state.search.trim().toLowerCase()
      const items=state.conversations.filter(item=>!query||item.title.toLowerCase().includes(query)||conversationText(item).includes(query))
      $('conversation-list').innerHTML=items.length?items.map(item=>'<div class="conversation '+(item.id===state.activeId?'active':'')+'"><button class="conversation-select" data-action="select-conversation" data-id="'+item.id+'"><span class="conversation-title">'+esc(item.title)+'</span><span class="conversation-meta">'+item.messages.length+' tin nhắn</span></button><span class="conversation-actions"><button class="icon-button" data-action="rename-conversation" data-id="'+item.id+'" aria-label="Đổi tên">✎</button><button class="icon-button" data-action="delete-conversation" data-id="'+item.id+'" aria-label="Xoá">×</button></span></div>').join(''):'<div class="empty">Không có hội thoại.</div>'
    }
    function renderSafety(){
      $('safety-fields').innerHTML=safetyCategories.map(([category,label])=>'<div class="field"><label for="safety-'+category+'">'+label+'</label><select class="select" id="safety-'+category+'" data-safety="'+category+'">'+safetyOptions.map(([value,text])=>'<option value="'+value+'" '+((state.settings.safety[category]||DEFAULT_THRESHOLD)===value?'selected':'')+'>'+text+'</option>').join('')+'</select></div>').join('')
      $('safety-section').hidden=state.settings.format!=='generate-content'
    }
    function renderSettings(){
      $('api-format').value=state.settings.format;$('base-url').value=state.settings.baseUrl;$('api-key').value=state.settings.apiKey;$('model-id').value=state.settings.model;$('system-prompt').value=state.settings.systemPrompt
      renderSafety();schedulePreview()
    }
    function renderAll(){renderSidebar();renderMessages();renderComposer();renderSettings();renderLibrary();updateDependencyState()}
    function createConversation(){
      const conversation={id:uid(),title:'Hội thoại mới',renamed:false,messages:[]}
      state.conversations.unshift(conversation);state.activeId=conversation.id;save();renderAll();return conversation
    }
    function titleFor(message){
      const text=[message.content,...(message.parts||[]).filter(p=>p.type==='text').map(p=>p.content)].find(value=>value?.trim())
      return(text||fileRecord(message.parts?.find(p=>p.type==='file')?.fileId)?.name||'Hội thoại mới').replace(/\s+/g,' ').trim().slice(0,60)
    }
    function addText(scope){
      capture(scope);const t=target(scope);if(!t)return
      const part={id:uid(),type:'text',content:''};t.parts.push(part);t.active=part.id
      scope==='edit'?renderEdit():renderComposer();save()
    }
    function selectPart(scope,id){capture(scope);const t=target(scope);if(!t)return;t.active=id;scope==='edit'?renderEdit():renderComposer();save()}
    function movePart(scope,id,direction){
      capture(scope);const t=target(scope);if(!t)return
      const index=t.parts.findIndex(item=>item.id===id),next=index+direction
      if(index<0||next<0||next>=t.parts.length)return
      t.parts.splice(next,0,t.parts.splice(index,1)[0]);scope==='edit'?renderEdit():renderComposer();save()
    }
    function removePart(scope,id){
      capture(scope);const t=target(scope);if(!t)return
      const part=t.parts.find(item=>item.id===id);if(!part)return
      if(part.type==='text'&&part.content.trim()&&!confirm('Xoá phần văn bản này?'))return
      if(part.type==='file'&&!confirm('Bỏ tệp khỏi tin nhắn? Tệp vẫn còn trong thư viện.'))return
      t.parts=t.parts.filter(item=>item.id!==id);if(t.active===id)t.active='main'
      scope==='edit'?renderEdit():renderComposer();save();schedulePreview()
    }
    async function addFiles(fileList,scope,sessionId=null){
      const list=Array.from(fileList||[])
      if(scope==='edit')pendingEditFiles+=list.length
      renderEdit()
      for(const file of list){
        try{
          const record=await storeBlob(file,file.name,'attachment')
          if(scope==='edit'){
            if(!editDraft||editDraft.sessionId!==sessionId){toast('Tệp đã lưu vào thư viện nhưng phiên sửa không còn mở.');continue}
            editDraft.parts.push({id:uid(),type:'file',fileId:record.id});editDraft.active=editDraft.parts.at(-1).id
          }else{
            state.draft.parts.push({id:uid(),type:'file',fileId:record.id});state.draft.active=state.draft.parts.at(-1).id
          }
        }catch(error){toast('Không lưu được tệp: '+error.message,true)}
        finally{if(scope==='edit'&&editDraft?.sessionId===sessionId)pendingEditFiles--}
      }
      save();renderAll();renderEdit()
    }
    async function addUrl(scope){
      const address=prompt('URL HTTPS của tệp')

      try{url=new URL(address);if(url.protocol!=='https:'||url.username||url.password)throw new Error()}catch{return toast('URL phải dùng HTTPS và không chứa thông tin đăng nhập.',true)}
      const sessionId=editDraft?.sessionId
      if(scope==='edit')pendingEditFiles++

      try{
        const response=await fetch(url,{credentials:'omit',redirect:'error',referrerPolicy:'no-referrer'})
        if(!response.ok)throw new Error('HTTP '+response.status)
        const blob=await response.blob()
        const name=decodeURIComponent(url.pathname.split('/').filter(Boolean).at(-1)||'download')
        const record=await storeBlob(blob,name,'attachment')

      }catch(error){toast('Không tải được tệp: '+error.message,true)}

    async function filePart(record,format,preview=false){
      const encoded=preview?'[base64]':await base64(record.blob),image=record.mime.startsWith('image/')
      if(format==='generate-content')return{inlineData:{mimeType:record.mime,data:encoded}}
      if(format==='interactions')return{type:image?'image':'document',mime_type:record.mime,data:encoded}
      if(format==='messages'){
        if(image||record.mime==='application/pdf')return{type:image?'image':'document',source:{type:'base64',media_type:record.mime,data:encoded}}
        return{type:'document',title:record.name,source:{type:'text',media_type:'text/plain',data:preview?'[file content]':await record.blob.text()}}
      }
      const uri='data:'+record.mime+';base64,'+encoded
      if(format==='responses')return image?{type:'input_image',image_url:uri}:{type:'input_file',file_data:uri,filename:record.name}
      return image?{type:'image_url',image_url:{url:uri}}:{type:'file',file:{file_data:uri,filename:record.name}}
    }
    async function messageParts(message,format,preview){
      const entries=[{type:'text',content:message.content||''},...(message.parts||[]),...(message.role==='assistant'?(message.outputs||[]).filter(item=>['text','file'].includes(item.type)):[])]
      const parts=[]
      for(const entry of entries){
        if(entry.type==='text'){if(entry.content?.trim())parts.push(format==='generate-content'?{text:entry.content}:{type:format==='responses'?(message.role==='assistant'?'output_text':'input_text'):'text',text:entry.content})}
        else{
          const record=fileRecord(entry.fileId);if(!record)throw new Error('Thiếu tệp trong thư viện.')
          if(textMime(record.mime)){const content=preview?'[text content: '+record.name+']':await record.blob.text();parts.push(format==='generate-content'?{text:content}:{type:format==='responses'?(message.role==='assistant'?'output_text':'input_text'):'text',text:content})}
          else parts.push(await filePart(record,format,preview))
        }
      }
      return parts
    }
    async function buildRequest(preview=false,messagesOverride=null){
      const s=state.settings,format=s.format,messages=messagesOverride||[...(currentConversation()?.messages||[])]
      capture('composer')
      if(!messagesOverride&&(state.draft.main.trim()||state.draft.parts.length))messages.push({role:'user',content:state.draft.main,parts:state.draft.parts})
      const instructions=[s.systemPrompt].filter(Boolean),input=[]
      for(const message of messages){
        const parts=await messageParts(message,format,preview)
        if(!parts.length)continue
        const isTextPart=part=>Boolean(part.text!=null)&&['text','input_text','output_text'].includes(part.type||'text')
        const textParts=parts.filter(isTextPart),fileParts=parts.filter(part=>!isTextPart(part))
        if(['system','developer'].includes(message.role)&&['messages','generate-content','interactions'].includes(format)){
          instructions.push(textParts.map(part=>part.text||'').filter(Boolean).join('\n\n'))
          if(fileParts.length){
            if(format==='generate-content')input.push({role:'user',parts:fileParts})
            else if(format==='interactions')input.push({type:'user_input',content:fileParts})
            else input.push({role:'user',content:fileParts})
          }
          continue
        }
        if(message.role==='assistant'&&format!=='generate-content'&&fileParts.length){
          if(textParts.length){
            if(format==='interactions')input.push({type:'model_output',content:textParts})
            else input.push({role:'assistant',content:format==='chat-completions'&&textParts.length===1?textParts[0].text:textParts})
          }
          if(format==='interactions')input.push({type:'user_input',content:fileParts})
          else input.push({role:'user',content:fileParts})
          continue
        }
        if(format==='generate-content')input.push({role:message.role==='assistant'?'model':'user',parts})
        else if(format==='interactions')input.push({type:message.role==='assistant'?'model_output':'user_input',content:parts})
        else input.push({role:message.role,content:format==='chat-completions'&&parts.length===1&&parts[0].type==='text'?parts[0].text:parts})
      }
      const body={model:s.model}
      const system=instructions.join('\n\n')
      if(format==='generate-content'){
        delete body.model;body.contents=input;if(system)body.systemInstruction={parts:[{text:system}]}
        const safetySettings=safetyCategories.flatMap(([category])=>{
          const threshold=s.safety[category]||DEFAULT_THRESHOLD
          return threshold===DEFAULT_THRESHOLD?[]:[{category,threshold}]
        })
        if(safetySettings.length)body.safetySettings=safetySettings
      }else if(format==='messages'){body.messages=input;body.max_tokens=8192;if(system)body.system=system}
      else if(format==='responses'){body.input=input;if(system)body.instructions=system}
      else if(format==='interactions'){body.input=input;if(system)body.system_instruction=system}
      else{body.messages=input;if(system)body.messages.unshift({role:'system',content:system})}
      return body
    }
    function requestUrl(){

      if(s.format==='generate-content')return base+'/models/'+encodeURIComponent(s.model.replace(/^models\//,''))+':generateContent'
      if(s.format==='messages')return(base.endsWith('/v1')?base:base+'/v1')+'/messages'

    }

    async function generatedFileFromBase64(data,mime,name){
      const bytes=Uint8Array.from(atob(String(data).replace(/\s/g,'')),char=>char.charCodeAt(0))
      return storeBlob(new Blob([bytes],{type:mime||'application/octet-stream'}),name||'generated-file','generated')
    }
    async function parseResponse(json,format){
      const outputs=[]
      if(format==='chat-completions'){const content=json.choices?.[0]?.message?.content;if(content)outputs.push({id:uid(),type:'text',content:typeof content==='string'?content:content.map(x=>x.text||'').join('')})}
      else if(format==='messages'){
        for(const part of json.content||[]){
          if(part.type==='text')outputs.push({id:uid(),type:'text',content:part.text})
          if(part.type==='thinking')outputs.push({id:uid(),type:'reasoning',content:part.thinking})
          if(['image','document'].includes(part.type)&&part.source?.data){const record=await generatedFileFromBase64(part.source.data,part.source.media_type,part.title);outputs.push({id:uid(),type:'file',fileId:record.id})}
        }
      }else if(format==='generate-content'){
        for(const part of json.candidates?.[0]?.content?.parts||[]){
          if(part.text)outputs.push({id:uid(),type:part.thought?'reasoning':'text',content:part.text})
          const inline=part.inlineData||part.inline_data;if(inline?.data){const record=await generatedFileFromBase64(inline.data,inline.mimeType||inline.mime_type);outputs.push({id:uid(),type:'file',fileId:record.id})}
        }
      }else if(format==='responses'){
        for(const item of json.output||[]){
          if(item.type==='message')for(const part of item.content||[]){if(part.text||part.refusal)outputs.push({id:uid(),type:'text',content:part.text||part.refusal})}
          if(item.type==='reasoning')for(const part of item.summary||[])if(part.text)outputs.push({id:uid(),type:'reasoning',content:part.text})
          if(item.type==='image_generation_call'&&item.result){const record=await generatedFileFromBase64(item.result,'image/png','generated-image.png');outputs.push({id:uid(),type:'file',fileId:record.id})}
        }
        if(!outputs.length&&json.output_text)outputs.push({id:uid(),type:'text',content:json.output_text})
      }else{
        for(const step of json.steps||[]){if(step.type==='model_output')for(const part of step.content||[])if(part.text)outputs.push({id:uid(),type:'text',content:part.text});if(step.type==='thought')outputs.push({id:uid(),type:'reasoning',content:step.summary||''})}
      }
      return outputs
    }
    async function send(){
      if(requestController){requestController.abort();return}
      if(dependencyFailure)return toast('Không thể gửi khi thư viện CDN chưa tải.',true)
      capture('composer');const conversation=currentConversation()||createConversation()
      if(!state.settings.model.trim())return toast('Nhập Model ID trước khi gửi.',true)
      if(!state.draft.main.trim()&&!state.draft.parts.length&&!conversation.messages.length)return
      const user={id:uid(),role:'user',content:state.draft.main,parts:clone(state.draft.parts)}
      const requestMessages=[...conversation.messages]
      if(user.content.trim()||user.parts.length)requestMessages.push(user)
      requestController=new AbortController();updateSend();$('status').textContent='Đang gọi API…'
      try{
        const body=await buildRequest(false,requestMessages)
        if(user.content.trim()||user.parts.length){conversation.messages.push(user);if(!conversation.renamed)conversation.title=titleFor(user);state.draft={main:'',parts:[],active:'main',selections:{}};save();renderAll()}
        const response=await fetch(requestUrl(),{method:'POST',headers:requestHeaders(),body:JSON.stringify(body),signal:requestController.signal,credentials:'omit',redirect:'error',referrerPolicy:'no-referrer'})
        if(!response.ok)throw new Error('HTTP '+response.status+': '+(await response.text()).slice(0,1200))
        const outputs=await parseResponse(await response.json(),state.settings.format)
        conversation.messages.push({id:uid(),role:'assistant',content:'',parts:[],outputs,model:state.settings.model})
      }catch(error){if(error.name!=='AbortError')conversation.messages.push({id:uid(),role:'assistant',content:'',parts:[],outputs:[],model:state.settings.model,error:error.message})}
      finally{requestController=null;$('status').innerHTML='<span class="loading-dot"></span> Sẵn sàng';save();renderAll()}
    }

        else if(action==='add-text')addText(button.dataset.scope)
        else if(action==='select-part')selectPart(button.dataset.scope,button.dataset.id)
        else if(action==='move-part')movePart(button.dataset.scope,button.dataset.id,Number(button.dataset.direction))
        else if(action==='remove-part')removePart(button.dataset.scope,button.dataset.id)
        else if(action==='pick-file'){const input=$('file-input');input.dataset.scope=button.dataset.scope;input.dataset.session=editDraft?.sessionId||'';input.click()}
        else if(action==='attach-url')addUrl(button.dataset.scope)
        else if(action==='send')send()
        else if(action==='edit-message')beginEdit(button.dataset.messageId)
        else if(action==='cancel-edit')cancelEdit()
        else if(action==='save-edit')saveEdit()
        else if(action==='remove-output-file-edit'){if(confirm('Bỏ tệp AI tạo khỏi tin nhắn? Tệp vẫn còn trong thư viện.')){editDraft.outputs=editDraft.outputs.filter(x=>x.id!==button.dataset.outputId);renderEdit()}}
        else if(action==='delete-message'){const c=currentConversation();if(c&&confirm('Xoá tin nhắn?')){c.messages=c.messages.filter(x=>x.id!==button.dataset.messageId);save();renderAll()}}
        else if(action==='copy-message'){const m=currentConversation()?.messages.find(x=>x.id===button.dataset.messageId);copyText([m?.content,...(m?.parts||[]).filter(p=>p.type==='text').map(p=>p.content),...(m?.outputs||[]).filter(o=>o.type==='text').map(o=>o.content)].filter(Boolean).join('\n\n'))}
        else if(action==='copy-code')copyText(decodeURIComponent(escape(atob(button.dataset.code))))
        else if(action==='preview-text'){const m=currentConversation()?.messages.find(x=>x.id===button.dataset.messageId),p=m?.parts.find(x=>x.id===button.dataset.partId);if(p){$('text-preview-title').textContent='Văn bản';$('text-preview-content').innerHTML=safeMarkdown(p.content);showDialog('text-preview-dialog')}}
        else if(action==='close-text-preview')closeDialog('text-preview-dialog')
        else if(action==='open-library'){libraryTarget=button.dataset.target||'composer';renderLibrary();showDialog('library-dialog')}
        else if(action==='close-library')closeDialog('library-dialog')
        else if(action==='attach-library-file')attachLibraryFile(button.dataset.fileId)
        else if(action==='preview-file')previewFile(button.dataset.fileId)
        else if(action==='close-file-preview')closeDialog('file-preview-dialog')
        else if(action==='delete-library-file'){if(confirm('Xoá vĩnh viễn tệp này?')){await deleteFile(button.dataset.fileId);renderLibrary()}}
        else if(action==='open-metadata')openMetadata(button.dataset.fileId,button.dataset.context)
        else if(action==='close-metadata'){metadataDraft=null;metadataFromEdit=false;closeDialog('metadata-dialog')}
        else if(action==='detect-mime')redetectMime()
        else if(action==='save-metadata')saveMetadata()
        else if(action==='copy-preview')copyText($('request-preview').value)
        else if(action==='export-state')exportState()
        else if(action==='import-state')$('import-input').click()
        else if(action==='cleanup-files')cleanupFiles()
      }catch(error){toast(error.message||String(error),true)}
    })
    window.addEventListener('keydown',event=>{
      if(event.key==='Enter'&&!event.shiftKey&&event.target===$('composer-input')){event.preventDefault();send()}
      if(event.key==='Escape'){$('sidebar').classList.remove('open');$('settings').classList.remove('open')}
    })
    async function initialize(){
      load()
      try{db=await openDatabase();await loadFiles()}catch(error){toast('Kho tệp không khả dụng: '+error.message,true)}
      if(!state.activeId&&state.conversations.length)state.activeId=state.conversations[0].id
      renderAll()
      setTimeout(updateDependencyState,0)
    }
    initialize()
  })()
  </script>
</body>
</html>
