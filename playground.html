    }

    function interpolateVariables (source, variables) {
      return String(source || '').replace(
        /\{\{\s*([^{}]+?)\s*\}\}/g,
        (token, path) => {
          const result = findVariableValue(
            variables,
            path.trim()
          )

          return result.found
            ? stringifyVariableValue(result.value)
            : token
        }
      )
    }

    function isInstructionRole (role) {
      return role === 'system' || role === 'developer'
    }

    function isAssistantRole (role) {
      return role === 'assistant'
    }

    function getRequestMessageContent (
      message,
      variables
    ) {
      if (isAssistantRole(message.role)) {
        return message.content || ''
      }

      return interpolateVariables(
        message.content || '',
        variables
      )
    }

    function getGeminiCandidateParts (json) {
      const candidate =
        json &&
        json.candidates &&
        json.candidates[0]

      if (
        !candidate ||
        !candidate.content ||
        !Array.isArray(candidate.content.parts)
      ) {
        return []
      }

      return candidate.content.parts
    }

    function getInteractionContentText (content) {
      const blocks = Array.isArray(content)
        ? content
        : content
          ? [content]
          : []

      return joinTextBlocks(
        blocks.map(block => {
          if (
            block &&
            block.type === 'text' &&
            typeof block.text === 'string'
          ) {
            return block.text
          }

          return ''
        })
      )
    }

    function createAnthropicAttachmentPart (
      attachment
    ) {
      if (
        isImageAttachment(attachment) &&
        typeof attachment.base64 === 'string'
      ) {
        return {
          type: 'image',
          source: {
            type: 'base64',
            media_type: attachment.type,
            data: attachment.base64
          }
        }
      }

      if (
        attachment.type === 'application/pdf' &&
        typeof attachment.base64 === 'string'
      ) {
        return {
          type: 'document',
          source: {
            type: 'base64',
            media_type: 'application/pdf',
            data: attachment.base64
          },
          title: attachment.name
        }
      }

      if (
        isTextMimeType(attachment.type || '') &&
        typeof attachment.text === 'string'
      ) {
        return {
          type: 'document',
          source: {
            type: 'text',
            media_type: 'text/plain',
            data: attachment.text
          },
          title: attachment.name
        }
      }

      return null
    }

    function createGeminiAttachmentPart (
      attachment
    ) {
      if (typeof attachment.base64 !== 'string') {
        return null
      }

      return {
        inlineData: {
          mimeType:
            attachment.type ||
            'application/octet-stream',
          data: attachment.base64
        }
      }
    }

    function createInteractionAttachmentPart (
      attachment
    ) {
      if (typeof attachment.base64 !== 'string') {
        return null
      }

      return {
        type: isImageAttachment(attachment)
          ? 'image'
          : 'document',
        data: attachment.base64,
        mime_type:
          attachment.type ||
          'application/octet-stream'
      }
    }

    function getGeminiThinkingLevel (settings) {
      if (!settings.reasoningEnabled) {
        return 'minimal'
      }

      const level =
        settings.level || settings.effort

      if (!level) return null
      if (level === 'minimal') return 'minimal'
      if (level === 'low') return 'low'
      if (level === 'medium') return 'medium'
      return 'high'
    }

    function getGeminiThinkingBudget (
      settings,
      model
    ) {
      if (!settings.reasoningEnabled) return 0

      const maximumBudget =
        /gemini-2[._-]?5-pro/i.test(model || '')
          ? 32768
          : 24576

      if (settings.budget != null) {
        return clampValue(
          settings.budget,
          1,
          maximumBudget
        )
      }

      if (!settings.effort) return null
      if (settings.effort === 'minimal') return 512
      if (settings.effort === 'low') return 1024
      if (settings.effort === 'medium') return 8192
      return maximumBudget
    }

    function usesGeminiThinkingLevel (model) {
      return /(^|[\/_-])gemini-3(?:[._-]|$)/i.test(
        model || ''
      )
    }

    function usesClaudeManualThinking (model) {
      const modelId = String(model || '').toLowerCase()

      return (
        /claude-3(?:[-.]|$)/.test(modelId) ||
        /claude-(?:opus|sonnet|haiku)-4-(?![6-9](?:-|$))/.test(
          modelId
        )
      )
    }

    function anthropicCannotDisableThinking (model) {
      return /(?:fable|mythos)/i.test(model || '')
    }

    function anthropicRequiresAutomaticSampling (
      model
    ) {
      const modelId = String(model || '').toLowerCase()

      if (
        /claude-(?:opus|sonnet|haiku)-[5-9](?:-|$)/.test(
          modelId
        )
      ) {
        return true
      }

      const versionMatch = modelId.match(
        /claude-(?:opus|sonnet|haiku)-4[-.]([0-9]+)/
      )

      return Boolean(
        versionMatch &&
        Number(versionMatch[1]) >= 7
      )
    }

    function getSamplingCapabilities (
      endpoint,
      model,
      settings
    ) {
      const capabilities = {
        reason: '',
        temperature: true,
        topK: true,
        topP: true
      }

      if (!endpoint) return capabilities

      if (endpoint.format === 'interactions') {
        capabilities.reason =
          'Interactions API tự xác định tham số lấy mẫu.'
        capabilities.temperature = false
        capabilities.topK = false
        capabilities.topP = false
        return capabilities
      }

      if (
        endpoint.format === 'messages' &&
        settings.reasoningEnabled
      ) {
        capabilities.reason =
          'Messages API tự xác định tham số lấy mẫu khi suy luận được bật.'
        capabilities.temperature = false
        capabilities.topK = false
        capabilities.topP = false
        return capabilities
      }

      if (
        endpoint.format === 'messages' &&
        anthropicRequiresAutomaticSampling(model)
      ) {
        capabilities.reason =
          'Mô hình Claude này yêu cầu API tự xác định tham số lấy mẫu.'
        capabilities.temperature = false
        capabilities.topK = false
        capabilities.topP = false
      }

      return capabilities
    }

    function createChatToolBlock (
      toolCall,
      id,
      status
    ) {
      const functionData =
        toolCall.function || {}

      const customData =
        toolCall.custom || {}

      return createToolBlock({
        id,
        input:
          functionData.arguments ||
          customData.input ||
          toolCall.arguments,
        name:
          functionData.name ||
          customData.name ||
          toolCall.name,
        serverSide: false,
        status: status || 'waiting',
        toolType:
          toolCall.type === 'custom'
            ? 'custom_tool_call'
            : 'function_call'
      })
    }

    function createChatResponseBlocks (message) {
      const blocks = []

      if (!message) return blocks

      const reasoning = getChatReasoning(message)

      if (reasoning) {
        blocks.push(
          createReasoningBlock(
            'chat:reasoning:0',
            reasoning
          )
        )
      }

      const text = getTextValue(message.content)

      if (text) {
        blocks.push(
          createTextBlock('chat:text:0', text)
        )
      }

      const toolCalls =
        Array.isArray(message.tool_calls)
          ? message.tool_calls
          : []

      toolCalls.forEach((toolCall, index) => {
        blocks.push(
          createChatToolBlock(
            toolCall,
            'chat:tool:' + index,
            'waiting'
          )
        )
      })

      if (
        message.function_call &&
        !toolCalls.length
      ) {
        blocks.push(
          createChatToolBlock(
            {
              function: message.function_call,
              type: 'function'
            },
            'chat:tool:0',
            'waiting'
          )
        )
      }

      return blocks
    }

    function isAnthropicToolResultType (type) {
      return (
        type === 'tool_result' ||
        /_tool_result$/.test(type || '')
      )
    }

    function createAnthropicResponseBlocks (json) {
      const blocks = []
      const content = Array.isArray(json.content)
        ? json.content
        : []

      content.forEach((block, index) => {
        if (!block) return

        if (block.type === 'thinking') {
          blocks.push(
            createReasoningBlock(
              'anthropic:reasoning:' + index,
              block.thinking || ''
            )
          )
          return
        }

        if (block.type === 'redacted_thinking') {
          blocks.push(
            createRedactedBlock(
              'anthropic:redacted:' + index
            )
          )
          return
        }

        if (block.type === 'text') {
          blocks.push(
            createTextBlock(
              'anthropic:text:' + index,
              block.text || ''
            )
          )
          return
        }

        if (
          block.type === 'tool_use' ||
          block.type === 'server_tool_use'
        ) {
          blocks.push(
            createToolBlock({
              id:
                'anthropic:tool:' +
                (block.id || index),
              input: block.input,
              name: block.name,
              serverSide:
                block.type === 'server_tool_use',
              status:
                block.type === 'server_tool_use'
                  ? 'running'
                  : 'waiting',
              toolType: block.type
            })
          )
          return
        }

        if (isAnthropicToolResultType(block.type)) {
          upsertParsedToolBlock(blocks, {
            id:
              'anthropic:tool:' +
              (
                block.tool_use_id ||
                block.id ||
                index
              ),
            output:
              block.content ||
              block.result,
            serverSide: true,
            status: 'completed',
            toolType:
              block.type.replace(
                /_result$/,
                '_call'
              )
          })
        }
      })

      finalizeParsedTools(blocks)
      return blocks
    }

    function createGeminiResponseBlocks (json) {
      const blocks = []
      let lastCodeToolId = null

      getGeminiCandidateParts(json)
        .forEach((part, index) => {
          if (!part) return

          if (typeof part.text === 'string') {
            if (part.thought) {
              blocks.push(
                createReasoningBlock(
                  'gemini:reasoning:' + index,
                  part.text
                )
              )
            } else {
              blocks.push(
                createTextBlock(
                  'gemini:text:' + index,
                  part.text
                )
              )
            }
          }

          if (part.functionCall) {
            const functionCall = part.functionCall

            blocks.push(
              createToolBlock({
                id:
                  'gemini:tool:' +
                  (
                    functionCall.id ||
                    functionCall.name ||
                    index
                  ),
                input: functionCall.args,
                name: functionCall.name,
                serverSide: false,
                status: 'waiting',
                toolType: 'function_call'
              })
            )
          }

          if (part.executableCode) {
            lastCodeToolId =
              'gemini:code:' + index

            blocks.push(
              createToolBlock({
                id: lastCodeToolId,
                input: part.executableCode.code,
                name: 'Thực thi mã',
                serverSide: true,
                status: 'running',
                toolType: 'code_execution_call'
              })
            )
          }

          if (part.codeExecutionResult) {
            const result =
              part.codeExecutionResult

            upsertParsedToolBlock(blocks, {
              id:
                lastCodeToolId ||
                'gemini:code:' + index,
              name: 'Thực thi mã',
              output:
                result.output ||
                result.outcome,
              serverSide: true,
              status:
                result.outcome === 'OUTCOME_FAILED'
                  ? 'failed'
                  : 'completed',
              toolType: 'code_execution_call'
            })
          }

          if (part.toolCall) {
            const toolCall = part.toolCall

            blocks.push(
              createToolBlock({
                id:
                  'gemini:tool:' +
                  (
                    toolCall.id ||
                    toolCall.name ||
                    index
                  ),
                input:
                  toolCall.args ||
                  toolCall.arguments,
                name: toolCall.name,
                serverSide: true,
                status: 'running',
                toolType: 'tool_call'
              })
            )
          }

          if (part.toolResponse) {
            const toolResponse =
              part.toolResponse

            upsertParsedToolBlock(blocks, {
              id:
                'gemini:tool:' +
                (
                  toolResponse.id ||
                  toolResponse.name ||
                  index
                ),
              name: toolResponse.name,
              output:
                toolResponse.response ||
                toolResponse.result,
              serverSide: true,
              status: 'completed',
              toolType: 'tool_call'
            })
          }
        })

      finalizeParsedTools(blocks)
      return blocks
    }

    function isResponseToolItem (item) {
      if (!item || typeof item.type !== 'string') {
        return false
      }

      return (
        item.type === 'function_call' ||
        item.type === 'custom_tool_call' ||
        /_call$/.test(item.type)
      )
    }

    function createResponseToolBlock (item, index) {
      const serverSide =
        item.type !== 'function_call' &&
        item.type !== 'custom_tool_call'

      const status = serverSide
        ? (
            item.status === 'failed'
              ? 'failed'
              : item.status === 'completed'
                ? 'completed'
                : 'running'
          )
        : 'waiting'

      return createToolBlock({
        id:
          'responses:tool:' +
          (item.id || item.call_id || index),
        input:
          item.arguments ||
          item.input ||
          item.action ||
          item.code ||
          item.commands,
        name:
          item.name ||
          humanizeToolType(item.type),
        output:
          item.output ||
          item.outputs ||
          item.results,
        serverSide,
        status,
        toolType: item.type
      })
    }

    function createResponseBlocks (json) {
      const blocks = []
      const output = Array.isArray(json.output)
        ? json.output
        : []

      output.forEach((item, outputIndex) => {
        if (!item) return

        if (item.type === 'reasoning') {
          const summary =
            Array.isArray(item.summary)
              ? item.summary
              : []

          summary.forEach((part, partIndex) => {
            const text = getTextValue(part)

            if (text) {
              blocks.push(
                createReasoningBlock(
                  'responses:reasoning:' +
                  outputIndex +
                  ':' +
                  partIndex,
                  text
                )
              )
            }
          })

          if (!summary.length) {
            const text = getTextValue(item.content)

            if (text) {
              blocks.push(
                createReasoningBlock(
                  'responses:reasoning:' +
                  outputIndex,
                  text
                )
              )
            }
          }

          return
        }

        if (isResponseToolItem(item)) {
          blocks.push(
            createResponseToolBlock(
              item,
              outputIndex
            )
          )
          return
        }

        if (
          item.type === 'message' &&
          Array.isArray(item.content)
        ) {
          item.content.forEach(
            (content, contentIndex) => {
              if (
                content &&
                content.type === 'output_text' &&
                typeof content.text === 'string'
              ) {
                blocks.push(
                  createTextBlock(
                    'responses:text:' +
                    outputIndex +
                    ':' +
                    contentIndex,
                    content.text
                  )
                )
              }
            }
          )
        }
      })

      const hasText = blocks.some(
        block => block.type === 'text'
      )

      if (
        !hasText &&
        typeof json.output_text === 'string' &&
        json.output_text
      ) {
        blocks.push(
          createTextBlock(
            'responses:text:fallback',
            json.output_text
          )
        )
      }

      finalizeParsedTools(blocks)
      return blocks
    }

    function isInteractionResultType (type) {
      return (
        type === 'function_result' ||
        /_result$/.test(type || '')
      )
    }

    function isInteractionToolType (type) {
      return (
        type === 'function_call' ||
        /_call$/.test(type || '')
      )
    }

    function createInteractionBlocks (interaction) {
      const blocks = []

      const steps =
        interaction &&
        (
          interaction.steps ||
          interaction.output
        )

      if (!Array.isArray(steps)) {
        if (
          interaction &&
          typeof interaction.output_text === 'string' &&
          interaction.output_text
        ) {
          blocks.push(
            createTextBlock(
              'interactions:text:fallback',
              interaction.output_text
            )
          )
        }

        return blocks
      }

      steps.forEach((step, index) => {
        if (!step) return

        if (step.type === 'thought') {
          const reasoning =
            getTextValue(step.summary) ||
            getTextValue(step.content)

          if (reasoning) {
            blocks.push(
              createReasoningBlock(
                'interactions:reasoning:' + index,
                reasoning
              )
            )
          }

          return
        }

        if (step.type === 'model_output') {
          const text =
            getInteractionContentText(step.content)

          if (text) {
            blocks.push(
              createTextBlock(
                'interactions:text:' + index,
                text
              )
            )
          }

          return
        }

        if (isInteractionToolType(step.type)) {
          const serverSide =
            step.type !== 'function_call'

          blocks.push(
            createToolBlock({
              id:
                'interactions:tool:' +
                (step.id || index),
              input:
                step.arguments ||
                step.input,
              name:
                step.name ||
                humanizeToolType(step.type),
              output:
                step.output ||
                step.result,
              serverSide,
              status:
                serverSide
                  ? (
                      step.status === 'failed'
                        ? 'failed'
                        : step.status === 'done' ||
                          step.status === 'completed'
                          ? 'completed'
                          : 'running'
                    )
                  : 'waiting',
              toolType: step.type
            })
          )

          return
        }

        if (isInteractionResultType(step.type)) {
          upsertParsedToolBlock(blocks, {
            id:
              'interactions:tool:' +
              (
                step.call_id ||
                step.id ||
                index
              ),
            name: step.name,
            output:
              step.result ||
              step.output ||
              step.content,
            serverSide:
              step.type !== 'function_result',
            status: 'completed',
            toolType:
              step.type.replace(
                /_result$/,
                '_call'
              )
          })
        }
      })

      finalizeParsedTools(blocks)
      return blocks
    }

    const API_FORMATS = {
      'chat-completions': {
        label: 'Chat Completions',
        presetBase:
          'https://api.openai.com/v1',

        buildUrl (baseUrl) {
          return (
            normalizeBaseUrl(baseUrl) +
            '/chat/completions'
          )
        },

        headers (apiKey) {
          const headers = {
            'content-type': 'application/json'
          }

          if (apiKey) {
            headers.authorization =
              'Bearer ' + apiKey
          }

          return headers
        },

        build (context) {
          const messages = []

          if (context.settings.systemPrompt) {
            messages.push({
              role: 'system',
              content:
                context.settings.systemPrompt
            })
          }

          context.messages.forEach(message => {
            const attachments =
              message.attachments || []

            if (
              message.role === 'user' &&
              attachments.length
            ) {
              const content = [{
                type: 'text',
                text: message.content || ''
              }]

              attachments.forEach(attachment => {
                const dataUrl =
                  createAttachmentDataUrl(attachment)

                if (!dataUrl) return

                if (isImageAttachment(attachment)) {
                  content.push({
                    type: 'image_url',
                    image_url: {
                      url: dataUrl
                    }
                  })
                } else {
                  content.push({
                    type: 'file',
                    file: {
                      filename: attachment.name,
                      file_data: dataUrl
                    }
                  })
                }
              })

              messages.push({
                role: 'user',
                content
              })

              return
            }

            messages.push({
              role: message.role,
              content: message.content || ''
            })
          })

          const body = {
            messages,
            model: context.model,
            stream: context.stream
          }

          if (!context.settings.temperatureAuto) {
            body.temperature =
              context.settings.temperature
          }

          if (!context.settings.topPAuto) {
            body.top_p =
              context.settings.topP
          }

          if (context.settings.maxTokens != null) {
            // body.max_completion_tokens =
            body.max_tokens =
              context.settings.maxTokens
          }

          if (context.settings.verbosity) {
            body.verbosity =
              context.settings.verbosity
          }

          if (context.settings.tools.length) {
            body.tools = context.settings.tools
          }

          if (context.settings.zeroDataRetention) {
            body.store = false
          }

          if (context.settings.reasoningEnabled) {
            if (context.settings.effort) {
              body.reasoning_effort =
                context.settings.effort
            }
          } else {
            body.reasoning_effort = 'none'
          }

          return {
            body,
            headers: this.headers(context.apiKey),
            url: this.buildUrl(context.base)
          }
        },

        parseEvent (streamEvent) {
          if (streamEvent.raw === '[DONE]') {
            return { done: true }
          }

          const data = streamEvent.data

          if (data.error) {
            return {
              error:
                data.error.message ||
                'API trả về lỗi.'
            }
          }

          const choice =
            data.choices && data.choices[0]

          const delta = choice && choice.delta
          const updates = []

          if (!delta) return { updates }

          const reasoning = getChatReasoning(delta)

          if (reasoning) {
            updates.push({
              content: reasoning,
              id: 'chat:reasoning:0',
              kind: 'append',
              type: 'reasoning'
            })
          }

          const text = getTextValue(delta.content)

          if (text) {
            updates.push({
              content: text,
              id: 'chat:text:0',
              kind: 'append',
              type: 'text'
            })
          }

          const toolCalls =
            Array.isArray(delta.tool_calls)
              ? delta.tool_calls
              : []

          toolCalls.forEach((toolCall, index) => {
            const callIndex =
              Number.isFinite(toolCall.index)
                ? toolCall.index
                : index

            const functionData =
              toolCall.function || {}

            const customData =
              toolCall.custom || {}

            updates.push({
              id: 'chat:tool:' + callIndex,
              inputDelta:
                functionData.arguments ||
                customData.input ||
                '',
              kind: 'tool',
              name:
                functionData.name ||
                customData.name ||
                '',
              serverSide: false,
              status:
                choice.finish_reason === 'tool_calls'
                  ? 'waiting'
                  : 'preparing',
              toolType:
                toolCall.type === 'custom'
                  ? 'custom_tool_call'
                  : 'function_call'
            })
          })

          if (delta.function_call) {
            updates.push({
              id: 'chat:tool:0',
              inputDelta:
                delta.function_call.arguments || '',
              kind: 'tool',
              name:
                delta.function_call.name || '',
              serverSide: false,
              status: 'preparing',
              toolType: 'function_call'
            })
          }

          return {
            finalizeTools:
              Boolean(choice.finish_reason),
            updates
          }
        },

        parseFull (json) {
          const message =
            json.choices &&
            json.choices[0] &&
            json.choices[0].message

          return createParsedResponse(
            createChatResponseBlocks(message)
          )
        },

        parseError (json) {
          return (
            json.error &&
            json.error.message
              ? json.error.message
              : ''
          )
        }
      },

      messages: {
        label: 'Messages',
        presetBase:
          'https://api.anthropic.com',

        buildUrl (baseUrl) {
          const root = normalizeBaseUrl(baseUrl)

          return root.endsWith('/v1')
            ? root + '/messages'
            : root + '/v1/messages'
        },

        headers (apiKey) {
          const headers = {
            'anthropic-dangerous-direct-browser-access':
              'true',
            'anthropic-version':
              '2023-06-01',
            'content-type':
              'application/json'
          }

          if (apiKey) {
            headers['x-api-key'] = apiKey
          }

          return headers

        build (context) {

              isAssistantRole(message.role)
                ? []
                : message.attachments || []

            if (!attachments.length) {
              messages.push({
                role,
                content: message.content || ''
              })
              return
            }

            const content = [{
              type: 'text',
              text: message.content || ''
            }]

            attachments.forEach(attachment => {
              const part =
                createAnthropicAttachmentPart(
                  attachment
                )

              if (part) content.push(part)
            })

            messages.push({
              role,
              content

          if (!messages.length) {
            messages.push({
              role: 'user',
              content: ''

            context.settings.maxTokens || 8192

          if (context.settings.systemPrompt) {

            }

            body.thinking = {
              budget_tokens: budget,
              display,

                  : context.settings.effort

          }

            anthropicRequiresAutomaticSampling(

            url: this.buildUrl(context.base)

        parseEvent (streamEvent, streamState) {
          const data = streamEvent.data
          const type = data.type
          const updates = []

          if (
            type === 'content_block_start' &&
            data.content_block
          ) {
            const block = data.content_block
            const index = data.index

            if (block.type === 'thinking') {
              const id =
                'anthropic:reasoning:' + index

              streamState.anthropicBlocks[index] = {
                id,
                type: 'reasoning'
              }

              if (block.thinking) {
                updates.push({
                  content: block.thinking,
                  id,
                  kind: 'append',
                  type: 'reasoning'
                })
              }
            } else if (
              block.type === 'redacted_thinking'
            ) {
              updates.push({
                id:
                  'anthropic:redacted:' + index,
                kind: 'redacted'
              })
            } else if (block.type === 'text') {
              const id =
                'anthropic:text:' + index

              streamState.anthropicBlocks[index] = {
                id,
                type: 'text'
              }

              if (block.text) {
                updates.push({
                  content: block.text,
                  id,
                  kind: 'append',
                  type: 'text'
                })
              }
            } else if (
              block.type === 'tool_use' ||
              block.type === 'server_tool_use'
            ) {
              const id =
                'anthropic:tool:' +
                (block.id || index)

              streamState.anthropicBlocks[index] = {
                id,
                serverSide:
                  block.type === 'server_tool_use',
                type: 'tool'
              }

              updates.push({
                id,
                input: block.input,
                kind: 'tool',
                name: block.name,
                serverSide:
                  block.type === 'server_tool_use',
                status:
                  block.type === 'server_tool_use'
                    ? 'running'
                    : 'preparing',
                toolType: block.type
              })
            } else if (
              isAnthropicToolResultType(block.type)
            ) {
              updates.push({
                id:
                  'anthropic:tool:' +
                  (
                    block.tool_use_id ||
                    block.id ||
                    index
                  ),
                kind: 'tool',
                output:
                  block.content ||
                  block.result,
                serverSide: true,
                status: 'completed',
                toolType:
                  block.type.replace(
                    /_result$/,
                    '_call'
                  )
              })
            }
          }

          if (
            type === 'content_block_delta' &&
            data.delta
          ) {
            const blockState =
              streamState.anthropicBlocks[
                data.index
              ]

            if (
              data.delta.type === 'thinking_delta' &&
              blockState
            ) {
              updates.push({
                content:
                  data.delta.thinking || '',
                id: blockState.id,
                kind: 'append',
                type: 'reasoning'
              })
            } else if (
              data.delta.type === 'text_delta' &&
              blockState
            ) {
              updates.push({
                content:
                  data.delta.text || '',
                id: blockState.id,
                kind: 'append',
                type: 'text'
              })
            } else if (
              data.delta.type === 'input_json_delta' &&
              blockState &&
              blockState.type === 'tool'
            ) {
              updates.push({
                id: blockState.id,
                inputDelta:
                  data.delta.partial_json || '',
                kind: 'tool',
                serverSide:
                  blockState.serverSide,
                status:
                  blockState.serverSide
                    ? 'running'
                    : 'preparing'
              })
            }
          }

          if (type === 'content_block_stop') {
            const blockState =
              streamState.anthropicBlocks[
                data.index
              ]

            if (
              blockState &&
              blockState.type === 'tool'
            ) {
              updates.push({
                id: blockState.id,
                kind: 'tool',
                serverSide:
                  blockState.serverSide,
                status:
                  blockState.serverSide
                    ? 'running'
                    : 'waiting'
              })
            }
          }

          if (type === 'error') {
            return {
              error:
                (
                  data.error &&
                  data.error.message
                ) ||
                'API trả về lỗi.'
            }
          }

          return {
            done: type === 'message_stop',
            finalizeTools:
              type === 'message_stop',
            updates
          }
        },

            ) {
              streamState.interactionSteps[index] = {
                ...step,
                blockId:
                  'interactions:text:' + index
              }
            } else if (
              isInteractionToolType(step.type)
            ) {
              const serverSide =
                step.type !== 'function_call'

              const id =
                'interactions:tool:' +
                (step.id || index)

              streamState.interactionSteps[index] = {
                ...step,
                blockId: id,
                serverSide
              }

              updates.push({
                id,
                input:
                  step.arguments ||
                  step.input,
                kind: 'tool',
                name:
                  step.name ||
                  humanizeToolType(step.type),
                serverSide,
                status:
                  serverSide
                    ? 'running'
                    : 'preparing',
                toolType: step.type
              })
            } else if (
              isInteractionResultType(step.type)
            ) {
              updates.push({
                id:
                  'interactions:tool:' +
                  (
                    step.call_id ||
                    step.id ||
                    index
                  ),
                kind: 'tool',
                name: step.name,
                output:
                  step.result ||
                  step.output ||
                  step.content,
                serverSide:
                  step.type !== 'function_result',
                status: 'completed',
                toolType:
                  step.type.replace(
                    /_result$/,
                    '_call'
                  )
              })
            }
          }

          if (type === 'step.delta' && data.delta) {
            const step =
              streamState.interactionSteps[
                data.index
              ] || {}

            if (
              data.delta.type === 'thought' ||
              data.delta.type === 'thought_summary'
            ) {
              updates.push({
                content:
                  data.delta.text ||
                  getTextValue(data.delta.content),
                id:
                  step.blockId ||
                  'interactions:reasoning:' +
                  data.index,
                kind: 'append',
                type: 'reasoning'
              })
            } else if (
              data.delta.type === 'text'
            ) {
              updates.push({
                content: data.delta.text || '',
                id:
                  step.type === 'thought'
                    ? (
                        step.blockId ||
                        'interactions:reasoning:' +
                        data.index
                      )
                    : (
                        step.blockId ||
                        'interactions:text:' +
                        data.index
                      ),
                kind: 'append',
                type:
                  step.type === 'thought'
                    ? 'reasoning'
                    : 'text'
              })
            } else if (
              data.delta.type === 'arguments_delta'
            ) {
              updates.push({
                id:
                  step.blockId ||
                  'interactions:tool:' +
                  data.index,
                inputDelta:
                  data.delta.arguments || '',
                kind: 'tool',
                name: step.name,
                serverSide:
                  step.serverSide === true,
                status:
                  step.serverSide
                    ? 'running'
                    : 'preparing',
                toolType:
                  step.type || 'function_call'
              })
            } else if (
              isInteractionToolType(
                data.delta.type
              )
            ) {
              updates.push({
                id:
                  step.blockId ||
                  'interactions:tool:' +
                  data.index,
                input:
                  data.delta.arguments ||
                  data.delta.input,
                kind: 'tool',
                name:
                  data.delta.name ||
                  step.name ||
                  humanizeToolType(
                    data.delta.type
                  ),
                serverSide: true,
                status: 'running',
                toolType: data.delta.type
              })
            } else if (
              isInteractionResultType(
                data.delta.type
              )
            ) {
              updates.push({
                id:
                  'interactions:tool:' +
                  (
                    data.delta.call_id ||
                    step.id ||
                    data.index
                  ),
                kind: 'tool',
                output:
                  data.delta.result ||
                  data.delta.output ||
                  data.delta.content,
                serverSide: true,
                status: 'completed',
                toolType:
                  data.delta.type.replace(
                    /_result$/,
                    '_call'
                  )
              })
            }
          }

          if (type === 'step.stop') {
            const step =
              streamState.interactionSteps[
                data.index
              ]

            if (
              step &&
              isInteractionToolType(step.type)
            ) {
              updates.push({
                id:
                  step.blockId ||
                  'interactions:tool:' +
                  data.index,
                kind: 'tool',
                serverSide:
                  step.serverSide === true,
                status:
                  step.serverSide
                    ? 'completed'
                    : 'waiting'
              })
            }
          }

          if (type === 'error') {
            return {
              error:
                (
                  data.error &&
                  data.error.message
                ) ||
                data.message ||
                'API trả về lỗi.'
            }
          }

          if (type === 'interaction.completed') {
            const parsed =
              this.parseFull(data.interaction || {})

            return {
              done: true,
              finalBlocks:
                parsed.blocks.length
                  ? parsed.blocks
                  : null,
              finalizeTools: true,
              updates
            }
          }

          if (
            type === 'interaction.requires_action'
          ) {
            return {
              finalizeTools: true,
              updates
            }
          }

          return { updates }
        },

        parseFull (json) {
          return createParsedResponse(
            createInteractionBlocks(json)
          )
        },

        parseError (json) {
          return (
            json.error &&
            json.error.message
              ? json.error.message
              : ''
          )
        }
      }
    }

    function createDefaultSettings () {
      return {
        budget: null,
        effort: null,
        level: null,
        maxTokens: null,
        mode: null,
        reasoningEnabled: false,
        showReasoning: true,
        streaming: true,
        systemPrompt: '',
        temperature: 1,
        temperatureAuto: false,
        toolsJson: '',
        topK: null,
        topP: 1,
        topPAuto: true,
        variableEntries: [],
        variables: {},
        verbosity: null,
        zeroDataRetention: true
      }
    }

    function sanitizeSettings (rawSettings) {
      const settings = createDefaultSettings()

      const raw =
        rawSettings &&
        typeof rawSettings === 'object'
          ? rawSettings
          : {}

      settings.temperature = clampValue(
        Number.isFinite(Number(raw.temperature))
          ? Number(raw.temperature)
          : 1,
        0,
        2
      )

      settings.topP = clampValue(
        Number.isFinite(Number(raw.topP))
          ? Number(raw.topP)
          : 1,
        0,
        1
      )

      settings.topK =
        raw.topK == null || raw.topK === ''
          ? null
          : Math.max(
              1,
              Math.floor(Number(raw.topK) || 1)
            )

      settings.maxTokens =
        raw.maxTokens == null ||
        raw.maxTokens === ''
          ? null
          : Math.max(
              1,
              Math.floor(
                Number(raw.maxTokens) || 1
              )
            )

      settings.budget =
        Number.isFinite(Number(raw.budget)) &&
        Number(raw.budget) >= 1
          ? Math.floor(Number(raw.budget))
          : null

      settings.streaming =
        raw.streaming !== false

      settings.reasoningEnabled =
        raw.reasoningEnabled === true

      settings.showReasoning =
        raw.showReasoning !== false

      settings.zeroDataRetention =
        raw.zeroDataRetention !== false

      settings.systemPrompt =
        typeof raw.systemPrompt === 'string'
          ? raw.systemPrompt
          : ''

      settings.toolsJson =
        typeof raw.toolsJson === 'string'
          ? raw.toolsJson
          : ''

      settings.variables =
        raw.variables &&
        !Array.isArray(raw.variables) &&
        typeof raw.variables === 'object'
          ? raw.variables
          : {}

      settings.variableEntries =
        Array.isArray(raw.variableEntries)
          ? sanitizeVariableEntries(
              raw.variableEntries
            )
          : createVariableEntries(
              settings.variables
            )

      settings.temperatureAuto =
        typeof raw.temperatureAuto === 'boolean'
          ? raw.temperatureAuto
          : false

      settings.topPAuto =
        typeof raw.topPAuto === 'boolean'
          ? raw.topPAuto
          : true

      settings.verbosity = [
        'low',
        'medium',
        'high'
      ].includes(raw.verbosity)
        ? raw.verbosity
        : null

      settings.effort = [
        'minimal',
        'low',
        'medium',
        'high',
        'xhigh',
        'max'
      ].includes(raw.effort)
        ? raw.effort
        : null

      settings.level = [
        'minimal',
        'low',
        'medium',
        'high'
      ].includes(raw.level)
        ? raw.level
        : null

      settings.mode = [
        'standard',
        'pro'
      ].includes(raw.mode)
        ? raw.mode
        : null

      return settings
    }

    function sanitizeConfiguration (
      configuration,
      fallbackConfiguration
    ) {
      const source =
        configuration &&
        typeof configuration === 'object'
          ? configuration
          : {}

      const fallback =
        fallbackConfiguration &&
        typeof fallbackConfiguration === 'object'
          ? fallbackConfiguration
          : {}

      return {
        endpointId:
          typeof source.endpointId === 'string'
            ? source.endpointId
            : typeof fallback.endpointId === 'string'
              ? fallback.endpointId
              : null,
        modelId:
          typeof source.modelId === 'string'
            ? source.modelId
            : typeof fallback.modelId === 'string'
              ? fallback.modelId
              : '',
        settings: sanitizeSettings(
          source.settings ||
          fallback.settings
        )
      }
    }

    function cloneConfiguration (configuration) {
      return sanitizeConfiguration(
        cloneValue(configuration)
      )
    }

    function sanitizeAttachment (attachment) {
      if (
        !attachment ||
        typeof attachment !== 'object' ||
        typeof attachment.name !== 'string'
      ) {
        return null
      }

      return {
        base64:
          typeof attachment.base64 === 'string'
            ? attachment.base64
            : null,
        dataUrl:
          typeof attachment.dataUrl === 'string'
            ? attachment.dataUrl
            : null,
        id:
          typeof attachment.id === 'string'
            ? attachment.id
            : createUniqueId(),
        name: attachment.name,
        size: Number(attachment.size) || 0,
        text:
          typeof attachment.text === 'string'
            ? attachment.text
            : null,
        type:
          typeof attachment.type === 'string'
            ? attachment.type
            : '',
        url:
          typeof attachment.url === 'string'
            ? attachment.url
            : attachment.dataUrl || null
      }
    }

    function sanitizeMessage (message) {
      if (
        !message ||
        typeof message !== 'object' ||
        !MESSAGE_ROLES.includes(message.role)
      ) {
        return null
      }

      const output = {
        content:
          typeof message.content === 'string'
            ? message.content
            : '',
        createdAt:
          Number.isFinite(message.createdAt)
            ? message.createdAt
            : Date.now(),
        id:
          typeof message.id === 'string'
            ? message.id
            : createUniqueId(),
        role: message.role
      }

      if (Array.isArray(message.attachments)) {
        output.attachments =
          message.attachments
            .map(sanitizeAttachment)
            .filter(Boolean)
            .slice(0, MAXIMUM_FILES)
      }

      if (!isAssistantRole(output.role)) {
        return output
      }

      const allowedStatuses = [
        'complete',
        'error',
        'stopped',
        'streaming'
      ]

      output.outputBlocks =
        Array.isArray(message.outputBlocks)
          ? message.outputBlocks
              .map(sanitizeOutputBlock)
              .filter(Boolean)
          : []

      output.reasoning =
        typeof message.reasoning === 'string'
          ? message.reasoning
          : ''

      output.reasoningRedacted =
        message.reasoningRedacted === true

      output.showReasoning =
        message.showReasoning !== false

      output.status =
        message.status === 'streaming'
          ? 'stopped'
          : allowedStatuses.includes(message.status)
            ? message.status
            : 'complete'

      ;[
        'endpointId',
        'endpointName',
        'model',
        'modelLabel'
      ].forEach(property => {
        if (typeof message[property] === 'string') {
          output[property] = message[property]
        }
      })

      if (
        message.error &&
        typeof message.error.message === 'string'
      ) {
        output.error = {
          kind:
            typeof message.error.kind === 'string'
              ? message.error.kind
              : 'api',
          message: message.error.message
        }
      }

      if (!output.outputBlocks.length) {
        if (output.reasoning) {
          output.outputBlocks.push(
            createReasoningBlock(
              output.id + ':reasoning',
              output.reasoning
            )
          )
        }

        if (output.reasoningRedacted) {
          output.outputBlocks.push(
            createRedactedBlock(
              output.id + ':redacted'
            )
          )
        }

        if (output.content) {
          output.outputBlocks.push(
            createTextBlock(
              output.id + ':text',
              output.content
            )
          )
        }
      }

      syncMessageOutput(output)
      return output
    }

    function sanitizeConversation (
      conversation,
      fallbackConfiguration
    ) {
      if (
        !conversation ||
        typeof conversation !== 'object' ||
        !Array.isArray(conversation.messages)
      ) {
        return null
      }

      const messages =
        conversation.messages
          .map(sanitizeMessage)
          .filter(Boolean)

      const title =
        typeof conversation.title === 'string'
          ? conversation.title.trim()
          : ''

      const output = {
        configuration:
          sanitizeConfiguration(
            conversation.configuration,
            fallbackConfiguration
          ),
        createdAt:
          Number.isFinite(conversation.createdAt)
            ? conversation.createdAt
            : Date.now(),
        id:
          typeof conversation.id === 'string'
            ? conversation.id
            : createUniqueId(),
        messages,
        pinned:
          conversation.pinned === true,
        renamed:
          conversation.renamed === true &&
          Boolean(title),
        title:
          title || TEXT.newConversationTitle,
        updatedAt:
          Number.isFinite(conversation.updatedAt)
            ? conversation.updatedAt
            : Date.now()
      }

      if (!title) {
        output.title =
          getAutomaticConversationTitle(output)
      }

      return output
    }

    function sanitizeEndpoint (endpoint) {
      if (
        !endpoint ||
        typeof endpoint !== 'object' ||
        !API_FORMATS[endpoint.format]
      ) {
        return null
      }

      return {
        apiKey:
          typeof endpoint.apiKey === 'string'
            ? endpoint.apiKey
            : '',
        baseUrl:
          typeof endpoint.baseUrl === 'string'
            ? endpoint.baseUrl
            : '',
        format: endpoint.format,
        headers:
          Array.isArray(endpoint.headers)
            ? endpoint.headers
                .filter(header => {
                  return (
                    header &&
                    typeof header.name === 'string' &&
                    header.name.trim()
                  )
                })
                .slice(0, 20)
                .map(header => ({
                  name: header.name.trim(),
                  value:
                    typeof header.value === 'string'
                      ? header.value
                      : ''
                }))
            : [],
        id:
          typeof endpoint.id === 'string'
            ? endpoint.id
            : createUniqueId(),
        models:
          Array.isArray(endpoint.models)
            ? endpoint.models
                .filter(model => {
                  return (
                    typeof model === 'string' &&
                    model.trim()
                  )
                })
                .slice(0, 50)
            : [],
        name:
          typeof endpoint.name === 'string' &&
          endpoint.name.trim()
            ? endpoint.name.trim()
            : 'Endpoint'
      }
    }

    function readStorageValue (key) {
      const source = window.localStorage.getItem(key)

      if (source == null) return null

      try {
        return JSON.parse(source)
      } catch {
        return null
      }
    }

    function readStorageWithFallback (
      currentKey,
      legacyKey
    ) {
      const current = readStorageValue(currentKey)

      return current == null
        ? readStorageValue(legacyKey)
        : current
    }

    function loadSavedState () {
      try {
        return {
          activeId:
            readStorageWithFallback(
              STORAGE_KEYS.activeConversationId,
              LEGACY_STORAGE_KEYS.activeConversationId
            ),
          conversations:
            readStorageWithFallback(
              STORAGE_KEYS.conversations,
              LEGACY_STORAGE_KEYS.conversations
            ),
          endpoints:
            readStorageWithFallback(
              STORAGE_KEYS.endpoints,
              LEGACY_STORAGE_KEYS.endpoints
            ),
          legacyAccent:
            window.localStorage.getItem(
              LEGACY_ACCENT_STORAGE_KEY
            ),
          ui:
            readStorageWithFallback(
              STORAGE_KEYS.ui,
              LEGACY_STORAGE_KEYS.ui
            ),
          workspaceConfiguration:
            readStorageWithFallback(
              STORAGE_KEYS.workspaceConfiguration,
              LEGACY_STORAGE_KEYS.workspaceConfiguration
            )
        }
      } catch {
        return null
      }
    }

    const savedState = loadSavedState()

    const savedWorkspaceConfiguration =
      sanitizeConfiguration(

        savedState.workspaceConfiguration
      )

    const state = {
      activeConfiguration: null,
      activeConversationId: null,
      attachments: [],
      conversationSearchQuery: '',
      conversations:
        savedState &&
        Array.isArray(savedState.conversations)
          ? savedState.conversations
              .map(conversation => {
                return sanitizeConversation(
                  conversation,
                  savedWorkspaceConfiguration
                )
              })
              .filter(Boolean)
          : [],
      editingMessageId: null,
      endpointId: null,
      endpoints:
        savedState &&
        Array.isArray(savedState.endpoints)
          ? savedState.endpoints
              .map(sanitizeEndpoint)
              .filter(Boolean)
          : [],
      messageDraft: '',
      modelId: '',
      newMessageId: null,
      openDrawerSelector: null,
      pendingAttachmentReads: 0,
      settings: createDefaultSettings(),
      ui: {
        accent:
          normalizeHexColor(
            savedState &&
            savedState.ui &&
            savedState.ui.accent
              ? savedState.ui.accent
              : savedState &&
                savedState.legacyAccent
          ),
        settingsOpen:
          !savedState ||
          !savedState.ui ||
          savedState.ui.settingsOpen !== false,
        sidebarOpen:
          !savedState ||

    applyAccentColor(state.ui.accent)

    let variableEntries = []
    let markdownReader = null
    let markdownWriter = null
    let modalState = null
    let endpointDialogOpen = false
    let endpointDialogPreviousFocus = null
    let editingEndpointId = null
    let endpointFormModels = []
    let endpointFormHeaders = []
    let endpointFormApiKeyCleared = false
    let shouldStickToBottom = true

    let apiRequestWorker = null

    const apiWorkerRequests = new Map()
