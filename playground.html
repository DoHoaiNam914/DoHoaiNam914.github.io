<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thái Sơ — AI Playground</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5/300.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/700.css">
  <style>
    :root {
      --font-ui: 'be vietnam pro', system-ui, sans-serif;
      --font-mono: 'jetbrains mono', ui-monospace, monospace;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
    }

    html[data-theme='dark'] {
      color-scheme: dark;
      --bg: #0c0f13;
      --panel: #12161d;
      --panel-2: #181d26;
      --hover: #1d2430;
      --border: #242c38;
      --border-soft: #1c232e;
      --border-strong: #334052;
      --text: #e8ecf3;
      --muted: #94a1b3;
      --faint: #64718a;
      --accent: #e0663a;
      --accent-strong: #ef7d50;
      --accent-ink: #200d05;
      --accent-soft: rgba(224, 102, 58, 0.14);
      --gold: #d2a24c;
      --gold-soft: rgba(210, 162, 76, 0.14);
      --success: #43b280;
      --error: #e25b52;
      --error-soft: rgba(226, 91, 82, 0.12);
      --code-bg: #0a0d11;
      --user-bg: #161c26;
      --sys-bg: rgba(210, 162, 76, 0.08);
      --dot: rgba(148, 161, 179, 0.13);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --scrim: rgba(4, 6, 9, 0.55);
      --chevron: url(data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='10'%20height='6'%20viewBox='0%200%2010%206'%3E%3Cpath%20d='M1%201l4%204%204-4'%20fill='none'%20stroke='%2394a1b3'%20stroke-width='1.6'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E);
    }

    html[data-theme='light'] {
      color-scheme: light;
      --bg: #f3f0e8;
      --panel: #fffdf8;
      --panel-2: #f7f3ea;
      --hover: #efe9db;
      --border: #ded6c3;
      --border-soft: #e7e0d0;
      --border-strong: #c4b998;
      --text: #232830;
      --muted: #5d6874;
      --faint: #8b93a0;
      --accent: #c2491d;
      --accent-strong: #a83d16;
      --accent-ink: #fff6f0;
      --accent-soft: rgba(194, 73, 29, 0.1);
      --gold: #96700f;
      --gold-soft: rgba(150, 112, 15, 0.12);
      --success: #1f7d52;
      --error: #c23a35;
      --error-soft: rgba(194, 58, 53, 0.1);
      --code-bg: #f6f2e7;
      --user-bg: #f8f4ea;
      --sys-bg: rgba(150, 112, 15, 0.07);
      --dot: rgba(93, 104, 116, 0.14);
      --shadow: 0 10px 26px rgba(60, 48, 30, 0.14);
      --scrim: rgba(38, 32, 20, 0.38);
      --chevron: url(data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='10'%20height='6'%20viewBox='0%200%2010%206'%3E%3Cpath%20d='M1%201l4%204%204-4'%20fill='none'%20stroke='%235d6874'%20stroke-width='1.6'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }

    button, input, select, textarea { font: inherit; color: inherit; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    ::selection { background: var(--accent-soft); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .mono { font-family: var(--font-mono); }

    .ic { width: 16px; height: 16px; flex: none; vertical-align: middle; }

    .ic-sm { width: 14px; height: 14px; }

    .ic-lg { width: 20px; height: 20px; }

    .icon-btn, .mini-btn, .chip-x, .search-clear, .attach-btn, .send-btn,
    .code-copy, .act-btn, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      height: 100dvh;
    }

    aside { min-width: 0; }

    .sidebar {
      width: 290px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow: hidden;
      transition: width 0.22s ease;
    }

    .sidebar.closed { width: 0; border-right-color: transparent; }

    .side-inner { width: 290px; height: 100%; display: flex; flex-direction: column; }

    .side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 14px 10px;
    }

    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

    .brand-img {
      width: 34px;
      height: 34px;
      flex: none;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .brand-name { font-weight: 700; font-size: 15px; letter-spacing: 0.2px; line-height: 1.1; }

    .brand-sub {
      display: block;
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 1.6px;
      color: var(--faint);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .side-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 12px; gap: 10px; }

    .btn-new {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      border-radius: var(--r-md);
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-new:hover { background: var(--accent); color: var(--accent-ink); }

    .search-wrap { position: relative; display: flex; align-items: center; }

    .search-wrap > .ic {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--faint);
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      padding: 9px 30px 9px 34px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
    }

    .search-wrap input::placeholder { color: var(--faint); }

    .search-wrap input:focus { border-color: var(--accent); outline: none; }

    .search-clear {
      position: absolute;
      right: 4px;
      width: 26px;
      height: 26px;
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
    }

    .search-clear:hover { color: var(--text); background: var(--hover); }

    .conv-list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }

    .conv-group-label {
      margin: 10px 6px 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--faint);
    }

    .conv {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 8px 9px 12px;
      border-radius: var(--r-sm);
      cursor: pointer;
      border: 1px solid transparent;
    }

    .conv:hover, .conv:focus-visible { background: var(--hover); }

    .conv.active { background: var(--accent-soft); border-color: var(--accent); }

    .conv.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 3px;
      background: var(--accent);
    }

    .conv-main { flex: 1; min-width: 0; }

    .conv-title {
      display: block;
      font-weight: 500;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv.is-pinned .conv-title { font-weight: 600; }

    .conv-meta { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }

    .conv-actions { display: flex; align-items: center; gap: 2px; opacity: 0; }

    .conv:hover .conv-actions, .conv:focus-within .conv-actions { opacity: 1; }

    @media (hover: none) {
      .conv-actions { opacity: 1; }
    }

    .mini-btn {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 7px;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }

    .mini-btn:hover { background: var(--panel-2); color: var(--text); }

    .mini-btn[aria-pressed='true'] { color: var(--gold); }

    .side-empty {
      margin: 24px 8px;
      display: grid;
      justify-items: center;
      gap: 8px;
      color: var(--faint);
      text-align: center;
      font-size: 12.5px;
    }

    .side-empty .ic { width: 26px; height: 26px; opacity: 0.7; }

    .side-foot {
      padding: 10px 16px;
      border-top: 1px solid var(--border-soft);
      font-size: 11px;
      color: var(--faint);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

    .dot-ok { background: var(--success); }

    .dot-off { background: var(--error); }

    .dot-idle { background: var(--faint); }

    .main { display: flex; flex-direction: column; min-width: 0; height: 100dvh; }

    .topbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      padding: 9px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      flex: none;
      border: 1px solid transparent;
      border-radius: var(--r-sm);
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover { background: var(--hover); color: var(--text); }

    .icon-btn[aria-expanded='true'] { color: var(--accent-strong); background: var(--accent-soft); }

    .brand-mini { display: none; align-items: center; gap: 8px; min-width: 0; }

    .brand-mini .brand-img { width: 28px; height: 28px; border-radius: 8px; }

    .brand-mini strong { font-size: 13.5px; white-space: nowrap; }

    .sel-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

    .sel-label {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--faint);
    }

    .selwrap { position: relative; }

    .selwrap select {
      appearance: none;
      -webkit-appearance: none;
      max-width: 200px;
      width: 100%;
      padding: 6px 28px 6px 10px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background-color: var(--panel-2);
      background-image: var(--chevron);
      background-repeat: no-repeat;
      background-position: right 10px center;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .selwrap select:disabled { opacity: 0.55; cursor: not-allowed; }

    .selwrap select:focus { border-color: var(--accent); outline: none; }

    .btn-ghost {
      border: 1px solid var(--border-strong);
      background: none;
      min-height: 32px;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      padding: 4px 12px;
      border-radius: var(--r-sm);
      cursor: pointer;
    }

    .btn-ghost:hover { color: var(--text); background: var(--hover); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.8px;
      font-weight: 500;
      border: 1px solid;
      white-space: nowrap;
      max-width: 220px;
    }

    .badge > span:last-child { overflow: hidden; text-overflow: ellipsis; }

    .badge-ready { color: var(--success); border-color: var(--success); }

    .badge-idle { color: var(--muted); border-color: var(--border-strong); }

    .badge-off { color: var(--error); border-color: var(--error); background: var(--error-soft); }

    .badge-fmt { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }

    .top-title {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .top-spacer { flex: 1; }

    .chat { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 26px 26px;
      scrollbar-width: thin;
    }

    .chat-inner { max-width: 880px; width: 100%; margin: 0 auto; padding: 18px 20px 10px; }

    .chat-inner.is-empty {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .jump-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 130px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 5;
    }

    .jump-btn:hover { color: var(--text); }

    .msg { display: flex; gap: 12px; padding: 16px 4px; }

    .msg + .msg { border-top: 1px solid var(--border-soft); }

    .msg-avatar {
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }

    .av-user { background: var(--panel-2); color: var(--muted); }

    .av-assistant { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }

    .av-system { background: var(--gold-soft); color: var(--gold); border-color: transparent; }

    .msg-main { flex: 1; min-width: 0; }

    .msg-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }

    .role-select {
      appearance: none;
      -webkit-appearance: none;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-strong);
      background-color: var(--panel-2);
      background-image: var(--chevron);
      background-repeat: no-repeat;
      background-position: right 8px center;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 22px 2px 9px;
      cursor: pointer;
    }

    .role-select:focus { border-color: var(--accent); outline: none; }

    .role-select:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg-model {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--border-soft);
      padding: 2px 7px;
      border-radius: 999px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .msg-time { font-size: 11px; color: var(--faint); }

    .msg-body { min-width: 0; }

    .user-text {
      background: var(--user-bg);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 10px 14px;
      overflow-wrap: anywhere;
    }

    .system-text {
      background: var(--sys-bg);
      border: 1px dashed var(--gold);
      border-radius: var(--r-md);
      padding: 10px 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 13px;
    }

    .tool-text {
      background: var(--panel-2);
      border: 1px dashed var(--border-strong);
      border-radius: var(--r-md);
      padding: 10px 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 13px;
      font-family: var(--font-mono);
    }

    .msg-attach { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

    .att { border: 1px solid var(--border); background: var(--panel); border-radius: var(--r-sm); font-size: 12px; }

    .att-file { display: flex; align-items: center; gap: 7px; padding: 7px 10px; color: var(--muted); max-width: 260px; }

    .att-file .att-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .att-size { color: var(--faint); font-family: var(--font-mono); font-size: 10.5px; }

    .att-img { overflow: hidden; max-width: 220px; }

    .att-img img { display: block; width: 100%; max-height: 150px; object-fit: cover; }

    .att-img figcaption {
      padding: 5px 8px;
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .msg-actions { display: flex; align-items: center; gap: 2px; margin-top: 8px; opacity: 0; transition: opacity 0.15s ease; flex-wrap: wrap; }

    .msg:hover .msg-actions, .msg:focus-within .msg-actions { opacity: 1; }

    @media (hover: none) {
      .msg-actions { opacity: 1; }
    }

    .act-btn {
      height: 28px;
      min-width: 28px;
      padding: 0 7px;
      gap: 5px;
      border: 0;
      border-radius: 7px;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11.5px;
    }

    .act-btn:hover { background: var(--hover); color: var(--text); }

    .act-btn[aria-pressed='true'] { color: var(--accent-strong); background: var(--accent-soft); }

    .err-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--error);
      background: var(--error-soft);
      border-radius: var(--r-md);
      padding: 12px 14px;
      color: var(--text);
    }

    .err-card > .ic { color: var(--error); }

    .err-card p { margin: 0; flex: 1; min-width: 180px; font-size: 13px; overflow-wrap: anywhere; }

    .err-kind {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--error);
      border: 1px solid var(--error);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .stopped-note {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--faint);
    }

    .dots { display: inline-flex; align-items: center; gap: 5px; padding: 8px 2px; }

    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; }

    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }

      50% { opacity: 1; transform: scale(1); }
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      margin-left: 3px;
      vertical-align: -2px;
      background: var(--accent);
      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .md { line-height: 1.65; overflow-wrap: anywhere; }

    .md > *:first-child { margin-top: 0; }

    .md > *:last-child { margin-bottom: 0; }

    .md p { margin: 8px 0; }

    .md h3, .md h4, .md h5, .md h6 { margin: 16px 0 6px; line-height: 1.35; }

    .md h3 { font-size: 15.5px; }

    .md h4 { font-size: 14.5px; }

    .md h5, .md h6 { font-size: 13.5px; }

    .md ul, .md ol { margin: 8px 0; padding-left: 22px; }

    .md li { margin: 3px 0; }

    .md blockquote {
      margin: 10px 0;
      padding: 6px 14px;
      border-left: 3px solid var(--gold);
      background: var(--gold-soft);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      color: var(--muted);
    }

    .md hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }

    .md a { color: var(--accent-strong); text-decoration: underline; text-underline-offset: 2px; }

    .md code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--panel-2);
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      padding: 1.5px 5px;
    }

    .codeblock { margin: 12px 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--code-bg); }

    .code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 8px 5px 12px;
      border-bottom: 1px solid var(--border-soft);
    }

    .code-lang {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--faint);
    }

    .code-copy {
      gap: 5px;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      min-height: 26px;
    }

    .code-copy:hover { background: var(--hover); color: var(--text); }

    .code-copy.ok { color: var(--success); }

    .codeblock pre { margin: 0; padding: 12px 14px; overflow: auto; max-height: 420px; }

    .codeblock code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text);
      background: none;
      border: 0;
      padding: 0;
    }

    .tbl-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); border-radius: 10px; }

    .md table { border-collapse: collapse; width: 100%; min-width: 420px; font-size: 13px; }

    .md th, .md td { border-bottom: 1px solid var(--border-soft); padding: 8px 12px; text-align: left; vertical-align: top; }

    .md th { background: var(--panel-2); font-weight: 600; white-space: nowrap; }

    .md tr:last-child td { border-bottom: 0; }

    .welcome { max-width: 640px; width: 100%; padding: 24px 0; }

    .welcome-mark {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .welcome-mark img { width: 100%; height: 100%; object-fit: cover; }

    .welcome h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }

    .welcome > p { margin: 0 0 20px; color: var(--muted); }

    .sugg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .sugg {
      text-align: left;
      padding: 12px 14px;
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      background: var(--panel);
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
      display: block;
    }

    .sugg:hover { border-color: var(--accent); transform: translateY(-1px); }

    .sugg-t { display: block; font-weight: 600; font-size: 13px; margin-bottom: 3px; }

    .sugg-p {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .welcome-actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    .welcome-demo {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--faint);
    }

    .composer-zone { padding: 8px 14px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }

    .composer { max-width: 880px; margin: 0 auto; width: 100%; }

    .add-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }

    .add-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--faint);
      margin-right: 2px;
    }

    .add-role {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .add-role:hover { color: var(--text); border-color: var(--border-strong); background: var(--hover); }

    .attach-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 240px;
      padding: 5px 6px 5px 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: var(--r-sm);
      font-size: 12px;
    }

    .chip img { width: 26px; height: 26px; object-fit: cover; border-radius: 5px; }

    .chip .ic { color: var(--muted); }

    .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }

    .chip-size { color: var(--faint); font-family: var(--font-mono); font-size: 10px; }

    .chip-x {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 6px;
      background: none;
      color: var(--muted);
      cursor: pointer;
      flex: none;
    }

    .chip-x:hover { background: var(--error-soft); color: var(--error); }

    .composer-box {
      border: 1px solid var(--border-strong);
      background: var(--panel);
      border-radius: var(--r-lg);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .composer-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .composer-box textarea {
      display: block;
      width: 100%;
      border: 0;
      background: none;
      resize: none;
      padding: 13px 15px 4px;
      color: var(--text);
      line-height: 1.55;
      max-height: 220px;
      outline: none;
    }

    .composer-box textarea::placeholder { color: var(--faint); }

    .composer-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px; }

    .composer-hint { flex: 1; font-size: 11px; color: var(--faint); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .char-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }

    .attach-btn {
      width: 38px;
      height: 38px;
      flex: none;
      border: 0;
      border-radius: 10px;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }

    .attach-btn:hover { background: var(--hover); color: var(--text); }

    .send-btn {
      width: 40px;
      height: 40px;
      flex: none;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .send-btn:hover:not(:disabled) { background: var(--accent-strong); }

    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .send-btn.stop { background: var(--error-soft); color: var(--error); border: 1px solid var(--error); }

    .edit-box textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      padding: 10px 12px;
      border-radius: var(--r-md);
      border: 1px solid var(--accent);
      background: var(--panel);
      color: var(--text);
      line-height: 1.55;
    }

    .edit-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }

    .settings {
      width: 330px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      overflow: hidden;
      transition: width 0.22s ease;
    }

    .settings.closed { width: 0; border-left-color: transparent; }

    .set-inner { width: 330px; height: 100%; display: flex; flex-direction: column; }

    .set-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--border-soft);
    }

    .set-head h2 { margin: 0; font-size: 14px; font-weight: 700; }

    .set-head-actions { display: flex; align-items: center; gap: 4px; }

    .set-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }

    .set-section { margin-bottom: 22px; }

    .set-label {
      margin: 0 0 10px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--faint);
    }

    .field { margin-bottom: 16px; position: relative; }

    .field:last-child { margin-bottom: 0; }

    .field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }

    .field-head label, .field-label { font-size: 13px; font-weight: 500; }

    .param-row { display: flex; align-items: center; gap: 10px; }

    .param-row input[type='range'] { flex: 1 1 auto; min-width: 0; }

    .param-row .param-num {
      width: 58px;
      flex: none;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 4px 6px;
    }

    .param-field.is-off label { color: var(--faint); }

    .param-field.is-off input { opacity: 0.55; cursor: not-allowed; }

    input[type='range'] { width: 100%; height: 26px; accent-color: var(--accent); cursor: pointer; }

    input[type='range']:disabled { opacity: 0.55; cursor: not-allowed; }

    .text-input, .num-input {
      width: 100%;
      padding: 9px 11px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
    }

    .text-input:focus, .num-input:focus { border-color: var(--accent); outline: none; }

    .text-input:disabled, .num-input:disabled { opacity: 0.55; cursor: not-allowed; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }

    .chips:empty { display: none; }

    .stop-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 4px 3px 9px;
      border-radius: 7px;
      border: 1px solid var(--border-strong);
      background: var(--panel-2);
      font-family: var(--font-mono);
      font-size: 11.5px;
      max-width: 100%;
      overflow: hidden;
    }

    .stop-chip > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    .switch-label { cursor: pointer; }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex: none;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--panel-2);
      cursor: pointer;
      padding: 0;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .switch .knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .switch[aria-checked='true'] { background: var(--accent); border-color: var(--accent); }

    .switch[aria-checked='true'] .knob { transform: translateX(18px); background: var(--accent-ink); }

    .url-hint { margin: 6px 0 0; font-size: 11px; color: var(--faint); overflow-wrap: anywhere; }

    .btn {
      gap: 7px;
      min-height: 36px;
      padding: 7px 15px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border-strong);
      background: var(--panel-2);
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn:hover { background: var(--hover); }

    .btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

    .btn-accent:hover { background: var(--accent-strong); }

    .btn-danger { background: var(--error); border-color: var(--error); color: #fff; }

    .btn-sm { min-height: 30px; padding: 4px 11px; font-size: 12px; }

    .toasts {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom));
      right: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 120;
      pointer-events: none;
      max-width: min(380px, calc(100vw - 24px));
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      border-radius: var(--r-md);
      background: var(--panel);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow);
      font-size: 13px;
      pointer-events: auto;
      animation: toast-in 0.2s ease;
    }

    .toast.leaving { opacity: 0; transform: translateY(6px); transition: opacity 0.2s ease, transform 0.2s ease; }

    .toast .ic { flex: none; }

    .toast.t-success .ic { color: var(--success); }

    .toast.t-error .ic { color: var(--error); }

    .toast.t-info .ic { color: var(--gold); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }

      to { opacity: 1; transform: none; }
    }

    .modal-root { position: fixed; inset: 0; z-index: 150; display: none; }

    .modal-root.open { display: block; }

    .modal-backdrop { position: absolute; inset: 0; background: var(--scrim); }

    .modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(440px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .modal h3 { margin: 0 0 8px; font-size: 15px; }

    .modal-body { color: var(--muted); font-size: 13px; line-height: 1.55; margin-bottom: 12px; overflow-wrap: anywhere; }

    .modal-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 16px; }

    .ep-root { position: fixed; inset: 0; z-index: 140; display: none; }

    .ep-root.open { display: block; }

    .ep-backdrop { position: absolute; inset: 0; background: var(--scrim); }

    .ep-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(720px, calc(100vw - 24px));
      max-height: min(860px, 92dvh);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
    }

    .ep-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-soft);
    }

    .ep-head h2 { margin: 0; font-size: 15px; }

    .ep-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }

    .ep-card {
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .ep-card:hover, .ep-card:focus-visible { border-color: var(--border-strong); }

    .ep-card.active { border-color: var(--accent); background: var(--accent-soft); }

    .ep-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

    .ep-name { font-size: 13.5px; }

    .ep-url {
      margin-top: 6px;
      font-size: 11px;
      color: var(--faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ep-meta { margin-top: 4px; font-size: 11.5px; color: var(--muted); }

    .ep-models { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .ep-card-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

    .ep-active-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--success);
      letter-spacing: 0.8px;
    }

    .ep-empty { color: var(--faint); font-size: 13px; text-align: center; padding: 18px 8px; }

    .ep-form {
      border-top: 1px dashed var(--border-strong);
      margin-top: 12px;
      padding-top: 14px;
    }

    .ep-form h3 { margin: 0 0 12px; font-size: 14px; }

    .ep-form .selwrap select { max-width: none; width: 100%; }

    .ep-model-row { display: flex; align-items: center; gap: 8px; }

    .ep-headers { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }

    .ep-headers:empty { display: none; }

    .ep-header-row { display: flex; align-items: center; gap: 8px; }

    .ep-header-row input { flex: 1; min-width: 0; padding: 7px 9px; font-size: 12.5px; }

    .ep-header-row .ep-header-name { flex: 0 0 38%; }

    .ep-form-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 14px; }

    .ep-foot { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

    .backdrop {
      position: fixed;
      inset: 0;
      background: var(--scrim);
      z-index: 55;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .backdrop.show { opacity: 1; pointer-events: auto; }

    @media (max-width: 1279px) {
      .app { grid-template-columns: 1fr; }

      .sidebar, .settings {
        position: fixed;
        top: 0;
        bottom: 0;
        z-index: 60;
        transition: transform 0.22s ease;
        box-shadow: var(--shadow);
      }

      .sidebar { left: 0; width: min(320px, 88vw); transform: translateX(-104%); }

      .sidebar.closed { width: min(320px, 88vw); }

      .sidebar.drawer-open { transform: translateX(0); }

      .side-inner { width: min(320px, 88vw); }

      .settings { right: 0; width: min(350px, 92vw); transform: translateX(104%); }

      .settings.closed { width: min(350px, 92vw); }

      .settings.drawer-open { transform: translateX(0); }

      .set-inner { width: min(350px, 92vw); }

      .set-close { display: inline-flex; }

      .brand-mini { display: flex; }
    }

    @media (min-width: 1280px) {
      .set-close { display: none; }
    }

    @media (max-width: 767px) {
      .topbar { padding: 8px 10px; gap: 6px 8px; }

      .selwrap select { max-width: 138px; font-size: 12.5px; }

      .sel-label { display: none; }

      .top-title { display: none; }

      .btn-ep-text { display: none; }

      .btn-ghost { padding: 4px 9px; }

      .chat-inner { padding: 12px 12px 8px; }

      .composer-hint { display: none; }

      .sugg-grid { grid-template-columns: 1fr; }

      .toasts { right: 12px; left: 12px; align-items: stretch; }

      .msg { gap: 9px; }

      .ep-header-row { flex-wrap: wrap; }

      .ep-header-row input { flex: 1 1 100%; }

      .ep-header-row .ep-header-name { flex: 1 1 100%; }
    }

    @media (max-width: 359px) {
      .selwrap select { max-width: 106px; }

      .badge { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="app-sidebar" aria-label="Lịch sử hội thoại">
      <div class="side-inner">
        <div class="side-head">
          <div class="brand">
            <img class="brand-img" src="https://image.qwenlm.ai/public_source/2a904459-04a0-4a16-97bd-8d2bc08ca7cf/1fb4640aa-2652-444a-833b-4a3a60129ba9.png" alt="">
            <div>
              <span class="brand-name">Thái Sơ</span>
              <span class="brand-sub">AI Playground</span>
            </div>
          </div>
          <button type="button" class="icon-btn" id="btn-side-collapse" data-icon="panelLeft" aria-label="Thu gọn thanh lịch sử"></button>
        </div>
        <div class="side-body">
          <button type="button" class="btn-new" id="btn-new">
            <span data-icon="plus"></span>
            Cuộc trò chuyện mới
          </button>
          <div class="search-wrap">
            <span data-icon="search"></span>
            <input type="search" id="search-input" placeholder="Tìm hội thoại…" aria-label="Tìm kiếm lịch sử hội thoại" autocomplete="off">
            <button type="button" class="search-clear" id="btn-search-clear" data-icon="x" aria-label="Xoá từ khoá tìm kiếm" hidden></button>
          </div>
          <nav class="conv-list" id="conv-list" aria-label="Danh sách hội thoại"></nav>
        </div>
        <div class="side-foot">
          <span class="dot dot-idle"></span>
          Lịch sử lưu cục bộ
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button type="button" class="icon-btn" id="btn-menu" data-icon="panelLeft" aria-label="Mở hoặc đóng thanh lịch sử" aria-expanded="true"></button>
        <div class="brand-mini">
          <img class="brand-img" src="https://image.qwenlm.ai/public_source/2a904459-04a0-4a16-97bd-8d2bc08ca7cf/1fb4640aa-2652-444a-833b-4a3a60129ba9.png" alt="">
          <strong>Thái Sơ</strong>
        </div>
        <div class="sel-field">
          <span class="sel-label" id="lbl-endpoint">Kết nối</span>
          <div class="selwrap">
            <select id="endpoint-select" aria-labelledby="lbl-endpoint"></select>
          </div>
        </div>
        <div class="sel-field">
          <span class="sel-label" id="lbl-model">Model</span>
          <div class="selwrap">
            <select id="model-select" aria-labelledby="lbl-model"></select>
          </div>
        </div>
        <button type="button" class="btn btn-ghost" id="btn-ep" aria-label="Quản lí kết nối API">
          <span data-icon="plug"></span>
          <span class="btn-ep-text">Kết nối</span>
        </button>
        <div class="top-title" id="top-title"></div>

    }

    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v))

    function debounce (fn, ms) {
      let t = null
      return (...args) => {
        clearTimeout(t)
        t = setTimeout(() => fn(...args), ms)
      }
    }

    function escapeHtml (s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[c])
    }

    function timeAgoVi (ts) {
      const m = Math.floor((Date.now() - ts) / 60000)
      if (m < 1) return 'vừa xong'
      if (m < 60) return m + ' phút trước'
      const h = Math.floor(m / 60)
      if (h < 24) return h + ' giờ trước'
      return new Date(ts).toLocaleDateString('vi-VN')
    }

    function fmtBytes (n) {
      if (!Number.isFinite(n)) return ''
      if (n < 1024) return n + ' B'
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB'
      return (n / 1024 / 1024).toFixed(1) + ' MB'
    }

    async function copyText (text) {
      try {
        await navigator.clipboard.writeText(text)
        return true
      } catch (err) {
        try {
          const ta = document.createElement('textarea')
          ta.value = text
          ta.style.position = 'fixed'
          ta.style.opacity = '0'
          document.body.appendChild(ta)
          ta.select()
          document.execCommand('copy')
          ta.remove()
          return true
        } catch (err2) {
          return false
        }
      }
    }

    const TOOL_CALL_ID = 'call_playground'

    function isSystemRole (r) {
      return r === 'system' || r === 'developer'
    }

    function isAssistantRole (r) {
      return r === 'assistant' || r === 'model'
    }

    function splitMessages (messages) {
      const sysParts = []
      const rest = []
      messages.forEach(m => {
        if (isSystemRole(m.role)) {
          if (m.content) sysParts.push(m.content)
        } else {
          rest.push(m)
        }
      })
      return { sysParts, rest }
    }

    const API_FORMATS = {
      'openai-chat': {
        label: 'Chat Completions',
        presetBase: 'https://api.openai.com/v1',
        buildUrl (base, model, stream) {
          return trimBase(base) + '/chat/completions'
        },
        headers (key) {
          return { 'content-type': 'application/json', authorization: 'Bearer ' + key }
        },
        build (ctx) {
          const s = ctx.settings
          const body = {
            model: ctx.model,
            stream: ctx.stream,
            messages: ctx.messages.map(m => {
              if (m.role === 'user' && m.images && m.images.length) {
                const parts = [{ type: 'text', text: m.content }]
                m.images.forEach(img => parts.push({ type: 'image_url', image_url: { url: img.url } }))
                return { role: 'user', content: parts }
              }
              if (isAssistantRole(m.role)) return { role: 'assistant', content: m.content }
              if (m.role === 'tool') return { role: 'tool', tool_call_id: TOOL_CALL_ID, content: m.content }
              return { role: m.role, content: m.content }
            })
          }
          if (s.sampling) {
            body.temperature = s.temperature
            body.top_p = s.topP
          }
          if (s.maxTokens != null) body.max_completion_tokens = s.maxTokens
          return { url: this.buildUrl(ctx.base, ctx.model, ctx.stream), headers: this.headers(ctx.apiKey), body }
        },
        parseEvent (evt) {
          if (evt.raw === '[DONE]') return { done: true }
          const d = evt.data
          if (d.error) return { error: d.error.message || 'Lỗi API' }
          const delta = d.choices && d.choices[0] && d.choices[0].delta
          if (delta && delta.content) return { delta: delta.content }
          return {}
        },

    async function callApi (url, init) {

    async function readSseStream (resp, onEvent) {
      const reader = resp.body.getReader()
      const decoder = new TextDecoder()
      let buf = ''
      let eventName = ''
      let dataLines = []
      const dispatch = () => {
        if (dataLines.length) onEvent({ event: eventName, data: dataLines.join('\n'), raw: dataLines.join('\n') })
        eventName = ''
        dataLines = []
      }
      while (true) {
        const step = await reader.read()
        if (step.done) break
        buf += decoder.decode(step.value, { stream: true })
        let nl = buf.indexOf('\n')
        while (nl !== -1) {
          let line = buf.slice(0, nl)
          buf = buf.slice(nl + 1)
          if (line.endsWith('\r')) line = line.slice(0, -1)
          if (!line) {
            dispatch()
          } else if (line.startsWith(':')) {
            /* bỏ qua dòng comment của SSE */
          } else if (line.startsWith('event:')) {
            eventName = line.slice(6).trim()
          } else if (line.startsWith('data:')) {
            dataLines.push(line.slice(5).replace(/^ /, ''))
          }
          nl = buf.indexOf('\n')
        }
      }
      dispatch()
    }

    function sanitizeMessage (raw) {

      const msg = {
        id: typeof raw.id === 'string' ? raw.id : uid(),

      if (typeof raw.endpointName === 'string') msg.endpointName = raw.endpointName
      let status = raw.status
      if (status === 'streaming') status = 'stopped'
      if (status !== 'complete' && status !== 'stopped' && status !== 'error') status = 'complete'
      msg.status = status
      if (raw.error && typeof raw.error.message === 'string') {
        msg.error = { kind: typeof raw.error.kind === 'string' ? raw.error.kind : 'api', message: raw.error.message }
      }
      if (Array.isArray(raw.attachments)) {
        msg.attachments = raw.attachments

          .slice(0, 4)
          .map(a => ({ name: a.name, size: Number(a.size) || 0, type: typeof a.type === 'string' ? a.type : '' }))

      return msg

    const F3 = '\u0060\u0060\u0060'
    const RE_INLINE_CODE = new RegExp('\u0060([^\u0060\\n]+)\u0060', 'g')

    function inlineMd (s) {
      const codes = []
      s = s.replace(RE_INLINE_CODE, (m, c) => {
        codes.push(c)
        return '\u0000' + (codes.length - 1) + '\u0001'
      })
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, url) => {
        if (!/^(https?:\/\/|mailto:)/i.test(url)) return txt
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${txt}</a>`
      })
      s = s.replace(/\u0000(\d+)\u0001/g, (m, n) => `<code>${codes[Number(n)]}</code>`)
      return s
    }

    function codeBlockHtml (lang, code) {
      const clean = code.replace(/\n$/, '')
      const b64 = enc64(clean)
      return `<div class="codeblock"><div class="code-head"><span class="code-lang">${escapeHtml(lang || 'code')}</span>` +
        `<button type="button" class="code-copy" data-copy="${b64}" aria-label="${STR.copyCode}">${ic('copy', 'ic-sm')}<span>${STR.copyCode}</span></button>` +
        `</div><pre tabindex="0"><code>${escapeHtml(clean)}</code></pre></div>`
    }

    function renderBlocks (raw) {
      const lines = escapeHtml(raw).split('\n')
      let html = ''
      let para = []
      let i = 0
      const flush = () => {
        if (para.length) {
          html += '<p>' + para.map(inlineMd).join('<br>') + '</p>'
          para = []
        }
      }
      const isTableSep = l => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l) && l.includes('-')
      while (i < lines.length) {
        const t = lines[i].trim()
        if (!t) { flush(); i++; continue }
        const h = t.match(/^(#{1,4})\s+(.+)$/)
        if (h) {
          flush()
          const lvl = Math.min(h[1].length + 2, 6)
          html += `<h${lvl}>${inlineMd(h[2])}</h${lvl}>`
          i++
          continue
        }
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flush(); html += '<hr>'; i++; continue }
        if (/^&gt; ?/.test(t)) {
          flush()
          const qlines = []
          while (i < lines.length && /^&gt; ?/.test(lines[i].trim())) {
            qlines.push(lines[i].trim().replace(/^&gt; ?/, ''))
            i++
          }
          html += '<blockquote>' + qlines.map(inlineMd).join('<br>') + '</blockquote>'
          continue
        }
        if (/^[-*]\s+/.test(t)) {
          flush()
          const items = []
          while (i < lines.length && /^[-*]\s+/.test(lines[i].trim())) {
            items.push('<li>' + inlineMd(lines[i].trim().replace(/^[-*]\s+/, '')) + '</li>')
            i++
          }
          html += '<ul>' + items.join('') + '</ul>'
          continue
        }
        if (/^\d+[.)]\s+/.test(t)) {
          flush()
          const items = []
          while (i < lines.length && /^\d+[.)]\s+/.test(lines[i].trim())) {
            items.push('<li>' + inlineMd(lines[i].trim().replace(/^\d+[.)]\s+/, '')) + '</li>')
            i++
          }
          html += '<ol>' + items.join('') + '</ol>'
          continue
        }
        if (t.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          flush()
          const cells = row => row.trim().replace(/^\||\|$/g, '').split('|').map(c => inlineMd(c.trim()))
          let out = '<div class="tbl-wrap"><table><thead><tr>'
          cells(lines[i]).forEach(c => { out += `<th>${c}</th>` })
          out += '</tr></thead><tbody>'
          i += 2
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
            out += '<tr>'
            cells(lines[i]).forEach(c => { out += `<td>${c}</td>` })
            out += '</tr>'
            i++
          }
          out += '</tbody></table></div>'
          html += out
          continue
        }
        para.push(t)
        i++
      }
      flush()
      return html
    }

    function renderMarkdown (src) {
      const parts = String(src || '').split(F3)
      let html = ''
      parts.forEach((part, idx) => {
        if (idx % 2 === 0) {
          html += renderBlocks(part)
          return
        }
        const nl = part.indexOf('\n')
        let lang = ''
        let code = part
        if (nl !== -1 && nl <= 30) {
          const maybe = part.slice(0, nl).trim()
          if (/^[\w+#.-]{0,24}$/.test(maybe)) {
            lang = maybe
            code = part.slice(nl + 1)
          }
        }
        html += codeBlockHtml(lang, code)
      })
      return html
    }

    function toast (msg, kind = 'info', ms = 3400) {
      const wrap = $('#toast-list')
      while (wrap.children.length >= 4) wrap.firstChild.remove()
      const el = document.createElement('div')
      el.className = 'toast t-' + kind
      const iconName = kind === 'success' ? 'check' : kind === 'error' ? 'alert' : 'info'
      el.innerHTML = ic(iconName) + '<span>' + escapeHtml(msg) + '</span>'
      wrap.appendChild(el)
      setTimeout(() => {
        el.classList.add('leaving')
        setTimeout(() => el.remove(), 220)
      }, ms)
    }

    let modalState = null

    function trapTab (e, box) {
      const items = Array.from(box.querySelectorAll('button, input, textarea, select, a[href], [tabindex]:not([tabindex="-1"])'))
        .filter(el => !el.disabled && el.offsetParent !== null)
      if (!items.length) return
      const first = items[0]
      const last = items[items.length - 1]
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus() }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }
    }

    function openModal (opts) {
      return new Promise(resolve => {
        const root = $('#modal-root')
        const prev = document.activeElement
        root.innerHTML = `
          <div class="modal-backdrop" data-close></div>
          <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h3 id="modal-title">${escapeHtml(opts.title)}</h3>
            ${opts.body ? `<div class="modal-body">${escapeHtml(opts.body)}</div>` : ''}
            ${opts.input != null ? `<input type="text" class="text-input" id="modal-input" value="${escapeHtml(opts.input)}" aria-label="${escapeHtml(opts.title)}">` : ''}
            <div class="modal-actions">
              <button type="button" class="btn" data-close>${STR.cancel}</button>
              <button type="button" class="btn ${opts.danger ? 'btn-danger' : 'btn-accent'}" data-ok>${escapeHtml(opts.ok || STR.ok)}</button>
            </div>
          </div>`
        modalState = { resolve, prev }
        root.classList.add('open')
        const modal = root.querySelector('.modal')
        modal.addEventListener('keydown', e => {
          if (e.key === 'Tab') trapTab(e, modal)
          if (e.key === 'Enter' && e.target && e.target.id === 'modal-input') finishModal(e.target.value)
        })
        root.onclick = e => {
          if (e.target.closest('[data-ok]')) {
            const input = $('#modal-input')
            finishModal(input ? input.value : true)
          } else if (e.target.closest('[data-close]')) {
            finishModal(null)
          }
        }
        const input = $('#modal-input')
        if (input) { input.focus(); input.select() } else { root.querySelector('[data-ok]').focus() }
      })
    }

    function finishModal (value) {
      if (!modalState) return
      const ms = modalState
      modalState = null
      const root = $('#modal-root')
      root.classList.remove('open')
      root.innerHTML = ''
      root.onclick = null
      if (ms.prev && ms.prev.focus) ms.prev.focus()
      ms.resolve(value)
    }

    function convItemHtml (c) {
      const active = c.id === state.activeId
      return `
        <div class="conv ${active ? 'active' : ''} ${c.pinned ? 'is-pinned' : ''}" role="button" tabindex="0" data-id="${c.id}" aria-current="${active ? 'true' : 'false'}">
          <div class="conv-main">
            <span class="conv-title" title="${escapeHtml(c.title)}">${escapeHtml(c.title)}</span>
            <span class="conv-meta">${timeAgoVi(c.updatedAt)} · ${c.messages.length} tin</span>
          </div>
          <div class="conv-actions">
            <button type="button" class="mini-btn" data-cact="pin" aria-pressed="${c.pinned}" aria-label="${c.pinned ? 'Bỏ ghim' : 'Ghim'} hội thoại">${ic(c.pinned ? 'pin' : 'pinOff', 'ic-sm')}</button>
            <button type="button" class="mini-btn" data-cact="rename" aria-label="Đổi tên hội thoại">${ic('pencil', 'ic-sm')}</button>
            <button type="button" class="mini-btn" data-cact="del" aria-label="Xoá hội thoại">${ic('trash', 'ic-sm')}</button>
          </div>
        </div>`
    }

    function renderSidebar () {
      const list = $('#conv-list')
      const q = state.query.trim().toLowerCase()
      let items = [...state.conversations]
      if (q) {
        items = items.filter(c =>
          c.title.toLowerCase().includes(q) ||
          c.messages.some(m => m.content && m.content.toLowerCase().includes(q))
        )
      }
      $('#btn-search-clear').hidden = !state.query
      if (!state.conversations.length) {
        list.innerHTML = `<div class="side-empty">${ic('message')}<span>${STR.emptyList}</span></div>`
        return
      }
      if (!items.length) {
        list.innerHTML = `<div class="side-empty">${ic('search')}<span>${STR.noResult}</span><button type="button" class="btn btn-sm" data-act="clear-search">${STR.clearSearch}</button></div>`
        return
      }
      const byTime = (a, b) => b.updatedAt - a.updatedAt
      const pinned = items.filter(c => c.pinned).sort(byTime)
      const rest = items.filter(c => !c.pinned).sort(byTime)
      let html = ''
      if (pinned.length) html += `<div class="conv-group-label">${STR.pinnedGroup}</div>` + pinned.map(convItemHtml).join('')
      if (rest.length) html += `<div class="conv-group-label">${STR.recentGroup}</div>` + rest.map(convItemHtml).join('')
      list.innerHTML = html
    }

    function createConversation (activate) {
      const c = {
        id: uid(),
        title: STR.newTitle,
        pinned: false,
        renamed: false,
        createdAt: Date.now(),
        updatedAt: Date.now(),
        messages: []
      }
      state.conversations.unshift(c)
      if (activate) state.activeId = c.id
      renderSidebar()
      saveNow()
      return c
    }

    function selectConversation (id) {
      if (state.activeId === id) { closeDrawers(); return }
      state.activeId = id
      state.editingId = null
      state.newMsgId = null
      renderSidebar()
      renderMessages()
      renderTopBits()
      saveNow()
      closeDrawers()
      scrollBottom(true)
    }

    async function onConvAction (act, id) {
      const conv = state.conversations.find(c => c.id === id)
      if (!conv) return
      if (act === 'pin') {
        conv.pinned = !conv.pinned
        renderSidebar()
        saveNow()
        return
      }
      if (act === 'rename') {
        const val = await openModal({ title: STR.renameTitle, input: conv.title, ok: STR.save })
        if (val == null) return
        const name = val.trim()
        if (!name) { toast(STR.emptyPrompt, 'error'); return }
        conv.title = name
        conv.renamed = true
        renderSidebar()
        renderTopBits()
        saveNow()
        return
      }
      if (act === 'del') {
        const ok = await openModal({ title: STR.delTitle, body: STR.delBody, ok: STR.delOk, danger: true })
        if (ok !== true) return
        revokeConvUrls(conv)
        state.conversations = state.conversations.filter(c => c.id !== id)
        if (state.activeId === id) state.activeId = state.conversations[0] ? state.conversations[0].id : null
        renderSidebar()
        renderMessages()
        renderTopBits()
        saveNow()
      }
    }

    function revokeConvUrls (conv) {
      conv.messages.forEach(m => {
        if (m.attachments) {
          m.attachments.forEach(a => {
            if (a.url && a.url.startsWith('blob:')) URL.revokeObjectURL(a.url)
          })
        }
      })
    }

    let stickBottom = true

    function scrollBottom (force) {
      const sc = $('#chat-scroll')
      if (force || stickBottom) sc.scrollTop = sc.scrollHeight
    }

    function dotsHtml () {
      return '<span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>'
    }

    function userAttachHtml (list) {
      if (!list || !list.length) return ''
      const items = list.map(a => {
        if (a.url && a.type.indexOf('image/') === 0) {
          return `<figure class="att att-img"><img src="${a.url}" alt="${escapeHtml(a.name)}"><figcaption>${escapeHtml(a.name)}</figcaption></figure>`
        }
        return `<div class="att att-file">${ic('fileText', 'ic-sm')}<span class="att-name" title="${escapeHtml(a.name)}">${escapeHtml(a.name)}</span><span class="att-size">${fmtBytes(a.size)}</span></div>`
      }).join('')
      return `<div class="msg-attach">${items}</div>`
    }

    function assistantBodyHtml (m) {
      if (m.status === 'error') {
        return `<div class="err-card">${ic('alert')}<p>${escapeHtml(m.error ? m.error.message : 'Lỗi API')}</p>` +
          `<span class="err-kind">${escapeHtml(m.error && m.error.kind ? m.error.kind : 'api')}</span>` +
          `<button type="button" class="btn btn-sm btn-accent" data-act="retry" data-id="${m.id}">${ic('rotate', 'ic-sm')}${STR.retry}</button></div>`
      }
      if (m.status === 'streaming') {
        return m.content ? renderMarkdown(m.content) + '<span class="cursor" aria-hidden="true"></span>' : dotsHtml()
      }
      let html = m.content ? renderMarkdown(m.content) : '<p>…</p>'
      if (m.status === 'stopped') {
        html += `<div class="stopped-note">${ic('stop', 'ic-sm')}${STR.stoppedNote}</div>`
      }
      return html
    }

    function actionsHtml (m) {
      if (m.status === 'streaming' || state.editingId === m.id) return ''
      let btns = `<button type="button" class="act-btn" data-act="copy" data-id="${m.id}" aria-label="${STR.copyMsg}">${ic('copy', 'ic-sm')}<span>Sao chép</span></button>`
      btns += `<button type="button" class="act-btn" data-act="edit" data-id="${m.id}">${ic('pencil', 'ic-sm')}<span>${STR.edit}</span></button>`
      if (isAssistantRole(m.role) && m.status !== 'error') {
        btns += `<button type="button" class="act-btn" data-act="regen" data-id="${m.id}">${ic('rotate', 'ic-sm')}<span>${STR.regen}</span></button>`
        btns += `<button type="button" class="act-btn" data-act="fb-up" data-id="${m.id}" aria-pressed="${m.feedback === 'up'}" aria-label="${STR.rateUp}">${ic('thumbsUp', 'ic-sm')}</button>`
        btns += `<button type="button" class="act-btn" data-act="fb-down" data-id="${m.id}" aria-pressed="${m.feedback === 'down'}" aria-label="${STR.rateDown}">${ic('thumbsDown', 'ic-sm')}</button>`
      }
      btns += `<button type="button" class="act-btn" data-act="delete" data-id="${m.id}" aria-label="${STR.deleteMsg}">${ic('trash', 'ic-sm')}<span>${STR.delOk}</span></button>`
      return `<div class="msg-actions">${btns}</div>`
    }

    function editHtml (m) {
      return `<div class="edit-box">
        <textarea id="edit-area" aria-label="Chỉnh sửa tin nhắn ${escapeHtml(m.role)}">${escapeHtml(m.content)}</textarea>
        <div class="edit-actions">
          <button type="button" class="btn btn-sm btn-accent" data-act="save-edit" data-id="${m.id}">${ic('check', 'ic-sm')}${STR.save}</button>
          <button type="button" class="btn btn-sm" data-act="cancel-edit">${STR.cancel}</button>
        </div>
      </div>`
    }

    function buildMsgEl (m) {
      const el = document.createElement('article')
      el.className = 'msg msg-' + m.role + (m.status && isAssistantRole(m.role) ? ' is-' + m.status : '')
      el.setAttribute('data-msg', m.id)
      const avatarIcon = m.role === 'user' ? 'user' : isAssistantRole(m.role) ? 'spark' : 'terminal'
      const avClass = m.role === 'user' ? 'av-user' : isAssistantRole(m.role) ? 'av-assistant' : 'av-system'
      const modelTag = isAssistantRole(m.role) && m.modelLabel
        ? `<span class="msg-model" title="${escapeHtml(m.endpointName || '')}">${escapeHtml(m.modelLabel)}</span>`
        : ''
      const roleOptions = ROLES.map(r => `<option value="${r}"${m.role === r ? ' selected' : ''}>${r}</option>`).join('')
      const disabled = m.status === 'streaming' ? ' disabled' : ''
      let body
      if (state.editingId === m.id) body = editHtml(m)
      else if (m.role === 'user') body = `<div class="user-text">${escapeHtml(m.content).replace(/\n/g, '<br>')}</div>` + userAttachHtml(m.attachments)
      else if (isSystemRole(m.role)) body = `<div class="system-text">${escapeHtml(m.content)}</div>`
      else if (m.role === 'tool') body = `<div class="tool-text">${escapeHtml(m.content)}</div>`
      else body = assistantBodyHtml(m)
      el.innerHTML = `
        <div class="msg-avatar ${avClass}">${ic(avatarIcon)}</div>
        <div class="msg-main">
          <div class="msg-head">
            <select class="role-select" data-msg-role="${m.id}" aria-label="${STR.roleLabel}"${disabled}>${roleOptions}</select>
            ${modelTag}
            <span class="msg-time">${timeAgoVi(m.createdAt)}</span>
          </div>
          <div class="msg-body md">${body}</div>
          ${actionsHtml(m)}
        </div>`
      return el
    }

    function welcomeHtml () {
      const cards = SUGGESTIONS.map((s, i) => `
        <button type="button" class="sugg" data-sugg="${i}">
          <span class="sugg-t">${escapeHtml(s.t)}</span>
          <span class="sugg-p">${escapeHtml(s.p)}</span>
        </button>`).join('')
      const epAction = state.endpoints.length
        ? ''
        : `<button type="button" class="btn btn-accent" data-act="open-ep">${ic('plug')}${STR.addEp}</button>`
      const epNote = state.endpoints.length
        ? ''
        : `<p class="welcome-demo">${ic('info', 'ic-sm')}<span>${STR.welcomeNoEp}</span></p>`
      return `<div class="welcome">
        <div class="welcome-mark"><img src="https://image.qwenlm.ai/public_source/2a904459-04a0-4a16-97bd-8d2bc08ca7cf/1fb4640aa-2652-444a-833b-4a3a60129ba9.png" alt=""></div>
        <h1>${STR.welcomeTitle}</h1>
        <p>${STR.welcomeSub}</p>
        <div class="sugg-grid">${cards}</div>
        <div class="welcome-actions">${epAction}</div>
        ${epNote}
      </div>`
    }

    function renderMessages () {
      const wrap = $('#message-list')
      const conv = currentConv()
      wrap.innerHTML = ''
      if (!conv || !conv.messages.length) {
        wrap.classList.add('is-empty')
        wrap.innerHTML = welcomeHtml()
        wrap.setAttribute('aria-busy', 'false')
        updateComposerButtons()
        return
      }
      wrap.classList.remove('is-empty')
      const frag = document.createDocumentFragment()
      conv.messages.forEach(m => frag.appendChild(buildMsgEl(m)))
      wrap.appendChild(frag)
      wrap.setAttribute('aria-busy', state.generating ? 'true' : 'false')
      if (state.editingId) {
        const ta = $('#edit-area')
        if (ta) {
          ta.focus()
          ta.setSelectionRange(ta.value.length, ta.value.length)
        }
      }
      updateComposerButtons()
    }

    function updateStreamingDom (m) {
      const node = document.querySelector(`[data-msg="${m.id}"] .msg-body`)
      if (!node) return
      node.innerHTML = m.content ? renderMarkdown(m.content) + '<span class="cursor" aria-hidden="true"></span>' : dotsHtml()
    }

    function renderTopBits () {
      const conv = currentConv()
      $('#top-title').textContent = conv ? conv.title : ''
      const chip = $('#status-chip')
      if (!navigator.onLine) {
        chip.className = 'badge badge-off'
        chip.innerHTML = '<span class="dot dot-off"></span><span>Mất kết nối</span>'
        chip.title = ''
        return
      }
      const ep = currentEndpoint()
      if (!ep) {
        chip.className = 'badge badge-idle'
        chip.innerHTML = '<span class="dot dot-idle"></span><span>Chưa cấu hình</span>'
        chip.title = 'Chưa có kết nối API nào'
        return
      }
      chip.className = 'badge badge-ready'
      chip.innerHTML = '<span class="dot dot-ok"></span><span>' + escapeHtml(ep.name) + '</span>'
      chip.title = API_FORMATS[ep.format].label + ' · ' + ep.baseUrl
    }

    const MAX_FILES = 4
    const MAX_SIZE = 5 * 1024 * 1024
    const RE_TYPE = /^image\/(png|jpe?g|webp|gif)$|^text\/(plain|markdown)$|^application\/(pdf|json)$/
    const RE_EXT = /\.(txt|md|markdown|pdf|json)$/i

    function addAttachment (file) {
      if (state.attachments.length >= MAX_FILES) { toast(STR.maxFiles, 'error'); return }
      if (!RE_TYPE.test(file.type || '') && !RE_EXT.test(file.name)) {
        toast(`“${file.name}”: ${STR.fileBadType}`, 'error')
        return
      }
      if (file.size > MAX_SIZE) {
        toast(`“${file.name}”: ${STR.fileTooBig}`, 'error')
        return
      }
      const isImg = (file.type || '').indexOf('image/') === 0
      const item = { id: uid(), name: file.name, size: file.size, type: file.type || 'application/octet-stream', url: null, dataUrl: null }
      if (isImg) {
        item.url = URL.createObjectURL(file)
        const reader = new FileReader()
        reader.onload = () => { item.dataUrl = String(reader.result) }
        reader.readAsDataURL(file)
      }
      state.attachments.push(item)
      renderComposer()
    }

    function removeAttachment (id) {
      const a = state.attachments.find(x => x.id === id)
      if (a && a.url && a.url.startsWith('blob:')) URL.revokeObjectURL(a.url)
      state.attachments = state.attachments.filter(x => x.id !== id)
      renderComposer()
    }

    function renderComposer () {
      const row = $('#attach-row')
      if (!state.attachments.length) {
        row.innerHTML = ''
        row.hidden = true
      } else {
        row.hidden = false
        row.innerHTML = state.attachments.map(a => `
          <span class="chip">
            ${a.url ? `<img src="${a.url}" alt="">` : ic('fileText', 'ic-sm')}
            <span class="chip-name" title="${escapeHtml(a.name)}">${escapeHtml(a.name)}</span>
            <span class="chip-size">${fmtBytes(a.size)}</span>
            <button type="button" class="chip-x" data-rm="${a.id}" aria-label="${STR.removeFile}: ${escapeHtml(a.name)}">${ic('x', 'ic-sm')}</button>
          </span>`).join('')
      }
      updateComposerButtons()
    }

    function updateComposerButtons () {
      const conv = currentConv()
      const hasMsgs = !!(conv && conv.messages.length)
      const hasInput = state.draft.trim().length > 0 || state.attachments.length > 0
      const send = $('#btn-send')
      const stop = $('#btn-stop')
      send.hidden = state.generating
      stop.hidden = !state.generating
      send.disabled = state.generating || (!hasMsgs && !hasInput)

      const ta = $('#prompt-input')
      ta.style.height = 'auto'
      ta.style.height = Math.min(ta.scrollHeight, 220) + 'px'
      ta.style.overflowY = ta.scrollHeight > 220 ? 'auto' : 'hidden'

      $('#char-count').textContent = state.draft.length ? String(state.draft.length) : ''
    }

        sel.disabled = true
        return

      sel.innerHTML = state.endpoints.map(e => `<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('')
      sel.value = state.endpointId || ''

    function renderModelSelect () {
      const sel = $('#model-select')
      const ep = currentEndpoint()
      if (!ep || !ep.models.length) {
        sel.innerHTML = '<option value="">Chưa có model</option>'
        sel.disabled = true
        return

      sel.disabled = false
      sel.innerHTML = ep.models.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('')

      state.endpointId = id
      const ep = currentEndpoint()
      state.modelId = ep && ep.models.length ? ep.models[0] : ''
      renderEndpointSelect()
      renderModelSelect()
      renderTopBits()
      saveNow()

    let epEditingId = null
    let epFormModels = []
    let epFormHeaders = []

      epModalOpen = true
      epLastFocus = document.activeElement
      $('#ep-root').classList.add('open')

    function epCardHtml (ep) {

    function renderEpList () {

    function saveEpForm () {
      const name = $('#ep-name').value.trim()
      const format = $('#ep-format').value
      const base = trimBase($('#ep-base').value)
      const key = $('#ep-key').value.trim()
      if (!name) { toast('Tên kết nối không được trống.', 'error'); return }
      if (!/^https?:\/\//i.test(base)) { toast('Endpoint phải bắt đầu bằng http(s)://', 'error'); return }
      const headers = epFormHeaders
        .filter(h => h.name.trim())
        .map(h => ({ name: h.name.trim(), value: h.value }))
      const id = epEditingId || uid()
      const existing = endpointById(id)
      const ep = {
        id,
        name,
        format,
        baseUrl: base,
        models: epFormModels.slice(),
        apiKey: key || (existing ? existing.apiKey : ''),
        headers
      }
      if (existing) state.endpoints = state.endpoints.map(e => (e.id === id ? ep : e))
      else state.endpoints.push(ep)
      if (!state.endpointId) setActiveEndpoint(id)
      else if (state.endpointId === id) renderModelSelect()
      renderEpList()
      renderEndpointSelect()
      renderTopBits()
      saveNow()
      toast(`Đã lưu kết nối “${name}”.`, 'success')
      hideEpForm()
    }

      if (!ep) return
