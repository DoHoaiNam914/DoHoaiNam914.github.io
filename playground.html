    const mobileLayoutMediaQuery =
      window.matchMedia('(max-width: 1279px)')

    function getEndpointById (endpointId) {
      return (
        state.endpoints.find(endpoint => {
          return endpoint.id === endpointId
        }) || null
      )
    }

    function getCurrentEndpoint () {
      return getEndpointById(state.endpointId)
    }

    function getCurrentConversation () {
      return (
        state.conversations.find(conversation => {
          return (
            conversation.id ===
            state.activeConversationId
          )
        }) || null
      )
    }

    function getConversationRuntime (
      conversationId,
      create = true
    ) {
      if (!conversationId) return null

      let runtime =
        conversationRuntimes.get(conversationId)

      if (!runtime && create) {
        runtime = {
          abortController: null,
          generating: false
        }

        conversationRuntimes.set(
          conversationId,
          runtime
        )
      }

      return runtime || null
    }

    function isConversationGenerating (
      conversationId
    ) {
      const runtime =
        getConversationRuntime(
          conversationId,
          false
        )

      return Boolean(
        runtime && runtime.generating
      )
    }

    function isCurrentConversationGenerating () {
      return isConversationGenerating(
        state.activeConversationId
      )
    }

    function stopConversationRuntime (
      conversationId
    ) {
      const runtime =
        getConversationRuntime(
          conversationId,
          false
        )

      if (
        runtime &&
        runtime.abortController
      ) {
        runtime.abortController.abort()
      }
    }

    function normalizeConfigurationSelection (
      configuration
    ) {
      const endpointExists =
        state.endpoints.some(endpoint => {
          return (
            endpoint.id === configuration.endpointId
          )
        })

      if (!endpointExists) {
        configuration.endpointId =
          state.endpoints[0]
            ? state.endpoints[0].id
            : null
      }

      const endpoint = getEndpointById(
        configuration.endpointId
      )

      if (
        !endpoint ||
        !endpoint.models.includes(
          configuration.modelId
        )
      ) {
        configuration.modelId =
          endpoint && endpoint.models[0]
            ? endpoint.models[0]
            : ''
      }

      return configuration
    }

    function activateConfiguration (configuration) {
      const activeConfiguration =
        normalizeConfigurationSelection(
          configuration ||
          state.workspaceConfiguration
        )

      state.activeConfiguration =
        activeConfiguration

      state.endpointId =
        activeConfiguration.endpointId

      state.modelId =
        activeConfiguration.modelId

      state.settings =
        activeConfiguration.settings

      if (
        !Array.isArray(
          state.settings.variableEntries
        )
      ) {
        state.settings.variableEntries =
          createVariableEntries(
            state.settings.variables
          )
      }

      variableEntries =
        state.settings.variableEntries
    }

    function syncActiveConfiguration () {
      const configuration =
        state.activeConfiguration ||
        state.workspaceConfiguration

      configuration.endpointId =
        state.endpointId

      configuration.modelId =
        state.modelId

      configuration.settings =
        state.settings
    }

    function initializeSelectedState () {
      const savedConversationId =
        savedState && savedState.activeId

      state.activeConversationId =
        state.conversations.some(
          conversation => {
            return (
              conversation.id ===
              savedConversationId
            )
          }
        )
          ? savedConversationId
          : state.conversations[0]
            ? state.conversations[0].id
            : null

      const conversation =
        getCurrentConversation()

      activateConfiguration(
        conversation
          ? conversation.configuration
          : state.workspaceConfiguration
      )
    }

    initializeSelectedState()

    function parseConfigurationInputs (
      configuration
    ) {
      const settings = configuration.settings

      const variables =
        buildVariablesFromEntries(
          settings.variableEntries
        )

      const tools =
        parseToolsJson(settings.toolsJson)

      settings.variables = variables

      return {
        tools,
        variables
      }
    }

    function parseRequestInputs () {
      return parseConfigurationInputs(
        state.activeConfiguration
      )
    }

    function buildRequestSettings (
      configuration
    ) {
      const activeConfiguration =
        configuration ||
        state.activeConfiguration

      const inputs =
        parseConfigurationInputs(
          activeConfiguration
        )

      return {
        ...activeConfiguration.settings,
        systemPrompt: interpolateVariables(
          activeConfiguration.settings.systemPrompt,
          inputs.variables
        ),
        tools: inputs.tools,
        variables: inputs.variables
      }
    }

    function createStoredState () {
      syncActiveConfiguration()

      return {
        activeId: state.activeConversationId,
        conversations:
          state.conversations.map(
            conversation => ({
              ...conversation,
              messages:
                conversation.messages.map(
                  message => {
                    const storedMessage = {
                      ...message
                    }

                    if (
                      storedMessage.status === 'streaming'
                    ) {
                      storedMessage.status = 'stopped'
                    }

                    if (storedMessage.attachments) {
                      storedMessage.attachments =
                        storedMessage.attachments
                          .map(attachment => ({
                            id: attachment.id,
                            name: attachment.name,
                            size: attachment.size,
                            type: attachment.type
                          }))
                    }

                    return storedMessage
                  }
                )
            })
          ),
        endpoints: state.endpoints,
        ui: state.ui,
        workspaceConfiguration:
          state.workspaceConfiguration
      }
    }

    function saveStateNow () {
      try {
        const storedState = createStoredState()

        window.localStorage.setItem(
          STORAGE_KEYS.activeConversationId,
          JSON.stringify(storedState.activeId)
        )

        window.localStorage.setItem(
          STORAGE_KEYS.conversations,
          JSON.stringify(storedState.conversations)
        )

        window.localStorage.setItem(
          STORAGE_KEYS.endpoints,
          JSON.stringify(storedState.endpoints)
        )

        window.localStorage.setItem(
          STORAGE_KEYS.ui,
          JSON.stringify(storedState.ui)
        )

        window.localStorage.setItem(
          STORAGE_KEYS.workspaceConfiguration,
          JSON.stringify(
            storedState.workspaceConfiguration
          )
        )
      } catch {}
    }

    const scheduleStorageSave =
      debounce(saveStateNow, 650)

    const schedulePreviewRefresh =
      debounce(refreshRequestBodyPreview, 180)

    function scheduleStateSave () {
      syncActiveConfiguration()
      schedulePreviewRefresh()
      scheduleStorageSave()
    }

    function prepareConfigurationSwitch () {
      if (scheduleVariableValidation) {
        scheduleVariableValidation.cancel()
      }

      try {
        state.settings.variables =
          buildVariablesFromEntries(
            variableEntries
          )
      } catch {
        state.settings.variables =
          state.settings.variables || {}
      }

      syncActiveConfiguration()
    }

    function renderAccentPicker () {
      state.ui.accent =
        applyAccentColor(state.ui.accent)

      const input =
        selectElement('#accent-color-input')

      const output =
        selectElement('#accent-color-value')

      if (input) input.value = state.ui.accent
      if (output) output.textContent = state.ui.accent
    }

    function setAccent (accent) {
      const nextAccent =
        normalizeHexColor(accent)

      if (state.ui.accent === nextAccent) {
        renderAccentPicker()
        return
      }

      state.ui.accent = nextAccent
      renderAccentPicker()
      scheduleStateSave()
    }

    function getMarkdownEngine () {
      if (!window.commonmark) return null

      if (!markdownReader || !markdownWriter) {
        markdownReader =
          new window.commonmark.Parser()

        markdownWriter =
          new window.commonmark.HtmlRenderer({
            safe: true,
            softbreak: '<br>\n'
          })
      }

      return {
        reader: markdownReader,
        writer: markdownWriter
      }
    }

    function decorateMarkdown (html) {
      const template =
        document.createElement('template')

      template.innerHTML = html

      template.content
        .querySelectorAll('a')
        .forEach(link => {
          link.target = '_blank'
          link.rel = 'noopener noreferrer'
        })

      template.content
        .querySelectorAll('pre > code')
        .forEach(code => {
          const preformatted =
            code.parentElement

          if (!preformatted) return

          const languageClass =
            Array.from(code.classList).find(
              className => {
                return className.startsWith(
                  'language-'
                )
              }
            )

          const wrapper =
            document.createElement('div')

          const header =
            document.createElement('div')

          const label =
            document.createElement('span')

          const button =
            document.createElement('button')

          wrapper.className = 'code-block'
          header.className = 'code-header'
          label.className = 'code-language'

          label.textContent = languageClass
            ? languageClass.slice(9)
            : 'code'

          button.type = 'button'
          button.className = 'code-copy-button'

          button.setAttribute(
            'data-copy-text',
            encodeTextBase64(
              code.textContent || ''
            )
          )

          button.setAttribute(
            'aria-label',
            'Sao chép mã'
          )

          button.innerHTML =
            createIconSvg(
              'copy',
              'icon-small'
            ) +
            '<span>Sao chép</span>'

          preformatted.replaceWith(wrapper)
          header.append(label, button)
          wrapper.append(header, preformatted)
        })

      template.content
        .querySelectorAll('table')
        .forEach(table => {
          if (
            table.parentElement &&
            table.parentElement.classList
              .contains('table-scroll')
          ) {
            return
          }

          const wrapper =
            document.createElement('div')

          wrapper.className = 'table-scroll'
          table.replaceWith(wrapper)
          wrapper.appendChild(table)
        })

      return template.innerHTML
    }

    function renderMarkdown (source) {
      const value = String(source || '')
      const engine = getMarkdownEngine()

      if (!engine) {
        return value
          ? '<p>' +
              escapeHtml(value).replace(
                /\n/g,
                '<br>'
              ) +
              '</p>'
          : ''
      }

      return decorateMarkdown(
        engine.writer.render(
          engine.reader.parse(value)
        )
      )
    }

    function showToast (
      message,
      type = 'info',
      duration = 3400
    ) {
      const region =
        selectElement('#toast-region')

      while (region.children.length >= 4) {
        region.firstChild.remove()
      }

      const toast =
        document.createElement('div')

      toast.className = 'toast toast-' + type

      toast.innerHTML =
        createIconSvg(
          type === 'success'
            ? 'check'
            : type === 'error'
              ? 'alert'
              : 'info'
        ) +
        '<span>' +
        escapeHtml(message) +
        '</span>'

      region.appendChild(toast)

      window.setTimeout(() => {
        toast.classList.add('leaving')

        window.setTimeout(() => {
          toast.remove()
        }, 220)
      }, duration)
    }

    function trapTabKey (event, container) {
      const items = Array.from(
        container.querySelectorAll(
          'button, input, textarea, select, a[href], [tabindex]:not([tabindex="-1"])'
        )
      ).filter(element => {
        return (
          !element.disabled &&
          element.offsetParent !== null
        )
      })

      if (!items.length) return

      const first = items[0]
      const last = items[items.length - 1]

      if (
        event.shiftKey &&
        document.activeElement === first
      ) {
        event.preventDefault()
        last.focus()
      } else if (
        !event.shiftKey &&
        document.activeElement === last
      ) {
        event.preventDefault()
        first.focus()
      }
    }

    function openModal (options) {
      return new Promise(resolve => {
        const root = selectElement('#modal-root')
        const previousFocus =
          document.activeElement

        root.innerHTML = `
          <div class="modal-backdrop" data-close-modal></div>
          <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h3 id="modal-title">${escapeHtml(options.title)}</h3>
            ${options.body ? `<div class="modal-body">${escapeHtml(options.body)}</div>` : ''}
            ${options.input != null ? `<label class="screen-reader-only" for="modal-input">${escapeHtml(options.title)}</label><input type="text" class="text-field" id="modal-input" value="${escapeHtml(options.input)}">` : ''}
            <div class="modal-actions">
              <button type="button" class="button" data-close-modal>${TEXT.cancel}</button>
              <button type="button" class="button ${options.danger ? 'button-danger' : 'button-accent'}" data-confirm-modal>${escapeHtml(options.confirmText || 'OK')}</button>
            </div>
          </div>`

        modalState = {
          previousFocus,
          resolve
        }

        root.classList.add('open')

        const modal = root.querySelector('.modal')

        modal.addEventListener('keydown', event => {
          if (event.key === 'Tab') {
            trapTabKey(event, modal)
          }

          if (
            event.key === 'Enter' &&
            event.target.id === 'modal-input'
          ) {
            closeModal(event.target.value)
          }
        })

        root.onclick = event => {
          if (
            event.target.closest(
              '[data-confirm-modal]'
            )
          ) {
            const input =
              selectElement('#modal-input')

            closeModal(input ? input.value : true)
          } else if (
            event.target.closest('[data-close-modal]')
          ) {
            closeModal(null)
          }
        }

        const input = selectElement('#modal-input')

        if (input) {
          input.focus()
          input.select()
        } else {
          root
            .querySelector('[data-confirm-modal]')
            .focus()
        }
      })
    }

    function closeModal (value) {
      if (!modalState) return

      const currentState = modalState
      const root = selectElement('#modal-root')

      modalState = null
      root.classList.remove('open')
      root.innerHTML = ''
      root.onclick = null

      if (
        currentState.previousFocus &&
        currentState.previousFocus.focus
      ) {
        currentState.previousFocus.focus()
      }

      currentState.resolve(value)
    }

    function createConversation (activate = true) {
      prepareConfigurationSwitch()

      const conversation = {
        configuration:
          cloneConfiguration(
            state.activeConfiguration ||
            state.workspaceConfiguration
          ),
        createdAt: Date.now(),
        id: createUniqueId(),
        messages: [],
        pinned: false,
        renamed: false,
        title: TEXT.newConversationTitle,
        updatedAt: Date.now()
      }

      state.conversations.unshift(conversation)
      getConversationRuntime(conversation.id)

      if (activate) {
        state.activeConversationId =
          conversation.id

        activateConfiguration(
          conversation.configuration
        )
      }

      renderSidebar()
      scheduleStateSave()
      return conversation
    }

    function cloneMessageForDuplicate (message) {
      const cloned = cloneValue(message)
      const messageId = createUniqueId()

      cloned.id = messageId
      cloned.createdAt = Date.now()

      if (cloned.status === 'streaming') {
        cloned.status = 'stopped'
      }

      if (Array.isArray(cloned.attachments)) {
        cloned.attachments =
          cloned.attachments.map(
            attachment => ({
              ...attachment,
              id: createUniqueId()
            })
          )
      }

      if (Array.isArray(cloned.outputBlocks)) {
        cloned.outputBlocks =
          cloned.outputBlocks.map(
            (block, index) => ({
              ...block,
              id:
                messageId +
                ':block:' +
                index
            })
          )
      }

      return sanitizeMessage(cloned)
    }

    function duplicateConversation (conversation) {
      if (
        isConversationGenerating(conversation.id)
      ) {
        showToast(TEXT.generationBusy, 'error')
        return
      }

      prepareConfigurationSwitch()

      const now = Date.now()

      const duplicate = {
        configuration:
          cloneConfiguration(
            conversation.configuration
          ),
        createdAt: now,
        id: createUniqueId(),
        messages:
          conversation.messages
            .map(cloneMessageForDuplicate)
            .filter(Boolean),
        pinned: false,
        renamed: true,
        title:
          conversation.title + ' (bản sao)',
        updatedAt: now
      }

      state.conversations.unshift(duplicate)
      state.activeConversationId = duplicate.id
      getConversationRuntime(duplicate.id)

      activateConfiguration(
        duplicate.configuration
      )

      renderEndpointSelect()
      renderModelSelect()
      renderSettingsPanel()
      renderSidebar()
      renderMessages()
      renderTopBar()
      scheduleStateSave()
      closeDrawers()
      scrollToBottom(true)

      showToast(
        TEXT.duplicatedConversation,
        'success'
      )
    }

    function createConversationItemHtml (
      conversation
    ) {
      const active =
        conversation.id ===
        state.activeConversationId

      const generating =
        isConversationGenerating(
          conversation.id
        )

      const runtimeStatus = generating
        ? ' · <span class="conversation-runtime-status">đang tạo</span>'
        : ''

      return `
        <div class="conversation-item ${active ? 'active' : ''}" data-conversation-id="${conversation.id}">
          <button type="button" class="conversation-select-button" data-select-conversation="${conversation.id}"${active ? ' aria-current="page"' : ''}>
            <span class="conversation-title" title="${escapeHtml(conversation.title)}">${escapeHtml(conversation.title)}</span>
            <span class="conversation-meta">${formatRelativeTime(conversation.updatedAt)} · ${conversation.messages.length} tin nhắn${runtimeStatus}</span>
          </button>
          <div class="conversation-actions">
            <button type="button" class="conversation-action-button" data-conversation-action="pin" aria-pressed="${conversation.pinned}" aria-label="${conversation.pinned ? 'Bỏ ghim' : 'Ghim'} cuộc trò chuyện">${createIconSvg('pin', 'icon-small')}</button>
            <button type="button" class="conversation-action-button" data-conversation-action="duplicate" aria-label="Nhân bản cuộc trò chuyện">${createIconSvg('copy', 'icon-small')}</button>
            <button type="button" class="conversation-action-button" data-conversation-action="rename" aria-label="Đổi tên cuộc trò chuyện">${createIconSvg('pencil', 'icon-small')}</button>
            <button type="button" class="conversation-action-button" data-conversation-action="delete" aria-label="Xoá cuộc trò chuyện">${createIconSvg('trash', 'icon-small')}</button>
          </div>
        </div>`
    }

    function renderSidebar () {
      const list =
        selectElement('#conversation-list')

      const query =
        state.conversationSearchQuery
          .trim()
          .toLowerCase()

      const conversations =
        state.conversations
          .filter(conversation => {
            return (
              !query ||
              conversation.title
                .toLowerCase()
                .includes(query) ||
              conversation.messages.some(message => {
                return (message.content || '')
                  .toLowerCase()
                  .includes(query)
              })
            )
          })
          .sort((first, second) => {
            if (first.pinned !== second.pinned) {
              return first.pinned ? -1 : 1
            }

            return second.updatedAt - first.updatedAt
          })

      selectElement(
        '#clear-conversation-search-button'
      ).hidden = !state.conversationSearchQuery

      if (!state.conversations.length) {
        list.innerHTML =
          `<div class="sidebar-empty">${createIconSvg('message')}<span>Chưa có cuộc trò chuyện nào.</span></div>`
        return
      }

      if (!conversations.length) {
        list.innerHTML =
          `<div class="sidebar-empty">${createIconSvg('search')}<span>Không tìm thấy cuộc trò chuyện phù hợp.</span></div>`
        return
      }

      const pinned = conversations.filter(
        conversation => conversation.pinned
      )

      const recent = conversations.filter(
        conversation => !conversation.pinned
      )

      let html = ''

      if (pinned.length) {
        html +=
          '<div class="conversation-group-label">Đã ghim</div>' +
          pinned
            .map(createConversationItemHtml)
            .join('')
      }

      if (recent.length) {
        html +=
          '<div class="conversation-group-label">Gần đây</div>' +
          recent
            .map(createConversationItemHtml)
            .join('')
      }

      list.innerHTML = html
    }

    function selectConversation (conversationId) {
      const conversation =
        state.conversations.find(item => {
          return item.id === conversationId
        })

      if (!conversation) return

      prepareConfigurationSwitch()

      state.activeConversationId = conversationId
      state.editingMessageId = null
      state.newMessageId = null

      activateConfiguration(
        conversation.configuration
      )

      renderEndpointSelect()
      renderModelSelect()
      renderSettingsPanel()
      renderSidebar()
      renderMessages()
      renderTopBar()
      scheduleStateSave()
      closeDrawers()
      scrollToBottom(true)
    }

    async function handleConversationAction (
      action,
      conversationId
    ) {
      const conversation =
        state.conversations.find(item => {
          return item.id === conversationId
        })

      if (!conversation) return

      if (action === 'duplicate') {
        duplicateConversation(conversation)
        return
      }

      if (action === 'pin') {
        conversation.pinned = !conversation.pinned
        renderSidebar()
        scheduleStateSave()
        return
      }

      if (action === 'rename') {
        const value = await openModal({
          confirmText: TEXT.save,
          input: conversation.title,
          title: 'Đổi tên cuộc trò chuyện'
        })

        if (value == null) return

        const title = value.trim()

        conversation.title =
          title ||
          getAutomaticConversationTitle(
            conversation
          )

        conversation.renamed = Boolean(title)

        renderSidebar()
        renderTopBar()
        scheduleStateSave()
        return
      }

      if (action === 'delete') {
        const generating =
          isConversationGenerating(
            conversationId
          )

        const confirmed = await openModal({
          body:
            generating
              ? 'Yêu cầu đang chạy sẽ bị dừng và cuộc trò chuyện sẽ bị xoá vĩnh viễn khỏi thiết bị.'
              : 'Cuộc trò chuyện sẽ bị xoá vĩnh viễn khỏi thiết bị.',
          confirmText: TEXT.delete,
          danger: true,
          title: 'Xoá cuộc trò chuyện?'
        })

        if (confirmed !== true) return

        const deletingActive =
          state.activeConversationId ===
          conversationId

        if (deletingActive) {
          prepareConfigurationSwitch()
        }

        stopConversationRuntime(conversationId)
        conversationRuntimes.delete(conversationId)

        state.conversations =
          state.conversations.filter(item => {
            return item.id !== conversationId
          })

        if (deletingActive) {
          state.activeConversationId =
            state.conversations[0]
              ? state.conversations[0].id
              : null

          const nextConversation =
            getCurrentConversation()

          activateConfiguration(
            nextConversation
              ? nextConversation.configuration
              : state.workspaceConfiguration
          )
        }

        renderEndpointSelect()
        renderModelSelect()
        renderSettingsPanel()
        renderSidebar()
        renderMessages()
        renderTopBar()
        scheduleStateSave()
      }
    }

    function createLoadingDotsHtml () {
      return '<span class="generation-dots" aria-hidden="true"><span></span><span></span><span></span></span>'
    }

    function getToolStatusClass (status) {
      if (status === 'completed') return 'completed'
      if (status === 'failed') return 'failed'

      if (ACTIVE_TOOL_STATUSES.includes(status)) {
        return 'active'
      }

      return ''
    }

    function createToolActivityHtml (tool) {
      const stateClass =
        getToolStatusClass(tool.status)

      const stateLabel =
        TOOL_STATUS_LABELS[tool.status] ||
        TOOL_STATUS_LABELS.running

      const input = tool.input
        ? `<pre class="tool-activity-payload">${escapeHtml(tool.input)}</pre>`
        : ''

      const output = tool.output
        ? `<pre class="tool-activity-payload tool-activity-output">${escapeHtml(tool.output)}</pre>`
        : ''

      return `
        <div class="trace-item tool-activity">
          <div class="tool-activity-header">
            ${createIconSvg('terminal', 'icon-small')}
            <span class="tool-activity-name" title="${escapeHtml(tool.name)}">${escapeHtml(tool.name)}</span>
            <span class="tool-activity-state ${stateClass}">

            </span>

    function createReasoningGroupHtml (
      blocks,
      message
    ) {
      const hasTool = blocks.some(
        block => block.type === 'tool'
      )

      const items = blocks.map(block => {
        if (block.type === 'reasoning') {
          return `<div class="trace-item markdown">${renderMarkdown(block.content)}</div>`
        }

        if (block.type === 'redacted') {
          return `
            <div class="trace-item reasoning-redacted">
              ${createIconSvg('info', 'icon-small')}
              <span>Một phần suy luận đã được API ẩn.</span>
            </div>`
        }

        if (block.type === 'tool') {
          return createToolActivityHtml(block)
        }

        return ''
      }).join('')

      const label = hasTool
        ? 'Suy luận và sử dụng công cụ'
        : 'Suy luận'

      return `
        <details class="reasoning-panel"${getMessageStatus(message) === 'streaming' ? ' open' : ''}>
          <summary>
            ${createIconSvg('spark', 'icon-small')}
            <span>${label}</span>
          </summary>
          <div class="reasoning-trace">${items}</div>
        </details>`
    }

    function createAssistantOutputHtml (
      message,
      allowEmpty
    ) {
      const blocks =
        getMessageOutputBlocks(message)

      const visibleBlocks =
        blocks.filter(block => {
          if (block.type === 'text') return true
          return message.showReasoning !== false
        })

      const status = getMessageStatus(message)

      if (!visibleBlocks.length) {
        if (status === 'streaming') {
          return createLoadingDotsHtml()
        }

        return allowEmpty
          ? ''
          : '<div class="assistant-answer markdown"><p>…</p></div>'
      }

      const lastVisibleBlock =
        visibleBlocks[visibleBlocks.length - 1]

      let html = ''
      let traceBlocks = []

      const flushTraceBlocks = () => {
        if (!traceBlocks.length) return

        html += createReasoningGroupHtml(
          traceBlocks,
          message
        )

        traceBlocks = []
      }

      visibleBlocks.forEach(block => {
        if (
          block.type === 'reasoning' ||
          block.type === 'redacted' ||
          block.type === 'tool'
        ) {
          traceBlocks.push(block)
          return
        }

        flushTraceBlocks()

        const cursor =
          status === 'streaming' &&
          block === lastVisibleBlock
            ? '<span class="stream-cursor" aria-hidden="true"></span>'
            : ''

        html +=
          `<div class="assistant-answer markdown">${renderMarkdown(block.content)}${cursor}</div>`
      })

      flushTraceBlocks()
      return html
    }

    function createMessageAttachmentsHtml (
      attachments,
      messageId
    ) {
      if (!attachments || !attachments.length) {
        return ''
      }

      return `<div class="message-attachments">${
        attachments.map(attachment => {
          const removeButton =
            `<button type="button" class="attachment-remove-button" data-message-id="${escapeHtml(messageId)}" data-message-attachment-id="${escapeHtml(attachment.id)}" aria-label="Gỡ tệp ${escapeHtml(attachment.name)}">${createIconSvg('x', 'icon-small')}</button>`

          if (
            attachment.url &&
            isImageAttachment(attachment)
          ) {
            return `<figure class="attachment image-attachment">${removeButton}<img src="${attachment.url}" alt="${escapeHtml(attachment.name)}"><figcaption>${escapeHtml(attachment.name)}</figcaption></figure>`
          }

          return `<div class="attachment file-attachment">${createIconSvg('file-text', 'icon-small')}<span class="attachment-name">${escapeHtml(attachment.name)}</span><span class="attachment-size">${formatBytes(attachment.size)}</span>${removeButton}</div>`
        }).join('')
      }</div>`
    }

    function createAssistantBodyHtml (message) {
      const status = getMessageStatus(message)

      const output =
        createAssistantOutputHtml(
          message,
          status === 'error'
        )

      if (status === 'error') {
        return output + `
          <div class="error-card">
            ${createIconSvg('alert')}
            <p>${escapeHtml(message.error ? message.error.message : 'API trả về lỗi.')}</p>
            <span class="error-type">${escapeHtml(message.error ? message.error.kind : 'api')}</span>

          </div>`

      if (status === 'stopped') {
        return (
          output +
          `<div class="stopped-note">${createIconSvg('stop', 'icon-small')}${TEXT.stoppedNote}</div>`

      return output

    function createMessageActionsHtml (
      message,
      index,
      total
    ) {
      if (
        getMessageStatus(message) === 'streaming' ||
        state.editingMessageId === message.id ||
        isCurrentConversationGenerating()
      ) {
        return ''
      }

      let buttons = `
        <button type="button" class="message-action-button icon-only" data-action="move-message-up" data-message-id="${message.id}" aria-label="Di chuyển tin nhắn lên" title="Di chuyển lên"${index === 0 ? ' disabled' : ''}>

        </button>
        <button type="button" class="message-action-button icon-only" data-action="move-message-down" data-message-id="${message.id}" aria-label="Di chuyển tin nhắn xuống" title="Di chuyển xuống"${index === total - 1 ? ' disabled' : ''}>
          ${createIconSvg('arrow-down', 'icon-small')}
        </button>
        <button type="button" class="message-action-button" data-action="copy-message" data-message-id="${message.id}">
          ${createIconSvg('copy', 'icon-small')}
          <span>Sao chép</span>
        </button>
        <button type="button" class="message-action-button" data-action="edit-message" data-message-id="${message.id}">
          ${createIconSvg('pencil', 'icon-small')}

        </button>`

      if (
        isAssistantRole(message.role) &&
        getMessageStatus(message) !== 'error'
      ) {
        buttons += `
          <button type="button" class="message-action-button" data-action="regenerate-response" data-message-id="${message.id}">
            ${createIconSvg('rotate', 'icon-small')}
            <span>Tạo lại</span>
          </button>`
      }

      buttons += `
        <button type="button" class="message-action-button" data-action="delete-message" data-message-id="${message.id}">
          ${createIconSvg('trash', 'icon-small')}
          <span>Xoá</span>
        </button>`

      return `<div class="message-actions">${buttons}</div>`
    }

    function createMessageEditorHtml (message) {
      return `
        <div class="message-editor">
          <label class="screen-reader-only" for="message-editor-input">Nội dung tin nhắn</label>
          <textarea id="message-editor-input">${escapeHtml(message.content)}</textarea>
          <div class="editor-actions">
            <button type="button" class="button button-small button-accent" data-action="save-message-edit" data-message-id="${message.id}">${createIconSvg('check', 'icon-small')}Lưu</button>
            <button type="button" class="button button-small" data-action="cancel-message-edit">Huỷ</button>
          </div>
        </div>`
    }

    function createMessageElement (
      message,
      index,
      total
    ) {
      const element =
        document.createElement('article')

      const assistant =
        isAssistantRole(message.role)

      const instruction =
        isInstructionRole(message.role)

      const status =
        getMessageStatus(message)

      element.className =
        'message message-' + message.role

      element.dataset.role = message.role
      element.dataset.status = status

      element.setAttribute(
        'data-message-id',
        message.id
      )

      const avatarIcon =
        message.role === 'user'
          ? 'user'
          : assistant
            ? 'spark'
            : 'terminal'

      const avatarClass =
        message.role === 'user'
          ? 'avatar-user'
          : assistant
            ? 'avatar-assistant'
            : message.role === 'system'
              ? 'avatar-system'
              : 'avatar-developer'

      const roleOptions =
        MESSAGE_ROLES.map(role => {
          return `<option value="${role}"${message.role === role ? ' selected' : ''}>${role}</option>`
        }).join('')

      const editing =
        state.editingMessageId === message.id

      const attachments =
        createMessageAttachmentsHtml(
          message.attachments,
          message.id
        )

      let body

      if (editing) {
        body = createMessageEditorHtml(message)
      } else if (assistant) {
        body =
          `<div class="message-output">${createAssistantBodyHtml(message)}</div>${attachments}`
      } else if (instruction) {
        body =
          `<div class="instruction-message-content markdown">${renderMarkdown(message.content)}</div>${attachments}`
      } else {
        body =
          `<div class="user-message-content markdown">${renderMarkdown(message.content)}</div>${attachments}`
      }

      element.innerHTML = `
        <div class="message-avatar ${avatarClass}">${createIconSvg(avatarIcon)}</div>
        <div class="message-main">
          <div class="message-header">
            <select class="message-role-select" data-role="${message.role}" data-message-role="${message.id}" aria-label="Vai trò của tin nhắn"${editing ? '' : ' disabled'}>${roleOptions}</select>
            ${assistant && message.modelLabel ? `<span class="message-model" title="${escapeHtml(message.endpointName || '')}">${escapeHtml(message.modelLabel)}</span>` : ''}
            <span class="message-time">${formatRelativeTime(message.createdAt)}</span>
          </div>
          <div class="message-body">${body}</div>
          ${createMessageActionsHtml(message, index, total)}
        </div>`

      return element
    }

    function renderMessages () {
      const list = selectElement('#message-list')
      const conversation = getCurrentConversation()

      list.innerHTML = ''

      if (
        !conversation ||
        !conversation.messages.length

        list.classList.add('empty')
        list.innerHTML = createWelcomeHtml()
        list.setAttribute('aria-busy', 'false')
        updateComposerButtons()
        return
      }

      list.classList.remove('empty')

      const fragment =
        document.createDocumentFragment()

      const total = conversation.messages.length

      conversation.messages.forEach(
        (message, index) => {
          fragment.appendChild(
            createMessageElement(
              message,
              index,
              total
            )
          )
        }
      )

      list.appendChild(fragment)

      list.setAttribute(
        'aria-busy',

          isConversationGenerating(

          selectElement('#message-editor-input')

        if (textarea) {

            textarea.value.length

      updateComposerButtons()

    async function addAttachment (file) {
      if (
        state.attachments.length +
        state.pendingAttachmentReads >=
        MAXIMUM_FILES
      ) {
        showToast(
          'Chỉ được đính kèm tối đa 4 tệp.',
          'error'
        )
        return
      }

      const type = normalizeFileType(file)

      if (!isSupportedAttachmentType(type)) {
        showToast(
          `“${file.name}” có định dạng không được hỗ trợ.`,
          'error'
        )
        return
      }

      if (file.size > MAXIMUM_FILE_SIZE) {
        showToast(
          `“${file.name}” vượt quá 5 MB.`,
          'error'
        )
        return
      }

      state.pendingAttachmentReads += 1
      renderAttachmentList()

      try {
        const buffer = await file.arrayBuffer()
        const base64 = arrayBufferToBase64(buffer)

        const dataUrl =
          isImageAttachment({ type })
            ? `data:${type};base64,${base64}`
            : null

        state.attachments.push({
          base64,
          dataUrl,
          id: createUniqueId(),
          name: file.name,
          size: file.size,
          text:
            isTextMimeType(type)
              ? UTF8_DECODER.decode(buffer)
              : null,
          type,
          url: dataUrl
        })
      } catch {
        showToast(
          `Không thể đọc tệp “${file.name}”.`,
          'error'
        )
      } finally {
        state.pendingAttachmentReads =
          Math.max(
            0,
            state.pendingAttachmentReads - 1
          )

        renderAttachmentList()
      }
    }

    function removeAttachment (attachmentId) {
      state.attachments =
        state.attachments.filter(attachment => {

        })

      renderAttachmentList()
    }

    function removeMessageAttachment (
      messageId,
      attachmentId
    ) {
      const conversation =
        getCurrentConversation()

      if (
        conversation &&
        isConversationGenerating(conversation.id)
      ) {
        showToast(TEXT.generationBusy, 'error')
        return
      }

      if (!conversation) return

      const message =
        conversation.messages.find(item => {
          return item.id === messageId
        })

      if (!message || !message.attachments) return

      message.attachments =
        message.attachments.filter(attachment => {
          return attachment.id !== attachmentId
        })

      conversation.updatedAt = Date.now()
      renderMessages()
      scheduleStateSave()
    }

    function updateEndpointApiKeyControls () {

    function addEndpointModel () {
      const input =
        selectElement('#endpoint-model-input')

      const model = input.value.trim()

      if (!model) return

      if (endpointFormModels.includes(model)) {
        showToast(
          'Mô hình đã có trong danh sách.',
          'error'
        )
        return
      }

      endpointFormModels.push(model)
      input.value = ''
      renderEndpointModels()
      input.focus()
    }

    function saveEndpointForm () {
      const name =
        selectElement('#endpoint-name')
          .value
          .trim()

      const format =
        selectElement('#endpoint-format').value

      const baseUrl = normalizeBaseUrl(
        selectElement('#endpoint-base-url').value
      )

      const apiKey =
        selectElement('#endpoint-api-key')
          .value
          .trim()

      if (!name) {
        showToast(
          'Tên endpoint không được để trống.',
          'error'
        )
        return
      }

      if (!/^https:\/\//i.test(baseUrl)) {
        showToast(
          'URL API phải bắt đầu bằng https://.',
          'error'
        )
        return
      }

      const endpointId =
        editingEndpointId || createUniqueId()

      const existing =
        getEndpointById(endpointId)

      const endpoint = {
        apiKey:
          endpointFormApiKeyCleared
            ? ''
            : apiKey ||
              (existing ? existing.apiKey : ''),
        baseUrl,
        format,
        headers:
          endpointFormHeaders
            .filter(header => header.name.trim())
            .map(header => ({
              name: header.name.trim(),
              value: header.value
            })),
        id: endpointId,
        models: endpointFormModels.slice(),
        name
      }

      if (existing) {
        state.endpoints =
          state.endpoints.map(item => {
            return item.id === endpointId
              ? endpoint
              : item
          })
      } else {
        state.endpoints.push(endpoint)
      }

      if (!state.endpointId) {
        state.endpointId = endpointId
        state.modelId = endpoint.models[0] || ''
      }

      if (state.endpointId === endpointId) {
        state.modelId =
          endpoint.models.includes(state.modelId)
            ? state.modelId
            : endpoint.models[0] || ''
      }

      syncActiveConfiguration()
      renderEndpointList()
      renderEndpointSelect()
      renderModelSelect()
      renderSamplingControls()
      renderMessages()
      renderTopBar()
      scheduleStateSave()
      hideEndpointForm()

      showToast(
        `Đã lưu endpoint “${name}”.`,
        'success'
      )
    }

    async function deleteEndpoint (endpointId) {
      const endpoint = getEndpointById(endpointId)

      if (!endpoint) return

      const confirmed = await openModal({
        body:
          `Endpoint “${endpoint.name}” sẽ bị xoá. Các cuộc trò chuyện cũ vẫn được giữ lại.`,
        confirmText: TEXT.delete,
        danger: true,
        title: 'Xoá endpoint?'
      })

      if (confirmed !== true) return

      state.endpoints =
        state.endpoints.filter(item => {
          return item.id !== endpointId
        })

      if (state.endpointId === endpointId) {
        state.endpointId =
          state.endpoints[0]
            ? state.endpoints[0].id
            : null

        const nextEndpoint =
          getCurrentEndpoint()

        state.modelId =
          nextEndpoint && nextEndpoint.models[0]
            ? nextEndpoint.models[0]
            : ''
      }

      syncActiveConfiguration()
      renderEndpointList()
      renderEndpointSelect()
      renderModelSelect()
      renderSamplingControls()
      renderMessages()
      renderTopBar()
      scheduleStateSave()
    }

    function createVariableRowHtml (entry, index) {

    function buildCanonicalMessages (
      conversation,
      stopBeforeMessage,
      variables
    ) {
      const output = []

      for (const message of conversation.messages) {
        if (
          stopBeforeMessage &&
          message.id === stopBeforeMessage.id
        ) {
          break
        }

        const content =
          getRequestMessageContent(
            message,
            variables
          )

        if (
          !content &&
          !(message.attachments || []).length
        ) {
          continue
        }

        output.push({
          attachments:
            (message.attachments || [])
              .map(sanitizeAttachment)
              .filter(Boolean),
          content,
          role: message.role
        })
      }

      return output
    }

    function validateAttachmentData (messages) {
      messages.forEach(message => {
        const attachments =
          message.attachments || []

        attachments.forEach(attachment => {
          if (
            typeof attachment.base64 !== 'string'

            throw createApiError(
              'attachment',
              `Không thể gửi lại tệp “${attachment.name}” vì dữ liệu không còn khả dụng.`
            )
          }
        })
      })
    }
