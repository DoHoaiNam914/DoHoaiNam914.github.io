    function bindParamPair (rangeId, numId, key) {
      const range = $('#' + rangeId)
      const num = $('#' + numId)
      range.addEventListener('input', () => {
        const v = Number(range.value)
        num.value = String(v)
        state.settings[key] = v
        saveNow()
      })
      num.addEventListener('input', () => {
        const v = Number(num.value)
        if (!Number.isFinite(v)) return
        const c = clamp(v, Number(range.min), Number(range.max))
        state.settings[key] = c
        range.value = String(c)
        saveNow()
      })
      num.addEventListener('change', () => {
        num.value = String(state.settings[key])
      })
    }

    function buildCanonical (conv, until) {
      const out = []
      for (const m of conv.messages) {
        if (until && m.id === until.id) break
        if (isSystemRole(m.role)) {
          if (m.content) out.push({ role: m.role, content: m.content })
        } else if (m.role === 'user') {
          const images = (m.attachments || [])
            .filter(a => a.dataUrl)
            .map(a => parseDataUri(a.dataUrl))
            .filter(Boolean)
          out.push({ role: 'user', content: m.content, images })
        } else if (m.role === 'tool') {
          if (m.content) out.push({ role: 'tool', content: m.content })
        } else if (isAssistantRole(m.role) && m.content) {
          out.push({ role: m.role, content: m.content })
        }
      }
      return out
    }

    function handleSseEvent (fmt, evt, msg) {
      if (!evt.raw) return
      let data = null
      try { data = JSON.parse(evt.raw) } catch (err) { return }
      const r = fmt.parseEvent({ event: evt.event, data, raw: evt.raw })
      if (r.error) throw apiError('api', r.error)
      if (r.delta) {
        msg.content += r.delta
        updateStreamingDom(msg)
        scrollBottom(false)
      }
      if (r.final && !msg.content) {
        msg.content = r.final
        updateStreamingDom(msg)
      }
    }

    async function startGeneration (conv, msg) {
      state.generating = true
      state.aborter = new AbortController()
      updateComposerButtons()
      $('#message-list').setAttribute('aria-busy', 'true')
      announce(STR.annGenerating)
      const ep = endpointById(msg.endpointId || state.endpointId)
      try {
        if (!ep) throw apiError('config', STR.needEndpoint)
        if (!msg.model) throw apiError('config', STR.needModel)
        const key = ep.apiKey || ''
        if (!key) throw apiError('config', `Kết nối “${ep.name}” chưa có khoá API. Mở “Kết nối” để nhập.`)
        const fmt = API_FORMATS[ep.format]
        const stream = state.settings.streaming
        const built = fmt.build({
          base: ep.baseUrl,
          model: msg.model,
          messages: buildCanonical(conv, msg),
          settings: state.settings,
          stream,
          apiKey: key
        })
        const headers = Object.assign({}, built.headers)
        ep.headers.forEach(h => {
          if (h.name) headers[h.name.trim().toLowerCase()] = h.value
        })
        const resp = await callApi(built.url, {
          method: 'POST',
          headers,
          body: JSON.stringify(built.body),
          signal: state.aborter.signal
        })
        if (!resp.ok) {
          let msgErr = 'HTTP ' + resp.status
          try {
            const j = await resp.json()
            const detail = fmt.parseError(j)
            if (detail) msgErr = detail
          } catch (err) { /* thân phản hồi không phải JSON */ }
          throw apiError(resp.status === 429 ? 'rate' : 'http', msgErr, resp.status)
        }
        const ctype = resp.headers.get('content-type') || ''
        if (stream && ctype.indexOf('text/event-stream') !== -1) {
          await readSseStream(resp, evt => handleSseEvent(fmt, evt, msg))
        } else {
          let json = null
          try { json = await resp.json() } catch (err) { throw apiError('api', 'Phản hồi không phải JSON hợp lệ.') }
          if (json && json.error) {
            const detail = fmt.parseError(json)
            throw apiError('api', detail || 'Lỗi API')
          }
          msg.content = fmt.parseFull(json)
          updateStreamingDom(msg)
        }
        msg.status = 'complete'
      } catch (err) {
        if (err && err.name === 'AbortError') {
          msg.status = 'stopped'
        } else {
          msg.status = 'error'
          msg.error = normalizeError(err)
        }
      }
      state.generating = false
      state.aborter = null
      conv.updatedAt = Date.now()
      renderMessages()
      renderSidebar()
      saveNow()
      scrollBottom(true)
      if (msg.status === 'complete') announce(STR.annDone)
      else if (msg.status === 'stopped') { announce(STR.annStopped); toast(STR.stopped, 'info') }
      else { announce(msg.error.message); toast(msg.error.message, 'error', 5200) }
    }

    function pushAssistantAndRun (conv) {
      const ep = currentEndpoint()
      const msg = {
        id: uid(),
        role: 'assistant',
        content: '',
        createdAt: Date.now(),
        status: 'streaming',
        model: state.modelId,
        endpointId: state.endpointId,
        endpointName: ep ? ep.name : '',
        modelLabel: state.modelId,
        feedback: null
      }
      conv.messages.push(msg)
      conv.updatedAt = Date.now()
      renderMessages()
      scrollBottom(true)
      startGeneration(conv, msg)
    }

    function sendMessage () {
      if (state.generating) return
      if (!navigator.onLine) { toast('Mất kết nối mạng. Hãy kiểm tra mạng rồi thử lại.', 'error'); return }
      if (!currentEndpoint()) { toast(STR.needEndpoint, 'error'); openEpModal(); return }
      if (!state.modelId) { toast(STR.needModel, 'error'); openEpModal(); return }
      let conv = currentConv()
      if (!conv) conv = createConversation(true)
      const text = state.draft.trim()
      if (text || state.attachments.length) {
        conv.messages.push({
          id: uid(),
          role: 'user',
          content: text,
          createdAt: Date.now(),
          attachments: state.attachments.map(a => ({ name: a.name, size: a.size, type: a.type, url: a.url, dataUrl: a.dataUrl }))
        })
        if (!conv.renamed && text) {
          conv.title = text.length > 60 ? text.slice(0, 60) + '…' : text
        }
      }
      if (!conv.messages.length) return
      state.draft = ''
      state.attachments = []
      const ta = $('#prompt-input')
      ta.value = ''
      autosize()
      updateCharCount()
      renderComposer()
      renderSidebar()
      renderTopBits()
      saveNow()
      pushAssistantAndRun(conv)
    }

    function stopGeneration () {
      if (state.aborter) state.aborter.abort()
    }

    function addMessage (role) {
      if (state.generating) { toast(STR.genBusy, 'error'); return }
      if (state.editingId) return
      if (ROLES.indexOf(role) === -1) return
      let conv = currentConv()
      if (!conv) conv = createConversation(true)
      const m = { id: uid(), role, content: '', createdAt: Date.now() }
      if (isAssistantRole(role)) m.status = 'complete'
      conv.messages.push(m)
      state.editingId = m.id
      state.newMsgId = m.id
      conv.updatedAt = Date.now()
      renderMessages()
      renderSidebar()
      saveNow()
      scrollBottom(true)
    }

    function cancelEdit () {
      const conv = currentConv()
      if (conv && state.newMsgId) {
        const m = conv.messages.find(x => x.id === state.newMsgId)
        if (m && !m.content) conv.messages = conv.messages.filter(x => x.id !== state.newMsgId)
      }
      state.editingId = null
      state.newMsgId = null
      renderMessages()
      renderSidebar()
      saveNow()
    }

    function saveMessageEdit (msgId) {
      const conv = currentConv()
      if (!conv) return
      const ta = $('#edit-area')
      const val = ta ? ta.value.trim() : ''
      if (!val) { toast(STR.emptyPrompt, 'error'); return }
      if (state.generating) { toast(STR.genBusy, 'error'); return }
      const m = conv.messages.find(x => x.id === msgId)
      if (!m) return
      m.content = val
      state.editingId = null
      state.newMsgId = null
      conv.updatedAt = Date.now()
      saveNow()
      renderMessages()
      renderSidebar()
    }

    function deleteMessage (msgId) {
      if (state.generating) { toast(STR.genBusy, 'error'); return }
      const conv = currentConv()
      if (!conv) return
      const m = conv.messages.find(x => x.id === msgId)
      if (!m) return
      if (m.attachments) {
        m.attachments.forEach(a => {
          if (a.url && a.url.startsWith('blob:')) URL.revokeObjectURL(a.url)
        })
      }
      conv.messages = conv.messages.filter(x => x.id !== msgId)
      conv.updatedAt = Date.now()
      if (state.editingId === msgId) {
        state.editingId = null
        state.newMsgId = null
      }
      renderMessages()
      renderSidebar()
      saveNow()
    }

    function regenerateFrom (msgId) {
      if (state.generating) { toast(STR.genBusy, 'error'); return }
      if (!navigator.onLine) { toast('Mất kết nối mạng. Hãy kiểm tra mạng rồi thử lại.', 'error'); return }
      const conv = currentConv()
      if (!conv) return
      const idx = conv.messages.findIndex(m => m.id === msgId)
      if (idx < 0) return
      conv.messages = conv.messages.slice(0, idx)
      saveNow()
      pushAssistantAndRun(conv)
    }

    function toggleFeedback (msgId, val) {
      const conv = currentConv()
      if (!conv) return
      const m = conv.messages.find(x => x.id === msgId)
      if (!m) return
      m.feedback = m.feedback === val ? null : val
      const up = document.querySelector(`[data-act="fb-up"][data-id="${msgId}"]`)
      const down = document.querySelector(`[data-act="fb-down"][data-id="${msgId}"]`)
      if (up) up.setAttribute('aria-pressed', m.feedback === 'up' ? 'true' : 'false')
      if (down) down.setAttribute('aria-pressed', m.feedback === 'down' ? 'true' : 'false')
      saveNow()
    }

    const mqMobile = window.matchMedia('(max-width: 1279px)')

    function applyDesktopPanels () {
      $('#app-sidebar').classList.toggle('closed', !state.ui.sidebarOpen)
      $('#app-settings').classList.toggle('closed', !state.ui.settingsOpen)
      $('#btn-menu').setAttribute('aria-expanded', state.ui.sidebarOpen ? 'true' : 'false')
      $('#btn-settings').setAttribute('aria-expanded', state.ui.settingsOpen ? 'true' : 'false')
    }

    function refreshBackdrop () {
      $('#app-backdrop').classList.toggle('show', !!state.drawer)
    }

    function openDrawer (which) {
      state.drawer = which
      $(which).classList.add('drawer-open')
      refreshBackdrop()
      const focusable = $(which).querySelector('button, input, textarea, select')
      if (focusable) focusable.focus()
    }

    function closeDrawers () {
      if (!state.drawer) return
      $(state.drawer).classList.remove('drawer-open')
      state.drawer = null
      refreshBackdrop()
    }

    function toggleSidebar () {
      if (mqMobile.matches) {
        if (state.drawer === '#app-sidebar') closeDrawers()
        else { closeDrawers(); openDrawer('#app-sidebar') }
      } else {
        state.ui.sidebarOpen = !state.ui.sidebarOpen
        applyDesktopPanels()
        saveNow()
      }
    }

    function toggleSettings () {
      if (mqMobile.matches) {
        if (state.drawer === '#app-settings') closeDrawers()
        else { closeDrawers(); openDrawer('#app-settings') }
      } else {
        state.ui.settingsOpen = !state.ui.settingsOpen
        applyDesktopPanels()
        saveNow()
      }
    }

    function applyTheme () {
      document.documentElement.setAttribute('data-theme', state.theme)
      const btn = $('#btn-theme')
      btn.innerHTML = ic(state.theme === 'dark' ? 'sun' : 'moon')
      btn.setAttribute('aria-label', state.theme === 'dark' ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối')
    }

    function toggleTheme () {
      state.theme = state.theme === 'dark' ? 'light' : 'dark'
      applyTheme()
      saveNow()
    }

    function bindEvents () {
      $('#btn-menu').addEventListener('click', toggleSidebar)
      $('#btn-side-collapse').addEventListener('click', toggleSidebar)
      $('#btn-settings').addEventListener('click', toggleSettings)
      $('#btn-set-close').addEventListener('click', closeDrawers)
      $('#btn-theme').addEventListener('click', toggleTheme)
      $('#app-backdrop').addEventListener('click', closeDrawers)

      $('#endpoint-select').addEventListener('change', e => {
        setActiveEndpoint(e.target.value)
      })

      $('#model-select').addEventListener('change', e => {
        state.modelId = e.target.value
        saveNow()
      })

      $('#btn-ep').addEventListener('click', openEpModal)

      $('#btn-new').addEventListener('click', () => {
        createConversation(true)
        renderMessages()
        renderTopBits()
        closeDrawers()
        $('#prompt-input').focus()
      })

      $('#search-input').addEventListener('input', e => {
        state.query = e.target.value
        renderSidebar()
      })

      $('#btn-search-clear').addEventListener('click', () => {
        state.query = ''
        $('#search-input').value = ''
        renderSidebar()
        $('#search-input').focus()
      })

      $('#conv-list').addEventListener('click', e => {
        const clearBtn = e.target.closest('[data-act="clear-search"]')
        if (clearBtn) {
          state.query = ''
          $('#search-input').value = ''
          renderSidebar()
          return
        }
        const actBtn = e.target.closest('[data-cact]')
        const item = e.target.closest('.conv')
        if (!item) return
        const id = item.getAttribute('data-id')
        if (actBtn) {
          e.stopPropagation()
          onConvAction(actBtn.getAttribute('data-cact'), id)
          return
        }
        selectConversation(id)
      })

      $('#conv-list').addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return
        const item = e.target.closest('.conv')
        if (item && e.target === item) {
          e.preventDefault()
          selectConversation(item.getAttribute('data-id'))
        }
      })

      const messages = $('#message-list')
      messages.addEventListener('click', e => {
        const sugg = e.target.closest('[data-sugg]')
        if (sugg) {
          const sg = SUGGESTIONS[Number(sugg.getAttribute('data-sugg'))]
          if (sg) {
            state.draft = sg.p
            const ta = $('#prompt-input')
            ta.value = sg.p
            autosize()
            updateCharCount()
            updateComposerButtons()
            ta.focus()
          }
          return
        }
        const cp = e.target.closest('[data-copy]')
        if (cp) {
          copyText(dec64(cp.getAttribute('data-copy'))).then(ok => {
            toast(ok ? STR.copied : STR.copyFail, ok ? 'success' : 'error')
            if (ok) {
              cp.classList.add('ok')
              setTimeout(() => cp.classList.remove('ok'), 1200)
            }
          })
          return
        }
        const btn = e.target.closest('[data-act]')
        if (!btn) return
        const act = btn.getAttribute('data-act')
        const id = btn.getAttribute('data-id')
        if (act === 'open-ep') { openEpModal(); return }
        const conv = currentConv()
        if (!conv) return
        if (act === 'copy') {
          const m = conv.messages.find(x => x.id === id)
          if (m) copyText(m.content).then(ok => toast(ok ? STR.copied : STR.copyFail, ok ? 'success' : 'error'))
        } else if (act === 'edit') {
          if (state.generating) { toast(STR.genBusy, 'error'); return }
          if (state.editingId) return
          state.editingId = id
          state.newMsgId = null
          renderMessages()
        } else if (act === 'save-edit') {
          saveMessageEdit(id)
        } else if (act === 'cancel-edit') {
          cancelEdit()
        } else if (act === 'delete') {
          deleteMessage(id)
        } else if (act === 'regen' || act === 'retry') {
          regenerateFrom(id)
        } else if (act === 'fb-up') {
          toggleFeedback(id, 'up')
        } else if (act === 'fb-down') {
          toggleFeedback(id, 'down')
        }
      })

      messages.addEventListener('change', e => {
        const sel = e.target.closest('[data-msg-role]')
        if (!sel) return
        if (state.generating) return
        const conv = currentConv()
        if (!conv) return
        const m = conv.messages.find(x => x.id === sel.getAttribute('data-msg-role'))
        if (!m || m.status === 'streaming') return
        if (ROLES.indexOf(sel.value) === -1) return
        m.role = sel.value
        if (isAssistantRole(m.role) && !m.status) m.status = 'complete'
        saveNow()
        renderMessages()
      })

      $$('[data-addrole]').forEach(b => {
        b.addEventListener('click', () => addMessage(b.getAttribute('data-addrole')))
      })

      const sc = $('#chat-scroll')
      sc.addEventListener('scroll', () => {
        stickBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 90
        const conv = currentConv()
        $('#btn-jump').hidden = stickBottom || !conv || !conv.messages.length
      })

      $('#btn-jump').addEventListener('click', () => {
        stickBottom = true
        scrollBottom(true)
        $('#btn-jump').hidden = true
      })

      const ta = $('#prompt-input')
      let composing = false
      ta.addEventListener('compositionstart', () => { composing = true })
      ta.addEventListener('compositionend', () => { composing = false })
      ta.addEventListener('input', () => {
        state.draft = ta.value
        autosize()
        updateCharCount()
        updateComposerButtons()
      })
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !composing) {
          e.preventDefault()
          sendMessage()
        }
      })

      $('#btn-send').addEventListener('click', sendMessage)
      $('#btn-stop').addEventListener('click', stopGeneration)

      $('#btn-attach').addEventListener('click', () => $('#file-input').click())
      $('#file-input').addEventListener('change', e => {
        Array.from(e.target.files).forEach(addAttachment)
        e.target.value = ''
      })

      $('#attach-row').addEventListener('click', e => {
        const rm = e.target.closest('[data-rm]')
        if (rm) removeAttachment(rm.getAttribute('data-rm'))
      })

      bindParamPair('temp-range', 'temp-num', 'temperature')
      bindParamPair('topp-range', 'topp-num', 'topP')

      $('#topk-input').addEventListener('input', e => {
        const raw = e.target.value.trim()
        state.settings.topK = raw === '' ? null : Math.max(1, Math.floor(Number(raw) || 1))
        saveNow()
      })
      $('#topk-input').addEventListener('change', e => {
        e.target.value = state.settings.topK == null ? '' : String(state.settings.topK)
      })

      $('#maxt-input').addEventListener('input', e => {
        const raw = e.target.value.trim()
        state.settings.maxTokens = raw === '' ? null : Math.max(1, Math.floor(Number(raw) || 1))
        saveNow()
      })
      $('#maxt-input').addEventListener('change', e => {
        e.target.value = state.settings.maxTokens == null ? '' : String(state.settings.maxTokens)
      })

      $('#sw-sampling').addEventListener('click', () => {
        state.settings.sampling = !state.settings.sampling
        renderSettingsPanel()
        saveNow()
      })

      $('#sw-stream').addEventListener('click', () => {
        state.settings.streaming = !state.settings.streaming
        $('#sw-stream').setAttribute('aria-checked', state.settings.streaming ? 'true' : 'false')
        saveNow()
      })

      $('#btn-reset').addEventListener('click', resetParams)

      $('#btn-ep-close').addEventListener('click', closeEpModal)
      $('#ep-root').addEventListener('click', e => {
        if (e.target.closest('[data-ep-close]')) closeEpModal()
      })
      $('.ep-panel').addEventListener('keydown', e => {
        if (epModalOpen && e.key === 'Tab') trapTab(e, $('.ep-panel'))
      })
      $('#btn-ep-add').addEventListener('click', () => showEpForm(null))
      $('#btn-ep-cancel').addEventListener('click', hideEpForm)
      $('#btn-ep-save').addEventListener('click', saveEpForm)
      $('#btn-ep-model-add').addEventListener('click', addEpModel)
      $('#ep-model-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); addEpModel() }
      })
      $('#btn-ep-header-add').addEventListener('click', () => {
        epFormHeaders.push({ name: '', value: '' })
        renderEpHeaders()
      })
      $('#ep-headers-list').addEventListener('input', e => {
        const nameInput = e.target.closest('[data-hname]')
        const valInput = e.target.closest('[data-hval]')
        if (nameInput) epFormHeaders[Number(nameInput.getAttribute('data-hname'))].name = e.target.value
        else if (valInput) epFormHeaders[Number(valInput.getAttribute('data-hval'))].value = e.target.value
      })
      $('#ep-headers-list').addEventListener('click', e => {
        const rm = e.target.closest('[data-hrm]')
        if (!rm) return
        epFormHeaders.splice(Number(rm.getAttribute('data-hrm')), 1)
        renderEpHeaders()
      })
      $('#ep-format').addEventListener('change', () => {
        const fmt = API_FORMATS[$('#ep-format').value]
        const base = $('#ep-base').value.trim()
        const isPreset = FORMAT_ORDER.some(f => base === API_FORMATS[f].presetBase)
        if (!base || isPreset) $('#ep-base').value = fmt.presetBase
        updateEpUrlHint()
      })
      $('#ep-base').addEventListener('input', updateEpUrlHint)
      $('#ep-model-chips').addEventListener('click', e => {
        const rm = e.target.closest('[data-mrm]')
        if (!rm) return
        epFormModels.splice(Number(rm.getAttribute('data-mrm')), 1)
        renderEpModelChips()
      })
      $('#ep-list').addEventListener('click', e => {
        const actBtn = e.target.closest('[data-eact]')
        const card = e.target.closest('.ep-card')
        if (!card) return
        const id = card.getAttribute('data-epid')
        if (actBtn) {
          e.stopPropagation()
          const act = actBtn.getAttribute('data-eact')
          if (act === 'edit') {
            showEpForm(endpointById(id))
          } else if (act === 'del') {
            deleteEndpoint(id)
          }
          return
        }
        setActiveEndpoint(id)
        renderEpList()
      })
      $('#ep-list').addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return
        const card = e.target.closest('.ep-card')
        if (card && e.target === card) {
          e.preventDefault()
          setActiveEndpoint(card.getAttribute('data-epid'))
          renderEpList()
        }
      })

      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return
        if (modalState) { finishModal(null); return }
        if (epModalOpen) { closeEpModal(); return }
        if (state.drawer) closeDrawers()
      })

      window.addEventListener('online', () => { renderTopBits(); toast('Đã kết nối mạng.', 'success') })
      window.addEventListener('offline', () => { renderTopBits(); toast('Mất kết nối mạng.', 'error') })

      mqMobile.addEventListener('change', ev => {
        if (!ev.matches) {
          closeDrawers()
          applyDesktopPanels()
        }
      })

      window.addEventListener('beforeunload', saveNow)
    }

    function hydrateIcons () {
      $$('[data-icon]').forEach(el => {
        el.innerHTML = ic(el.getAttribute('data-icon'))
      })
    }

    function init () {
      hydrateIcons()
      applyTheme()
      renderEndpointSelect()
      renderModelSelect()
      renderSettingsPanel()
      renderSidebar()
      renderMessages()
      renderComposer()
      renderTopBits()
      applyDesktopPanels()
      updateCharCount()
      bindEvents()
      scrollBottom(true)
    }

    document.addEventListener('DOMContentLoaded', init)
  </script>
</body>
</html>
