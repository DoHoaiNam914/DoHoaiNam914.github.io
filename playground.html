    function createApiRequestWorker () {
      if (
        !window.Worker ||
        !window.Blob ||
        !window.URL
      ) {
        return null
      }

      const source = `
        const activeRequests = new Map()

        function send (id, type, payload) {
          self.postMessage(Object.assign({
            id,
            type
          }, payload || {}))
        }

        async function readEvents (response, requestId) {
          const reader = response.body.getReader()
          const decoder = new TextDecoder()

          let buffer = ''
          let eventName = ''
          let dataLines = []
          let events = []
          let flushTimer = null

          function flushEvents () {
            if (!events.length) return
            send(requestId, 'events', { events })
            events = []
          }

          function scheduleFlush () {
            if (flushTimer != null) return

            flushTimer = setTimeout(() => {
              flushTimer = null
              flushEvents()
            }, 32)
          }

          function dispatchEvent () {
            if (dataLines.length) {
              events.push({
                event: eventName,
                raw: dataLines.join('\\n')
              })
              scheduleFlush()
            }

            eventName = ''
            dataLines = []
          }

          function consumeLine (rawLine) {
            const line = rawLine.endsWith('\\r')
              ? rawLine.slice(0, -1)
              : rawLine

            if (!line) {
              dispatchEvent()
            } else if (line.startsWith(':')) {
              return
            } else if (line.startsWith('event:')) {
              eventName = line.slice(6).trim()
            } else if (line.startsWith('data:')) {
              dataLines.push(
                line.slice(5).replace(/^ /, '')
              )
            }
          }

          while (true) {
            const result = await reader.read()

            if (result.done) break

            buffer += decoder.decode(
              result.value,
              { stream: true }
            )

            const lines = buffer.split('\\n')

            buffer = lines.pop() || ''

            for (const line of lines) {
              consumeLine(line)
            }
          }

          buffer += decoder.decode()

          if (buffer) consumeLine(buffer)

          dispatchEvent()

          if (flushTimer != null) {
            clearTimeout(flushTimer)
            flushTimer = null
          }

          flushEvents()
        }

        async function runRequest (data) {
          const controller = new AbortController()

          activeRequests.set(data.id, controller)

          try {
            const response = await fetch(
              data.url,
              {
                body: data.body,
                headers: data.headers,
                method: data.method,
                signal: controller.signal
              }
            )

            const contentType =
              response.headers.get('content-type') || ''

            send(data.id, 'response', {
              contentType,
              ok: response.ok,
              status: response.status,
              statusText: response.statusText
            })

            if (
              response.ok &&
              data.expectStream &&
              response.body &&
              contentType.includes('text/event-stream')
            ) {
              await readEvents(response, data.id)
              send(data.id, 'complete', {
                streamed: true
              })
            } else {
              const text = await response.text()

              send(data.id, 'body', {
                streamed: false,
                text
              })
            }
          } catch (error) {
            send(data.id, 'error', {
              message:
                error && error.message
                  ? error.message
                  : 'Không thể gọi API.',
              name:
                error && error.name
                  ? error.name
                  : 'Error'
            })
          } finally {
            activeRequests.delete(data.id)
          }
        }

        self.onmessage = event => {
          const data = event.data || {}

          if (data.type === 'abort') {
            const controller =
              activeRequests.get(data.id)

            if (controller) controller.abort()
            return
          }

          if (data.type === 'request') {
            runRequest(data)
          }
        }
      `

      try {
        const blob = new Blob(
          [source],
          { type: 'text/javascript' }
        )

        const url = URL.createObjectURL(blob)
        const worker = new Worker(url)

        URL.revokeObjectURL(url)
        return worker
      } catch {
        return null
      }
    }

    function createAbortError () {
      try {
        return new DOMException(
          'Đã huỷ yêu cầu.',
          'AbortError'
        )
      } catch {
        const error =
          new Error('Đã huỷ yêu cầu.')

        error.name = 'AbortError'
        return error
      }
    }

    function finishApiWorkerRequest (
      request,
      callback,
      value
    ) {
      if (!request || request.settled) return

      request.settled = true

      if (
        request.signal &&
        request.abortHandler
      ) {
        request.signal.removeEventListener(
          'abort',
          request.abortHandler
        )
      }

      apiWorkerRequests.delete(request.id)
      callback(value)
    }

    function handleApiWorkerMessage (event) {
      const data = event.data || {}

      const request =
        apiWorkerRequests.get(data.id)

      if (!request) return

      if (data.type === 'response') {
        request.metadata = {
          contentType: data.contentType || '',
          ok: data.ok === true,
          status: Number(data.status) || 0,
          statusText: data.statusText || ''
        }

        return
      }

      if (data.type === 'events') {
        try {
          if (request.onEvent) {
            ;(data.events || []).forEach(
              streamEvent => {
                request.onEvent(streamEvent)
              }
            )
          }
        } catch (error) {
          if (apiRequestWorker) {
            apiRequestWorker.postMessage({
              id: request.id,
              type: 'abort'
            })
          }

          finishApiWorkerRequest(
            request,
            request.reject,
            error
          )
        }

        return
      }

      if (data.type === 'body') {
        finishApiWorkerRequest(
          request,
          request.resolve,
          {
            ...(request.metadata || {
              contentType: '',
              ok: false,
              status: 0,
              statusText: ''
            }),
            streamed: false,
            text:
              typeof data.text === 'string'
                ? data.text
                : ''
          }
        )

        return
      }

      if (data.type === 'complete') {
        finishApiWorkerRequest(
          request,
          request.resolve,
          {
            ...(request.metadata || {
              contentType:
                'text/event-stream',
              ok: true,
              status: 200,
              statusText: ''
            }),
            streamed: true,
            text: ''
          }
        )

        return
      }

      if (data.type === 'error') {
        const error =
          data.name === 'AbortError'
            ? createAbortError()
            : createApiError(
                'network',
                data.message ||
                'Không thể gọi API. Hãy kiểm tra mạng, URL API hoặc CORS.'
              )

        finishApiWorkerRequest(
          request,
          request.reject,
          error
        )
      }
    }

    function handleApiWorkerFailure () {
      const error = createApiError(
        'network',
        'Tiến trình chạy ngầm của API đã dừng.'
      )

      Array.from(
        apiWorkerRequests.values()
      ).forEach(request => {
        finishApiWorkerRequest(
          request,
          request.reject,
          error
        )
      })

      if (apiRequestWorker) {
        apiRequestWorker.terminate()
        apiRequestWorker = null
      }
    }

    function executeApiRequestWithWorker (
      url,
      options,
      onEvent
    ) {
      return new Promise((resolve, reject) => {
        if (!apiRequestWorker) {
          reject(
            createApiError(
              'network',
              'Tiến trình chạy ngầm không khả dụng.'
            )
          )
          return
        }

        const id = createUniqueId()
        const signal = options.signal

        const request = {
          abortHandler: null,
          id,
          metadata: null,
          onEvent,
          reject,
          resolve,
          settled: false,
          signal
        }

        request.abortHandler = () => {
          if (apiRequestWorker) {
            apiRequestWorker.postMessage({
              id,
              type: 'abort'
            })
          }

          finishApiWorkerRequest(
            request,
            reject,
            createAbortError()
          )
        }

        if (signal && signal.aborted) {
          request.abortHandler()
          return
        }

        if (signal) {
          signal.addEventListener(
            'abort',
            request.abortHandler,
            { once: true }
          )
        }

        apiWorkerRequests.set(id, request)

        try {
          apiRequestWorker.postMessage({
            body: options.body,
            expectStream:
              typeof onEvent === 'function',
            headers: options.headers,
            id,
            method: options.method || 'GET',
            type: 'request',
            url
          })
        } catch (error) {
          finishApiWorkerRequest(
            request,
            reject,
            createApiError(
              'network',
              error.message ||
              'Không thể khởi tạo yêu cầu chạy ngầm.'
            )
          )
        }
      })
    }

    async function fetchApiResponse (url, options) {
      try {
        return await window.fetch(url, options)
      } catch (error) {
        if (
          error &&
          error.name === 'AbortError'
        ) {
          throw error
        }

        throw createApiError(
          'network',
          'Không thể gọi API. Hãy kiểm tra mạng, URL API hoặc CORS.'
        )
      }
    }

    async function readServerSentEvents (
      response,
      handleEvent
    ) {
      const reader = response.body.getReader()
      const decoder = new TextDecoder()

      let buffer = ''
      let eventName = ''
      let dataLines = []

      function dispatchEvent () {
        if (dataLines.length) {
          handleEvent({
            event: eventName,
            raw: dataLines.join('\n')
          })
        }

        eventName = ''
        dataLines = []
      }

      function consumeLine (rawLine) {
        const line =
          rawLine.endsWith('\r')
            ? rawLine.slice(0, -1)
            : rawLine

        if (!line) {
          dispatchEvent()
        } else if (line.startsWith(':')) {
          return
        } else if (line.startsWith('event:')) {
          eventName = line.slice(6).trim()
        } else if (line.startsWith('data:')) {
          dataLines.push(
            line.slice(5).replace(/^ /, '')
          )
        }
      }

      while (true) {
        const result = await reader.read()

        if (result.done) break

        buffer += decoder.decode(
          result.value,
          { stream: true }
        )

        const lines = buffer.split('\n')

        buffer = lines.pop() || ''

        for (const line of lines) {
          consumeLine(line)
        }
      }

      buffer += decoder.decode()

      if (buffer) consumeLine(buffer)
      dispatchEvent()
    }

    async function executeApiRequestOnMainThread (
      url,
      options,
      onEvent
    ) {
      const response =
        await fetchApiResponse(url, options)

      const contentType =
        response.headers.get('content-type') || ''

      if (
        response.ok &&
        onEvent &&
        response.body &&
        contentType.includes('text/event-stream')
      ) {
        await readServerSentEvents(
          response,
          onEvent
        )

        return {
          contentType,
          ok: response.ok,
          status: response.status,
          statusText: response.statusText,
          streamed: true,
          text: ''
        }
      }

      return {
        contentType,
        ok: response.ok,
        status: response.status,
        statusText: response.statusText,
        streamed: false,
        text: await response.text()
      }
    }

    function executeApiRequest (
      url,
      options,
      onEvent
    ) {
      if (apiRequestWorker) {
        return executeApiRequestWithWorker(
          url,
          options,
          onEvent
        )
      }

      return executeApiRequestOnMainThread(
        url,
        options,
        onEvent
      )
    }

    function applyOutputUpdate (message, update) {
      if (update.kind === 'replace-all') {
        message.outputBlocks =
          update.blocks
            .map(sanitizeOutputBlock)
            .filter(Boolean)

        return true
      }

      if (update.kind === 'finalize-tools') {
        getMessageOutputBlocks(message)
          .forEach(block => {
            if (
              block.type !== 'tool' ||
              !ACTIVE_TOOL_STATUSES.includes(
                block.status
              )
            ) {
              return
            }

            block.status = block.serverSide
              ? 'completed'
              : 'waiting'
          })

        return true
      }

      const blocks =
        getMessageOutputBlocks(message)

      if (
        update.kind === 'append' &&
        (
          update.type === 'text' ||
          update.type === 'reasoning'
        )
      ) {
        let block = blocks.find(
          item => item.id === update.id
        )

        if (!block) {
          block =
            update.type === 'text'
              ? createTextBlock(update.id, '')
              : createReasoningBlock(
                  update.id,
                  ''
                )

          blocks.push(block)
        }

        block.content += update.content || ''
        return true
      }

      if (update.kind === 'redacted') {
        const exists = blocks.some(
          block => block.id === update.id
        )

        if (!exists) {
          blocks.push(
            createRedactedBlock(update.id)
          )
        }

        return !exists
      }

      if (update.kind === 'tool') {
        let block = blocks.find(item => {
          return (
            item.type === 'tool' &&
            item.id === update.id
          )
        })

        if (!block) {
          block = createToolBlock({
            id: update.id,
            input: update.input,
            name: update.name,
            output: update.output,
            serverSide:
              update.serverSide === true,
            status: update.status,
            toolType:
              update.toolType || 'tool_call'
          })

          blocks.push(block)
        }

        if (update.name) block.name = update.name

        if (update.toolType) {
          block.toolType = update.toolType
        }

        if (update.status) {
          block.status =
            normalizeToolStatus(update.status)
        }

        if (update.serverSide != null) {
          block.serverSide =
            update.serverSide === true
        }

        if (update.input != null) {
          block.input =
            stringifyToolPayload(update.input)
        }

        if (update.inputDelta) {
          block.input = limitText(
            (block.input || '') +
            update.inputDelta
          )
        }

        if (update.output != null) {
          block.output =
            stringifyToolPayload(update.output)
        }

        return true
      }

      return false
    }

    function getStreamRenderDelay (message) {
      const size = getMessageOutputBlocks(message)
        .reduce((total, block) => {
          return total +
            String(block.content || '').length +
            String(block.input || '').length +
            String(block.output || '').length
        }, 0)

      if (size > 120000) return 600
      if (size > 60000) return 420
      if (size > 24000) return 280
      if (size > 8000) return 180
      return 100
    }

    function mergeQueuedUpdate (updates, update) {
      const last = updates[updates.length - 1]

      if (
        last &&
        last.kind === 'append' &&
        update.kind === 'append' &&
        last.id === update.id &&
        last.type === update.type
      ) {
        last.content += update.content || ''
        return
      }

      if (
        last &&
        last.kind === 'tool' &&
        update.kind === 'tool' &&
        last.id === update.id
      ) {
        if (update.inputDelta) {
          last.inputDelta =
            (last.inputDelta || '') +
            update.inputDelta
        }

        ;[
          'input',
          'name',
          'output',
          'serverSide',
          'status',
          'toolType'
        ].forEach(property => {
          if (update[property] != null) {
            last[property] = update[property]
          }
        })

        return
      }

      if (update.kind === 'replace-all') {
        updates.length = 0
      }

      updates.push(update)
    }

    function createStreamRenderer (
      message,
      conversationId
    ) {
      let scheduled = false
      let frameId = null
      let timeoutId = null
      let updates = []
      let dirty = false

      function clearScheduledHandles () {
        if (frameId != null) {
          window.cancelAnimationFrame(frameId)
          frameId = null
        }

        if (timeoutId != null) {
          window.clearTimeout(timeoutId)
          timeoutId = null
        }
      }

      function applyPendingUpdates () {
        if (!updates.length) return

        const frameUpdates = updates
        let changed = false

        updates = []

        frameUpdates.forEach(update => {
          changed =
            applyOutputUpdate(
              message,
              update
            ) || changed
        })

        if (changed) {
          syncMessageOutput(message)
          dirty = true
        }
      }

      function paint () {
        if (!dirty || document.hidden) return

        if (
          state.activeConversationId ===
          conversationId
        ) {
          updateStreamingMessageDom(
            message,
            conversationId
          )
          scrollToBottom(false)
        }

        dirty = false
      }

      function renderFrame () {
        scheduled = false
        clearScheduledHandles()
        applyPendingUpdates()
        paint()

        if (updates.length) scheduleRender()
      }

      function scheduleRender () {
        if (scheduled) return

        scheduled = true

        timeoutId = window.setTimeout(() => {
          timeoutId = null

          if (document.hidden) {
            renderFrame()
          } else {
            frameId =
              window.requestAnimationFrame(
                renderFrame
              )
          }
        }, getStreamRenderDelay(message))
      }

      function queueUpdate (update) {
        if (!update) return

        mergeQueuedUpdate(updates, update)
        scheduleRender()
      }

      return {
        drain () {
          clearScheduledHandles()
          scheduled = false
          applyPendingUpdates()
          paint()
          return Promise.resolve()
        },

        finalizeTools () {
          queueUpdate({
            kind: 'finalize-tools'
          })
        },

        replaceAll (blocks) {
          if (!Array.isArray(blocks)) return

          queueUpdate({
            blocks,
            kind: 'replace-all'
          })
        },

        update (update) {
          queueUpdate(update)
        },

        updateMany (nextUpdates) {
          if (!Array.isArray(nextUpdates)) return
          nextUpdates.forEach(queueUpdate)
        }
      }
    }

    function parseStreamData (raw) {
      if (raw === '[DONE]') return {}

      try {
        return JSON.parse(raw)
      } catch {
        try {
          return parseJson5(raw)
        } catch {
          return null
        }
      }
    }

    function handleStreamEvent (
      format,
      streamEvent,
      renderer,
      streamState
    ) {
      const data =
        parseStreamData(streamEvent.raw)

      if (data == null) return

      const result = format.parseEvent(
        {
          data,
          event: streamEvent.event,
          raw: streamEvent.raw
        },
        streamState
      )

      if (result.error) {
        throw createApiError(
          'api',
          result.error
        )
      }

      renderer.updateMany(result.updates)

      if (result.finalBlocks) {
        renderer.replaceAll(result.finalBlocks)
      }

      if (result.finalizeTools) {
        renderer.finalizeTools()
      }
    }

    function normalizeError (error) {
      return {
        kind:
          error && error.kind
            ? error.kind
            : 'api',
        message:
          error && error.message
            ? error.message
            : 'Đã xảy ra lỗi không xác định.'
      }
    }

    function parseApiResponseText (text) {
      try {
        return JSON.parse(text)
      } catch {
        try {
          return parseJson5(text)
        } catch {
          throw createApiError(
            'api',
            'Phản hồi API không phải JSON hợp lệ.'
          )
        }
      }
    }

    async function generateAssistantResponse (
      conversation,
      message
    ) {
      const runtime =
        getConversationRuntime(conversation.id)

      if (runtime.generating) return

      runtime.generating = true
      runtime.abortController =
        new AbortController()

      if (
        state.activeConversationId ===
        conversation.id
      ) {
        renderMessages()
        announce('Đang gọi API')
      }

      renderSidebar()

      const endpoint =
        getEndpointById(message.endpointId)

      let renderer = null

      try {
        if (!endpoint) {
          throw createApiError(
            'config',
            TEXT.endpointRequired
          )
        }

        if (!message.model) {
          throw createApiError(
            'config',
            TEXT.modelRequired
          )
        }

        const settings =
          buildRequestSettings(
            conversation.configuration
          )

        const messages =
          buildCanonicalMessages(
            conversation,
            message,
            settings.variables
          )

        validateAttachmentData(messages)

        const format =
          API_FORMATS[endpoint.format]

        const request = format.build({
          apiKey: endpoint.apiKey,
          base: endpoint.baseUrl,
          messages,
          model: message.model,
          settings,
          stream: settings.streaming
        })

        const headers =
          Object.assign({}, request.headers)

        endpoint.headers.forEach(header => {
          if (header.name) {
            headers[header.name.toLowerCase()] =
              header.value
          }
        })

        const streamState = {
          anthropicBlocks: {},
          interactionSteps: {},
          lastGeminiCodeToolId: null,
          sequence: 0,
          sequentialBlocks: {}
        }

        if (settings.streaming) {
          renderer =
            createStreamRenderer(
              message,
              conversation.id
            )
        }

        const result =
          await executeApiRequest(
            request.url,
            {
              body: JSON.stringify(request.body),
              headers,
              method: 'POST',
              signal:
                runtime.abortController.signal
            },
            renderer
              ? streamEvent => {
                  handleStreamEvent(
                    format,
                    streamEvent,
                    renderer,
                    streamState
                  )
                }
              : null
          )

        if (!result.ok) {
          let errorMessage =
            'HTTP ' + result.status

          if (result.text) {
            try {
              const json =
                parseApiResponseText(result.text)

              const detail =
                format.parseError(json)

              if (detail) errorMessage = detail
            } catch {
              errorMessage =
                'HTTP ' + result.status
            }
          }

          throw createApiError(
            result.status === 429
              ? 'rate'
              : 'http',
            errorMessage,
            result.status
          )
        }

        if (result.streamed) {
          renderer.finalizeTools()
          await renderer.drain()
        } else {
          const json =
            parseApiResponseText(result.text)

          if (json && json.error) {
            throw createApiError(
              'api',
              format.parseError(json) ||
              'API trả về lỗi.'
            )
          }

          const parsed = format.parseFull(json)

          message.outputBlocks =
            parsed.blocks || []

          syncMessageOutput(message)
        }

        message.status = 'complete'
      } catch (error) {
        if (renderer) await renderer.drain()

        if (
          error &&
          error.name === 'AbortError'
        ) {
          message.status = 'stopped'
        } else {
          message.status = 'error'
          message.error = normalizeError(error)
        }
      }

      runtime.generating = false
      runtime.abortController = null
      conversation.updatedAt = Date.now()

      const conversationStillExists =
        state.conversations.some(item => {
          return item.id === conversation.id
        })

      if (!conversationStillExists) return

      const active =
        state.activeConversationId ===
        conversation.id

      if (active) {
        renderMessages()
        renderTopBar()
        scrollToBottom(true)
      }

      renderSidebar()
      scheduleStateSave()

      if (message.status === 'complete') {
        if (active) {
          announce('Phản hồi đã hoàn tất')
        }
      } else if (message.status === 'stopped') {
        if (active) {
          announce(TEXT.stopped)
          showToast(TEXT.stopped, 'info')
        }
      } else if (active) {
        announce(message.error.message)

        showToast(
          message.error.message,
          'error',
          5200
        )
      } else {
        showToast(
          `“${conversation.title}”: ${message.error.message}`,
          'error',
          5200
        )
      }
    }

    function createAssistantMessageAndGenerate (
      conversation
    ) {
      const endpoint = getEndpointById(
        conversation.configuration.endpointId
      )

      const message = {
        content: '',
        createdAt: Date.now(),
        endpointId:
          conversation.configuration.endpointId,
        endpointName:
          endpoint ? endpoint.name : '',
        id: createUniqueId(),
        model:
          conversation.configuration.modelId,
        modelLabel:
          conversation.configuration.modelId,
        outputBlocks: [],
        reasoning: '',
        reasoningRedacted: false,
        role: 'assistant',
        showReasoning:
          conversation.configuration
            .settings.showReasoning,
        status: 'streaming'
      }

      conversation.messages.push(message)
      conversation.updatedAt = Date.now()

      if (
        state.activeConversationId ===
        conversation.id
      ) {
        renderMessages()
        scrollToBottom(true)
      }

      renderSidebar()

      generateAssistantResponse(
        conversation,
        message
      )
    }

    function sendMessage () {
      const currentConversation =
        getCurrentConversation()

      if (
        currentConversation &&
        isConversationGenerating(
          currentConversation.id
        )
      ) {
        return
      }

      if (state.pendingAttachmentReads) {
        showToast(
          'Tệp đính kèm vẫn đang được đọc.',
          'info'
        )
        return
      }

      if (!navigator.onLine) {
        showToast('Mất kết nối mạng.', 'error')
        return
      }

      if (!getCurrentEndpoint()) {
        showToast(TEXT.endpointRequired, 'error')
        openEndpointDialog()
        return
      }

      if (!state.modelId) {
        showToast(TEXT.modelRequired, 'error')
        openEndpointDialog()
        return
      }

      if (scheduleVariableValidation) {
        scheduleVariableValidation.cancel()
      }

      try {
        parseRequestInputs()
      } catch (error) {
        validateVariableEntries()

        showToast(
          error.message,
          'error',
          5200
        )
        return
      }

      let conversation =
        getCurrentConversation()

      if (!conversation) {
        conversation = createConversation()
      }

      const text = state.messageDraft.trim()

      if (text || state.attachments.length) {
        conversation.messages.push({
          attachments:
            state.attachments.map(
              attachment => ({ ...attachment })
            ),
          content: text,
          createdAt: Date.now(),
          id: createUniqueId(),
          role: 'user'
        })

        if (
          !conversation.renamed &&
          conversation.title ===
          TEXT.newConversationTitle
        ) {
          conversation.title =
            text
              ? createConversationTitleFromText(text)
              : getAutomaticConversationTitle(
                  conversation
                )
        }
      }

      if (!conversation.messages.length) return

      state.messageDraft = ''
      state.attachments = []

      const input =
        selectElement('#message-input')

      input.value = ''
      resizeMessageInput()
      renderAttachmentList()
      renderSidebar()
      renderTopBar()
      scheduleStateSave()

      createAssistantMessageAndGenerate(
        conversation
      )
    }

    function stopGeneration () {
      stopConversationRuntime(
        state.activeConversationId
      )
    }

    function handleSubmitButton () {
      if (isCurrentConversationGenerating()) {
        stopGeneration()
      } else {
        sendMessage()
      }
    }

    function addMessage (role = 'user') {
      const currentConversation =
        getCurrentConversation()

      if (
        currentConversation &&
        isConversationGenerating(
          currentConversation.id
        )
      ) {
        showToast(TEXT.generationBusy, 'error')
        return
      }

      if (state.editingMessageId) return

      const messageRole =
        MESSAGE_ROLES.includes(role)
          ? role
          : 'user'

      let conversation =
        getCurrentConversation()

      if (!conversation) {
        conversation = createConversation()
      }

      const message = {
        content: '',
        createdAt: Date.now(),
        id: createUniqueId(),
        role: messageRole
      }

      if (isAssistantRole(messageRole)) {
        message.outputBlocks = []
        message.reasoning = ''
        message.reasoningRedacted = false
        message.showReasoning = true
        message.status = 'complete'
      }

      conversation.messages.push(message)
      conversation.updatedAt = Date.now()
      state.editingMessageId = message.id
      state.newMessageId = message.id

      renderMessages()
      renderSidebar()
      scrollToBottom(true)
    }

    function saveMessageEdit (messageId) {
      const conversation =
        getCurrentConversation()

      const textarea =
        selectElement('#message-editor-input')

      if (!conversation || !textarea) return

      const content = textarea.value.trim()

      if (!content) {
        showToast(TEXT.emptyMessage, 'error')
        return
      }

      const message =
        conversation.messages.find(item => {
          return item.id === messageId
        })

      if (!message) return

      message.content = content
      delete message.error

      if (isAssistantRole(message.role)) {
        message.status = 'complete'

        replaceMessageTextBlock(
          message,
          content
        )
      } else {
        delete message.status
        delete message.outputBlocks
        delete message.reasoning
        delete message.reasoningRedacted
        delete message.showReasoning
        delete message.endpointId
        delete message.endpointName
        delete message.model
        delete message.modelLabel
      }

      if (
        !conversation.renamed &&
        conversation.title ===
        TEXT.newConversationTitle
      ) {
        conversation.title =
          getAutomaticConversationTitle(
            conversation
          )
      }

      state.editingMessageId = null
      state.newMessageId = null
      conversation.updatedAt = Date.now()

      renderMessages()
      renderSidebar()
      renderTopBar()
      scheduleStateSave()
    }

    function cancelMessageEdit () {
      const conversation =
        getCurrentConversation()

      if (conversation && state.newMessageId) {
        conversation.messages =
          conversation.messages.filter(message => {
            return !(
              message.id === state.newMessageId &&
              !message.content
            )
          })
      }

      state.editingMessageId = null
      state.newMessageId = null

      renderMessages()
      renderSidebar()
      scheduleStateSave()
    }

    function deleteMessage (messageId) {
      const conversation =
        getCurrentConversation()

      if (
        conversation &&
        isConversationGenerating(conversation.id)
      ) {
        showToast(TEXT.generationBusy, 'error')
        return
      }

      if (!conversation) return

      conversation.messages =
        conversation.messages.filter(message => {
          return message.id !== messageId
        })

      conversation.updatedAt = Date.now()

      if (!conversation.renamed) {
        conversation.title =
          getAutomaticConversationTitle(
            conversation
          )
      }

      state.editingMessageId = null
      state.newMessageId = null

      renderMessages()
      renderSidebar()
      renderTopBar()
      scheduleStateSave()
    }

    function moveMessage (messageId, direction) {
      const conversation =
        getCurrentConversation()

      if (
        conversation &&
        isConversationGenerating(conversation.id)
      ) {
        showToast(TEXT.generationBusy, 'error')
        return
      }

      if (!conversation) return

      const index =
        conversation.messages.findIndex(
          message => message.id === messageId
        )

      if (index < 0) return

      const nextIndex =
        index + direction

      if (
        nextIndex < 0 ||
        nextIndex >= conversation.messages.length
      ) {
        return
      }

      const removed =
        conversation.messages.splice(index, 1)

      const message = removed[0]

      conversation.messages.splice(
        nextIndex,
        0,
        message
      )

      conversation.updatedAt = Date.now()

      if (!conversation.renamed) {
        conversation.title =
          getAutomaticConversationTitle(
            conversation
          )
      }

      renderMessages()
      renderSidebar()
      renderTopBar()
      scheduleStateSave()

      const movedElement =
        document.querySelector(
          `[data-message-id="${messageId}"]`
        )

      if (movedElement) {
        movedElement.scrollIntoView({
          block: 'nearest'
        })
      }
    }

    function regenerateResponseFrom (messageId) {
      const conversation =
        getCurrentConversation()

      if (
        conversation &&
        isConversationGenerating(conversation.id)
      ) {
        showToast(TEXT.generationBusy, 'error')
        return
      }

      if (!conversation) return

      const index =
        conversation.messages.findIndex(
          message => message.id === messageId
        )

      if (index < 0) return

      conversation.messages =
        conversation.messages.slice(0, index)

      createAssistantMessageAndGenerate(
        conversation
      )
    }

    function updatePanelControls () {
      const mobile =
        mobileLayoutMediaQuery.matches

      const sidebarExpanded = mobile
        ? state.openDrawerSelector === '#sidebar'
        : state.ui.sidebarOpen

      const settingsExpanded = mobile
        ? state.openDrawerSelector === '#settings'
        : state.ui.settingsOpen

      const sidebarButton =
        selectElement('#sidebar-toggle-button')

      const settingsButton =
        selectElement('#settings-toggle-button')

      sidebarButton.setAttribute(
        'aria-expanded',
        String(sidebarExpanded)
      )

      sidebarButton.setAttribute(
        'aria-label',
        sidebarExpanded
          ? 'Thu gọn lịch sử trò chuyện'
          : 'Mở lịch sử trò chuyện'
      )

      settingsButton.setAttribute(
        'aria-expanded',
        String(settingsExpanded)
      )

      settingsButton.setAttribute(
        'aria-label',
        settingsExpanded
          ? 'Thu gọn bảng cấu hình'
          : 'Mở bảng cấu hình'
      )
    }

    function applyDesktopPanels () {
      selectElement('#sidebar')
        .classList.toggle(
          'closed',
          !state.ui.sidebarOpen
        )

      selectElement('#settings')
        .classList.toggle(
          'closed',
          !state.ui.settingsOpen
        )

      updatePanelControls()
    }

    function updateDrawerBackdrop () {
      selectElement('#drawer-backdrop')
        .classList.toggle(
          'visible',
          Boolean(state.openDrawerSelector)
        )

      updatePanelControls()
    }

    function openDrawer (selector) {
      state.openDrawerSelector = selector

      selectElement(selector)
        .classList.add('drawer-open')

      updateDrawerBackdrop()
    }

    function closeDrawers () {
      if (state.openDrawerSelector) {
        selectElement(state.openDrawerSelector)
          .classList.remove('drawer-open')
      }

      state.openDrawerSelector = null
      updateDrawerBackdrop()
    }

    function toggleSidebar () {
      if (mobileLayoutMediaQuery.matches) {
        if (
          state.openDrawerSelector === '#sidebar'
        ) {
          closeDrawers()
        } else {
          closeDrawers()
          openDrawer('#sidebar')
        }

        return
      }

      state.ui.sidebarOpen =
        !state.ui.sidebarOpen

      applyDesktopPanels()
      scheduleStateSave()
    }

    function toggleSettings () {
      if (mobileLayoutMediaQuery.matches) {
        if (
          state.openDrawerSelector === '#settings'
        ) {
          closeDrawers()
        } else {
          closeDrawers()
          openDrawer('#settings')
        }

        return
      }

      state.ui.settingsOpen =
        !state.ui.settingsOpen

      applyDesktopPanels()
      scheduleStateSave()
    }

    function bindSynchronizedNumberInputs (
      rangeId,
      numberId,
      settingName
    ) {
      const range =
        selectElement('#' + rangeId)

      const number =
        selectElement('#' + numberId)

      range.addEventListener('input', () => {
        const value = Number(range.value)

        number.value = value
        state.settings[settingName] = value
        scheduleStateSave()
      })

      number.addEventListener('input', () => {
        if (!number.value) return

        const value = clampValue(
          Number(number.value),
          Number(range.min),
          Number(range.max)
        )

        state.settings[settingName] = value
        range.value = value
        scheduleStateSave()
      })

      number.addEventListener('change', () => {
        number.value =
          state.settings[settingName]
      })
    }

    function bindSettingToggle (
      elementId,
      property,
      rerender
    ) {
      selectElement('#' + elementId)
        .addEventListener('click', event => {
          if (event.currentTarget.disabled) return

          state.settings[property] =
            !state.settings[property]

          if (rerender) {
            renderSettingsPanel()
          } else {
            renderToggle(
              elementId,
              state.settings[property]
            )
          }

          scheduleStateSave()
        })
    }

    function bindEvents () {
      selectElement('#accent-color-input')
        .addEventListener('input', event => {
          setAccent(event.target.value)
        })

      selectElement('#sidebar-toggle-button')
        .addEventListener('click', toggleSidebar)

      selectElement('#sidebar-collapse-button')
        .addEventListener('click', toggleSidebar)

      selectElement('#new-conversation-button')
        .addEventListener('click', () => {
          createConversation()
          renderEndpointSelect()
          renderModelSelect()
          renderSettingsPanel()
          renderMessages()
          renderTopBar()
          closeDrawers()
          selectElement('#message-input').focus()
        })

      selectElement('#conversation-search')
        .addEventListener('input', event => {
          state.conversationSearchQuery =
            event.target.value

          renderSidebar()
        })

      selectElement(
        '#clear-conversation-search-button'
      ).addEventListener('click', () => {
        state.conversationSearchQuery = ''
        selectElement('#conversation-search').value = ''
        renderSidebar()
      })

      selectElement('#conversation-list')
        .addEventListener('click', event => {
          const item =
            event.target.closest(
              '[data-conversation-id]'
            )

          if (!item) return

          const actionButton =
            event.target.closest(
              '[data-conversation-action]'
            )

          if (actionButton) {
            handleConversationAction(
              actionButton.getAttribute(
                'data-conversation-action'
              ),
              item.getAttribute(
                'data-conversation-id'
              )
            )
            return
          }

          const selectButton =
            event.target.closest(
              '[data-select-conversation]'
            )

          if (selectButton) {
            selectConversation(
              selectButton.getAttribute(
                'data-select-conversation'
              )
            )
          }
        })

      selectElement('#settings-toggle-button')
        .addEventListener('click', toggleSettings)

      selectElement('#close-settings-button')
        .addEventListener('click', closeDrawers)

      const messageList =
        selectElement('#message-list')

      messageList.addEventListener('click', event => {
        const attachmentButton =
          event.target.closest(
            '[data-message-attachment-id]'
          )

        if (attachmentButton) {
          removeMessageAttachment(
            attachmentButton.getAttribute(
              'data-message-id'
            ),
            attachmentButton.getAttribute(
              'data-message-attachment-id'
            )
          )
          return
        }

        const copyCodeButton =
          event.target.closest('[data-copy-text]')

        if (copyCodeButton) {
          copyText(
            decodeTextBase64(
              copyCodeButton.getAttribute(
                'data-copy-text'
              )
            )
          ).then(copied => {
            showToast(
              copied
                ? TEXT.copied
                : TEXT.copyFailed,
              copied ? 'success' : 'error'
            )

            if (copied) {
              copyCodeButton.classList.add('copied')

              window.setTimeout(() => {
                copyCodeButton.classList
                  .remove('copied')
              }, 1200)
            }
          })

          return
        }

        const actionButton =
          event.target.closest('[data-action]')

        if (!actionButton) return

        const action =
          actionButton.getAttribute('data-action')

        const messageId =
          actionButton.getAttribute(
            'data-message-id'
          )

        if (action === 'open-endpoint-dialog') {
          openEndpointDialog()
          return
        }

        const conversation =
          getCurrentConversation()

        if (!conversation) return

        if (action === 'copy-message') {
          const message =
            conversation.messages.find(
              item => item.id === messageId
            )

          if (message) {
            copyText(message.content || '')
              .then(copied => {
                showToast(
                  copied
                    ? TEXT.copied
                    : TEXT.copyFailed,
                  copied ? 'success' : 'error'
                )
              })
          }
        } else if (action === 'edit-message') {
          if (
            isConversationGenerating(
              conversation.id
            )
          ) {
            showToast(
              TEXT.generationBusy,
              'error'
            )
            return
          }

          state.editingMessageId = messageId
          state.newMessageId = null
          renderMessages()
        } else if (
          action === 'save-message-edit'
        ) {
          saveMessageEdit(messageId)
        } else if (
          action === 'cancel-message-edit'
        ) {
          cancelMessageEdit()
        } else if (
          action === 'delete-message'
        ) {
          deleteMessage(messageId)
        } else if (
          action === 'move-message-up'
        ) {
          moveMessage(messageId, -1)
        } else if (
          action === 'move-message-down'
        ) {
          moveMessage(messageId, 1)
        } else if (
          action === 'regenerate-response' ||
          action === 'retry'
        ) {
          regenerateResponseFrom(messageId)
        }
      })

      messageList.addEventListener('input', event => {
        if (
          event.target.id === 'message-editor-input'
        ) {
          resizeTextarea(event.target, 360)
        }
      })

      messageList.addEventListener('change', event => {
        const roleSelect =
          event.target.closest(
            '[data-message-role]'
          )

        if (!roleSelect) return

        const conversation =
          getCurrentConversation()

        const messageId =
          roleSelect.getAttribute(
            'data-message-role'
          )

        if (
          !conversation ||
          state.editingMessageId !== messageId
        ) {
          return
        }

        const message =
          conversation.messages.find(
            item => item.id === messageId
          )

        if (
          !message ||
          !MESSAGE_ROLES.includes(roleSelect.value)
        ) {
          return
        }

        const previousRole = message.role

        message.role = roleSelect.value
        roleSelect.dataset.role = message.role

        if (isAssistantRole(message.role)) {
          message.outputBlocks =
            previousRole === 'assistant'
              ? getMessageOutputBlocks(message)
              : [
                  createTextBlock(
                    message.id + ':text',
                    message.content
                  )
                ]

          message.reasoning =
            message.reasoning || ''

          message.reasoningRedacted =
            message.reasoningRedacted === true

          message.showReasoning =
            message.showReasoning !== false

          message.status = 'complete'
          syncMessageOutput(message)
        } else {
          delete message.status
          delete message.outputBlocks
          delete message.reasoning
          delete message.reasoningRedacted
          delete message.showReasoning
          delete message.error
          delete message.endpointId
          delete message.endpointName
          delete message.model
          delete message.modelLabel
        }

        renderMessages()
        scheduleStateSave()
      })

      const chatArea =
        selectElement('#chat-scroll-area')

      chatArea.addEventListener(
        'scroll',
        () => {
          shouldStickToBottom =
            chatArea.scrollHeight -
            chatArea.scrollTop -
            chatArea.clientHeight <
            90

          const conversation =
            getCurrentConversation()

          selectElement(
            '#scroll-bottom-button'
          ).hidden =
            shouldStickToBottom ||
            !conversation ||
            !conversation.messages.length
        },
        { passive: true }
      )

      selectElement('#scroll-bottom-button')
        .addEventListener('click', () => {
          shouldStickToBottom = true
          scrollToBottom(true)

          selectElement(
            '#scroll-bottom-button'
          ).hidden = true
        })

      selectElement('#add-message-button')
        .addEventListener('click', () => {
          addMessage('user')
        })

      const messageInput =
        selectElement('#message-input')

      let composing = false

      messageInput.addEventListener(
        'compositionstart',
        () => {
          composing = true
        }
      )

      messageInput.addEventListener(
        'compositionend',
        () => {
          composing = false
        }
      )

      messageInput.addEventListener('input', () => {
        state.messageDraft = messageInput.value
        resizeMessageInput()
        updateComposerButtons()
      })

      messageInput.addEventListener(
        'keydown',
        event => {
          if (
            event.key === 'Enter' &&
            !event.shiftKey &&
            !event.isComposing &&
            !composing
          ) {
            event.preventDefault()

            if (!isCurrentConversationGenerating()) {
              sendMessage()
            }
          }
        }
      )

      selectElement('#send-message-button')
        .addEventListener(
          'click',
          handleSubmitButton
        )

      selectElement('#attach-files-button')
        .addEventListener('click', () => {
          selectElement('#file-input').click()
        })

      selectElement('#file-input')
        .addEventListener('change', event => {
          Array.from(event.target.files)
            .forEach(file => addAttachment(file))

          event.target.value = ''
        })

      selectElement('#attachment-list')
        .addEventListener('click', event => {
          const button =
            event.target.closest(
              '[data-remove-attachment-id]'
            )

          if (button) {
            removeAttachment(
              button.getAttribute(
                'data-remove-attachment-id'
              )
            )
          }
        })

      selectElement('#endpoint-select')
        .addEventListener('change', event => {
          setActiveEndpoint(event.target.value)
        })

      selectElement('#model-select')
        .addEventListener('change', event => {
          state.modelId = event.target.value
          syncActiveConfiguration()
          renderSamplingControls()
          renderTopBar()
          scheduleStateSave()
        })

      selectElement('#manage-endpoints-button')
        .addEventListener(
          'click',
          openEndpointDialog
        )

      bindSynchronizedNumberInputs(
        'temperature-range',
        'temperature-number',
        'temperature'
      )

      bindSynchronizedNumberInputs(
        'top-p-range',
        'top-p-number',
        'topP'
      )

      selectElement('#temperature-auto')
        .addEventListener('change', event => {
          state.settings.temperatureAuto =
            !event.target.checked

          renderSamplingControls()
          scheduleStateSave()
        })

      selectElement('#top-p-auto')
        .addEventListener('change', event => {
          state.settings.topPAuto =
            !event.target.checked

          renderSamplingControls()
          scheduleStateSave()
        })

      NUMERIC_SETTING_BINDINGS.forEach(
        ([id, property]) => {
          const input = selectElement('#' + id)

          input.addEventListener('input', event => {
            const raw = event.target.value.trim()

            state.settings[property] =
              raw === ''
                ? null
                : Math.max(
                    1,
                    Math.floor(
                      Number(raw) || 1
                    )
                  )

            scheduleStateSave()
          })

          input.addEventListener('change', event => {
            event.target.value =
              state.settings[property] == null
                ? ''
                : state.settings[property]
          })
        }
      )

      bindSettingToggle(
        'reasoning-toggle',
        'reasoningEnabled',
        true
      )

      bindSettingToggle(
        'show-reasoning-toggle',
        'showReasoning',
        false
      )

      bindSettingToggle(
        'streaming-toggle',
        'streaming',
        false
      )

      bindSettingToggle(
        'zero-data-retention-toggle',
        'zeroDataRetention',
        false
      )

      selectElement('#system-prompt')
        .addEventListener('input', event => {
          state.settings.systemPrompt =
            event.target.value

          resizeTextarea(event.target, 320)
          scheduleStateSave()
        })

      selectElement('#tools-json')
        .addEventListener('input', event => {
          state.settings.toolsJson =
            event.target.value

          resizeTextarea(event.target, 320)
          scheduleStateSave()
        })

      SELECT_SETTING_BINDINGS.forEach(
        ([id, property]) => {
          selectElement('#' + id)
            .addEventListener('change', event => {
              state.settings[property] =
                event.target.value || null

              scheduleStateSave()
            })
        }
      )

      selectElement('#add-variable-button')
        .addEventListener('click', () => {
          const entry = {
            id: createUniqueId(),
            name: '',
            source: ''
          }

          variableEntries.push(entry)
          renderVariableList()
          scheduleVariableDraftUpdate()

          const input =
            document.querySelector(
              `[data-variable-id="${entry.id}"] [data-variable-name]`
            )

          if (input) input.focus()
        })

      selectElement('#variable-list')
        .addEventListener('input', event => {
          const row =
            event.target.closest(
              '[data-variable-id]'
            )

          if (!row) return

          const entry =
            variableEntries.find(item => {
              return (
                item.id ===
                row.getAttribute(
                  'data-variable-id'
                )
              )
            })

          if (!entry) return

          if (
            event.target.matches(
              '[data-variable-name]'
            )
          ) {
            entry.name = event.target.value
          } else if (
            event.target.matches(
              '[data-variable-value]'
            )
          ) {
            entry.source = event.target.value
          } else {
            return
          }

          clearVariableRowError(row)
          scheduleVariableDraftUpdate()
        })

      selectElement('#variable-list')
        .addEventListener('click', event => {
          const button =
            event.target.closest(
              '[data-remove-variable]'
            )

          if (!button) return

          const row =
            button.closest('[data-variable-id]')

          variableEntries =
            variableEntries.filter(entry => {
              return (
                entry.id !==
                row.getAttribute(
                  'data-variable-id'
                )
              )
            })

          state.settings.variableEntries =
            variableEntries

          renderVariableList()
          syncVariables()
        })

      selectElement('#copy-request-body-button')
        .addEventListener('click', () => {
          refreshRequestBodyPreview()

          copyText(
            selectElement(
              '#request-body-preview'
            ).value
          ).then(copied => {
            showToast(
              copied
                ? TEXT.copied
                : TEXT.copyFailed,
              copied ? 'success' : 'error'
            )
          })
        })

      selectElement('#reset-settings-button')
        .addEventListener('click', resetSettings)

      selectElement('#drawer-backdrop')
        .addEventListener('click', closeDrawers)

      selectElement(
        '#close-endpoint-dialog-button'
      ).addEventListener(
        'click',
        closeEndpointDialog
      )

      selectElement('#endpoint-dialog-root')
        .addEventListener('click', event => {
          if (
            event.target.closest(
              '[data-close-endpoint-dialog]'
            )
          ) {
            closeEndpointDialog()
          }
        })

      selectElement('.endpoint-dialog-panel')
        .addEventListener('keydown', event => {
          if (
            endpointDialogOpen &&
            event.key === 'Tab'
          ) {
            trapTabKey(
              event,
              selectElement(
                '.endpoint-dialog-panel'
              )
            )
          }
        })

      selectElement('#add-endpoint-button')
        .addEventListener(
          'click',
          () => showEndpointForm(null)
        )

      selectElement('#cancel-endpoint-form-button')
        .addEventListener(
          'click',
          hideEndpointForm
        )

      selectElement('#save-endpoint-button')
        .addEventListener(
          'click',
          saveEndpointForm
        )

      selectElement('#endpoint-api-key')
        .addEventListener('input', event => {
          if (event.target.value.trim()) {
            endpointFormApiKeyCleared = false
          }

          updateEndpointApiKeyControls()
        })

      selectElement(
        '#delete-endpoint-api-key-button'
      ).addEventListener(
        'click',
        clearEndpointApiKey
      )

      selectElement('#add-endpoint-model-button')
        .addEventListener(
          'click',
          addEndpointModel
        )

      selectElement('#endpoint-model-input')
        .addEventListener('keydown', event => {
          if (event.key === 'Enter') {
            event.preventDefault()
            addEndpointModel()
          }
        })

      selectElement('#add-endpoint-header-button')
        .addEventListener('click', () => {
          endpointFormHeaders.push({
            name: '',
            value: ''
          })

          renderEndpointHeaders()
        })

      selectElement('#endpoint-header-list')
        .addEventListener('input', event => {
          const nameInput =
            event.target.closest(
              '[data-header-name-index]'
            )

          const valueInput =
            event.target.closest(
              '[data-header-value-index]'
            )

          if (nameInput) {
            endpointFormHeaders[
              Number(
                nameInput.getAttribute(
                  'data-header-name-index'
                )
              )
            ].name = nameInput.value
          } else if (valueInput) {
            endpointFormHeaders[
              Number(
                valueInput.getAttribute(
                  'data-header-value-index'
                )
              )
            ].value = valueInput.value
          }
        })

      selectElement('#endpoint-header-list')
        .addEventListener('click', event => {
          const button =
            event.target.closest(
              '[data-remove-header-index]'
            )

          if (!button) return

          endpointFormHeaders.splice(
            Number(
              button.getAttribute(
                'data-remove-header-index'
              )
            ),
            1
          )

          renderEndpointHeaders()
        })

      selectElement('#endpoint-model-chip-list')
        .addEventListener('click', event => {
          const button =
            event.target.closest(
              '[data-remove-model-index]'
            )

          if (!button) return

          endpointFormModels.splice(
            Number(
              button.getAttribute(
                'data-remove-model-index'
              )
            ),
            1
          )

          renderEndpointModels()
        })

      selectElement('#endpoint-format')
        .addEventListener('change', () => {
          const format =
            API_FORMATS[
              selectElement(
                '#endpoint-format'
              ).value
            ]

          selectElement(
            '#endpoint-base-url'
          ).value = format.presetBase

          updateEndpointUrlPreview()
        })

      selectElement('#endpoint-base-url')
        .addEventListener(
          'input',
          updateEndpointUrlPreview
        )

      selectElement('#endpoint-list')
        .addEventListener('click', event => {
          const card =
            event.target.closest(
              '[data-endpoint-id]'
            )

          if (!card) return

          const endpointId =
            card.getAttribute('data-endpoint-id')

          const actionButton =
            event.target.closest(
              '[data-endpoint-action]'
            )

          if (actionButton) {
            const action =
              actionButton.getAttribute(
                'data-endpoint-action'
              )

            if (action === 'edit') {
              showEndpointForm(
                getEndpointById(endpointId)
              )
            } else if (action === 'delete') {
              deleteEndpoint(endpointId)
            }

            return
          }

          if (
            event.target.closest(
              '[data-select-endpoint]'
            )
          ) {
            setActiveEndpoint(endpointId)
          }
        })

      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return

        if (modalState) {
          closeModal(null)
        } else if (endpointDialogOpen) {
          closeEndpointDialog()
        } else {
          closeDrawers()
        }
      })

      document.addEventListener(
        'visibilitychange',
        () => {
          if (document.hidden) {
            scheduleStorageSave.flush()
            return
          }

          renderMessages()
          renderTopBar()
          scrollToBottom(false)
        }
      )

      window.addEventListener('online', () => {
        renderTopBar()
        showToast('Đã kết nối mạng.', 'success')
      })

      window.addEventListener('offline', () => {
        renderTopBar()
        showToast('Đã mất kết nối mạng.', 'error')
      })

      mobileLayoutMediaQuery.addEventListener(
        'change',
        event => {
          closeDrawers()

          if (!event.matches) {
            applyDesktopPanels()
          }
        }
      )

      window.addEventListener('pagehide', () => {
        if (scheduleVariableValidation) {
          scheduleVariableValidation.cancel()
        }

        scheduleStorageSave.cancel()
        schedulePreviewRefresh.cancel()
        saveStateNow()
      })
    }

    function hydrateIcons () {
      selectElements('[data-icon]')
        .forEach(element => {
          element.innerHTML =
            createIconSvg(
              element.getAttribute('data-icon')
            )
        })
    }

    function initializeApiWorker () {
      apiRequestWorker =
        createApiRequestWorker()

      if (!apiRequestWorker) return

      apiRequestWorker.addEventListener(
        'message',
        handleApiWorkerMessage
      )

      apiRequestWorker.addEventListener(
        'error',
        handleApiWorkerFailure
      )

      apiRequestWorker.addEventListener(
        'messageerror',
        handleApiWorkerFailure
      )
    }

    function initializeApp () {
      renderAccentPicker()
      hydrateIcons()
      initializeApiWorker()
      renderEndpointSelect()
      renderModelSelect()
      renderSettingsPanel()
      renderSidebar()
      renderMessages()
      renderAttachmentList()
      renderTopBar()
      applyDesktopPanels()
      resizeMessageInput()
      bindEvents()
      refreshRequestBodyPreview()
      scrollToBottom(true)

      if (!window.JSON5) {
        showToast(
          'Không tải được JSON5.',
          'error',
          5200
        )
      }

      if (!window.commonmark) {
        showToast(
          'Không tải được CommonMark; Markdown sẽ hiển thị dạng văn bản.',
          'error',
          5200
        )
      }
    }

    initializeApp()
  </script>
</body>
</html>
