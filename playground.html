<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta
    name="description"
    content="Môi trường làm việc với nhiều API trí tuệ nhân tạo, hỗ trợ streaming, suy luận, công cụ và tệp đính kèm."
  >
  <title>AI Workbench</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5/300.css"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5/400.css"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5/500.css"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5/600.css"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fontsource/be-vietnam-pro@5/700.css"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/400.css"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/500.css"
  >

  <style>
    :root {
      --accent: #00f6ff;
      --accent-glow: rgba(0, 246, 255, 0.48);
      --accent-ink: #020b10;
      --accent-rgb: 0, 246, 255;
      --accent-soft: rgba(0, 246, 255, 0.13);
      --accent-strong: #8affff;
      --background: #05080d;
      --background-deep: #020508;
      --border: #17394a;
      --border-soft: rgba(23, 57, 74, 0.58);
      --border-strong: #425866;
      --code-background: #03090e;
      --error: #ff2e55;
      --error-rgb: 255, 46, 85;
      --error-soft: rgba(var(--error-rgb), 0.11);
      --faint: #607986;
      --font-mono: 'jetbrains mono', ui-monospace, monospace;
      --font-ui: 'be vietnam pro', sans-serif;
      --grid: rgba(23, 57, 74, 0.42);
      --hover: rgba(var(--accent-rgb), 0.08);
      --muted: #7a96a3;
      --panel: #08131e;
      --panel-secondary: #0b2230;
      --panel-tertiary: #102c3b;
      --radius: 4px;
      --radius-small: 2px;
      --scrim: rgba(0, 4, 8, 0.76);
      --shadow:
        0 18px 46px rgba(0, 0, 0, 0.52),
        0 0 26px rgba(var(--accent-rgb), 0.07);
      --success: #39ff88;
      --success-rgb: 57, 255, 136;
      --success-soft: rgba(var(--success-rgb), 0.11);
      --text: #e8fbff;
      --user-background: #0b2230;
      --warning: #ffb000;
      --warning-rgb: 255, 176, 0;
      --warning-soft: rgba(var(--warning-rgb), 0.11);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overscroll-behavior: none;
    }

    html {
      background: var(--background-deep);
      overflow: hidden;
    }

    body {
      background:
        linear-gradient(
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px
        ),
        var(--background);
      background-size: 48px 48px;
      color: var(--text);
      font: 14px/1.5 var(--font-ui);
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    button,
    input,
    select,
    textarea {
      color: inherit;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled,
    input:disabled,
    select:disabled,
    textarea:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    :focus-visible {
      border-radius: 2px;
      box-shadow: 0 0 14px var(--accent-glow);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    ::selection {
      background: var(--accent);
      color: var(--accent-ink);
    }

    ::-webkit-scrollbar {
      height: 10px;
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--background-deep);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border: 3px solid var(--background-deep);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    .screen-reader-only {
      border: 0;
      clip-path: inset(50%);
      height: 1px;
      margin: -1px;
      overflow: hidden;
      padding: 0;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }

    .monospace {
      font-family: var(--font-mono);
    }

    .icon {
      flex: none;
      height: 16px;
      vertical-align: middle;
      width: 16px;
    }

    .icon-small {
      height: 14px;
      width: 14px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .sidebar,
    .settings {
      background:
        linear-gradient(
          180deg,
          rgba(var(--accent-rgb), 0.025),
          transparent 150px
        ),
        var(--panel);
      min-width: 0;
      overflow: hidden;
      transition:
        border-color 0.22s ease,
        width 0.22s ease;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      width: 290px;
    }

    .sidebar.closed {
      border-right-color: transparent;
      width: 0;
    }

    .settings {
      border-left: 1px solid var(--border);
      width: 330px;
    }

    .settings.closed {
      border-left-color: transparent;
      width: 0;
    }

    .sidebar-inner,
    .settings-inner {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-inner {
      width: 290px;
    }

    .settings-inner {
      width: 330px;
    }

    .sidebar-header,
    .settings-header,
    .top-bar {
      align-items: center;
      display: flex;
    }

    .sidebar-header {
      gap: 8px;
      justify-content: space-between;
      padding: 14px 14px 10px;
    }

    .brand,
    .compact-brand {
      align-items: center;
      display: flex;
      gap: 9px;
      min-width: 0;
    }

    .brand-image,
    .welcome-mark {
      align-items: center;
      background: rgba(var(--accent-rgb), 0.04);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      box-shadow:
        inset 0 0 16px var(--accent-soft),
        0 0 15px rgba(var(--accent-rgb), 0.2);
      color: var(--accent-strong);
      display: inline-flex;
      flex: none;
      justify-content: center;
      overflow: hidden;
    }

    .brand-image {
      height: 34px;
      width: 34px;
    }

    .brand-image .icon,
    .welcome-mark .icon {
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .brand-name {
      display: block;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.1;
      text-shadow: 0 0 12px rgba(var(--accent-rgb), 0.18);
    }

    .brand-subtitle,
    .section-title,
    .select-label {
      color: var(--faint);
      font-family: var(--font-mono);
      text-transform: uppercase;
    }

    .brand-subtitle {
      color: var(--accent);
      display: block;
      font-size: 9.5px;
      margin-top: 2px;
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .sidebar-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      padding: 0 12px;
    }

    .new-conversation-button,
    .button,
    .icon-button,
    .search-clear-button,
    .conversation-action-button,
    .message-action-button,
    .attachment-remove-button,
    .chip-remove-button,
    .attachment-button,
    .send-button,
    .code-copy-button,
    .add-message-button {
      align-items: center;
      display: inline-flex;
      justify-content: center;
    }

    .new-conversation-button {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      box-shadow:
        inset 0 0 16px var(--accent-soft),
        0 0 12px rgba(var(--accent-rgb), 0.18);
      color: var(--accent-strong);
      cursor: pointer;
      font-weight: 600;
      gap: 8px;
      min-height: 40px;
      transition:
        background 0.15s ease,
        box-shadow 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
      width: 100%;
    }

    .new-conversation-button:hover {
      background: var(--accent);
      box-shadow:
        0 0 12px var(--accent-glow),
        0 0 28px rgba(var(--accent-rgb), 0.25);
      color: var(--accent-ink);
      transform: translateY(-1px);
    }

    .conversation-search {
      align-items: center;
      display: flex;
      position: relative;
    }

    .conversation-search > [data-icon='search'] {
      align-items: center;
      color: var(--faint);
      display: inline-flex;
      height: 16px;
      justify-content: center;
      left: 10px;
      pointer-events: none;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
    }

    .conversation-search input,
    .text-field,
    .number-field,
    select {
      background-color: var(--panel-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .conversation-search input {
      padding: 9px 32px 9px 34px;
      width: 100%;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--faint);
    }

    .conversation-search input:focus,
    .text-field:focus,
    .number-field:focus,
    select:focus {
      background-color: var(--panel-tertiary);
      border-color: var(--accent);
      box-shadow:
        0 0 0 3px var(--accent-soft),
        0 0 15px rgba(var(--accent-rgb), 0.2);
      outline: none;
    }

    .search-clear-button {
      background: none;
      border: 0;
      border-radius: var(--radius-small);
      color: var(--muted);
      cursor: pointer;
      height: 27px;
      position: absolute;
      right: 4px;
      width: 27px;
    }

    .search-clear-button:hover,
    .icon-button:hover,
    .conversation-action-button:hover,
    .message-action-button:hover,
    .attachment-button:hover,
    .code-copy-button:hover,
    .chip-remove-button:hover {
      background: var(--hover);
      color: var(--accent-strong);
    }

    .conversation-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-bottom: 8px;
    }

    .conversation-group-label {
      color: var(--faint);
      font: 10px var(--font-mono);
      margin: 11px 6px 4px;
      text-transform: uppercase;
    }

    .conversation-item {
      align-items: center;
      border: 1px solid transparent;
      border-radius: var(--radius);
      display: flex;
      gap: 2px;
      padding: 0 4px;
      position: relative;
    }

    .conversation-item:hover,
    .conversation-item:focus-within {
      background: var(--hover);
    }

    .conversation-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow:
        inset 0 0 16px var(--accent-soft),
        0 0 12px rgba(var(--accent-rgb), 0.12);
    }

    .conversation-item.active::before {
      background: var(--accent);
      bottom: 7px;
      box-shadow:
        0 0 6px var(--accent),
        0 0 14px var(--accent-glow);
      content: '';
      left: -1px;
      position: absolute;
      top: 7px;
      width: 2px;
    }

    .conversation-select-button {
      background: none;
      border: 0;
      color: inherit;
      cursor: pointer;
      flex: 1;
      min-width: 0;
      padding: 9px 4px 9px 8px;
      text-align: left;
    }

    .conversation-title,
    .conversation-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-title {
      font-size: 13px;
      font-weight: 500;
    }

    .conversation-meta {
      color: var(--faint);
      font-size: 11px;
      margin-top: 2px;
    }

    .conversation-runtime-status {
      color: var(--accent);
      text-shadow: 0 0 7px var(--accent-glow);
    }

    .conversation-actions,
    .message-actions {
      align-items: center;
      display: flex;
      opacity: 0;
    }

    .conversation-item:hover .conversation-actions,
    .conversation-item:focus-within .conversation-actions,
    .message:hover .message-actions,
    .message:focus-within .message-actions {
      opacity: 1;
    }

    .conversation-action-button,
    .message-action-button,
    .chip-remove-button {
      background: none;
      border: 0;
      border-radius: var(--radius-small);
      color: var(--muted);
      cursor: pointer;
    }

    .conversation-action-button {
      height: 27px;
      width: 27px;
    }

    .sidebar-empty {
      color: var(--faint);
      display: grid;
      font-size: 12.5px;
      gap: 9px;
      justify-items: center;
      margin: 28px 8px;
      text-align: center;
    }

    .sidebar-empty .icon {
      color: var(--accent);
      filter: drop-shadow(0 0 7px var(--accent-glow));
      height: 26px;
      width: 26px;
    }

    .sidebar-footer {
      align-items: center;
      border-top: 1px solid var(--border-soft);
      color: var(--faint);
      display: flex;
      font-size: 11px;
      gap: 7px;
      padding: 10px 16px;
    }

    .status-dot {
      border-radius: 50%;
      flex: none;
      height: 7px;
      width: 7px;
    }

    .status-dot-ready {
      background: var(--success);
      box-shadow: 0 0 9px rgba(var(--success-rgb), 0.7);
    }

    .status-dot-idle {
      background: var(--faint);
    }

    .status-dot-offline {
      background: var(--error);
      box-shadow: 0 0 9px rgba(var(--error-rgb), 0.7);
    }

    .main-panel {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      min-width: 0;
      overflow: hidden;
    }

    .top-bar {
      background:
        linear-gradient(
          90deg,
          rgba(var(--accent-rgb), 0.035),
          transparent 35%
        ),
        rgba(8, 19, 30, 0.96);
      border-bottom: 1px solid var(--border-strong);
      flex-wrap: wrap;
      gap: 8px 10px;
      padding: 9px 14px;
      position: relative;
    }

    .top-bar::after {
      background:
        linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
      bottom: -1px;
      box-shadow: 0 0 12px var(--accent-glow);
      content: '';
      height: 1px;
      left: 16%;
      opacity: 0.78;
      pointer-events: none;
      position: absolute;
      right: 16%;
    }

    .top-bar-actions {
      align-items: center;
      display: flex;
      flex: none;
      gap: 8px;
      margin-left: auto;
    }

    .icon-button {
      background: none;
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      flex: none;
      height: 34px;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        color 0.15s ease;
      width: 34px;
    }

    .icon-button[aria-expanded='true'] {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow:
        inset 0 0 12px var(--accent-soft),
        0 0 10px rgba(var(--accent-rgb), 0.18);
      color: var(--accent-strong);
    }

    .compact-brand {
      display: none;
    }

    .compact-brand .brand-image {
      height: 28px;
      width: 28px;
    }

    .current-conversation-title {
      color: var(--muted);
      flex: 1 1 auto;
      font-size: 13px;
      min-width: 0;
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      align-items: center;
      border: 1px solid;
      border-radius: 999px;
      display: inline-flex;
      font: 10.5px var(--font-mono);
      gap: 6px;
      max-width: 220px;
      padding: 4px 9px;
      white-space: nowrap;
    }

    .status-badge > span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge-ready {
      background: var(--success-soft);
      border-color: var(--success);
      box-shadow: 0 0 10px rgba(var(--success-rgb), 0.16);
      color: var(--success);
    }

    .status-badge-idle {
      border-color: var(--border-strong);
      color: var(--muted);
    }

    .status-badge-offline {
      background: var(--error-soft);
      border-color: var(--error);
      color: var(--error);
    }

    .format-badge {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .chat-panel {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .chat-scroll-area {
      background-color: var(--background);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        linear-gradient(
          135deg,
          transparent 0,
          transparent 49.8%,
          rgba(var(--accent-rgb), 0.018) 50%,
          transparent 50.2%
        );
      background-size: 28px 28px, 28px 28px, 96px 96px;
      flex: 1;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .message-list {
      margin: 0 auto;
      max-width: 880px;
      padding: 18px 20px 10px;
      width: 100%;
    }

    .message-list.empty {
      align-items: center;
      display: flex;
      justify-content: center;
      min-height: 100%;
    }

    .scroll-bottom-button {
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 50%;
      bottom: 132px;
      box-shadow:
        var(--shadow),
        0 0 14px var(--accent-glow);
      color: var(--accent);
      cursor: pointer;
      height: 36px;
      left: 50%;
      position: absolute;
      transform: translateX(-50%);
      width: 36px;
      z-index: 5;
    }

    .message {
      contain: layout style;
      display: flex;
      gap: 12px;
      padding: 16px 4px;
    }

    .message + .message {
      border-top: 1px solid var(--border-soft);
    }

    .message-avatar {
      align-items: center;
      background: var(--panel-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      display: inline-flex;
      flex: none;
      height: 30px;
      justify-content: center;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        color 0.15s ease;
      width: 30px;
    }

    .avatar-user {
      background: var(--panel-secondary);
      color: var(--muted);
    }

    .avatar-assistant,
    .avatar-system,
    .avatar-developer,
    .avatar-instruction,
    .message[data-role='assistant'] .message-avatar,
    .message[data-role='system'] .message-avatar,
    .message[data-role='developer'] .message-avatar {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow:
        inset 0 0 10px var(--accent-soft),
        0 0 10px rgba(var(--accent-rgb), 0.16);
      color: var(--accent-strong);
    }

    .message-main,
    .message-output,
    .message-body {
      min-width: 0;
    }

    .message-main {
      flex: 1;
    }

    .message-header {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }

    .message-role-select {
      background-color: var(--panel-secondary);
      border-color: rgba(var(--accent-rgb), 0.5);
      border-radius: 999px;
      color: var(--accent-strong);
      font: 600 11px var(--font-mono);
      max-width: 120px;
      padding: 3px 22px 3px 9px;
    }

    .message-role-select[data-role='system'],
    .message-role-select[data-role='developer'],
    .message-role-select[data-role='assistant'],
    .message[data-role='system'] .message-role-select,
    .message[data-role='developer'] .message-role-select,
    .message[data-role='assistant'] .message-role-select {
      border-color: rgba(var(--accent-rgb), 0.5);
      color: var(--accent-strong);
    }

    .message-role-select:disabled {
      cursor: default;
      opacity: 0.78;
    }

    .message-model {
      background: var(--panel-secondary);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      color: var(--muted);
      font: 10.5px var(--font-mono);
      max-width: 100%;
      overflow: hidden;
      padding: 2px 7px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .message-time {
      color: var(--faint);
      font-size: 11px;
    }

    .user-message-content,
    .instruction-message-content {
      border-radius: var(--radius);
      overflow-wrap: anywhere;
      padding: 10px 14px;
    }

    .user-message-content {
      background: var(--user-background);
      border: 1px solid var(--border);
    }

    .instruction-message-content {
      background: var(--accent-soft);
      border: 1px solid rgba(var(--accent-rgb), 0.48);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .assistant-answer + .assistant-answer,
    .assistant-answer + .reasoning-panel,
    .reasoning-panel + .assistant-answer {
      margin-top: 12px;
    }

    .reasoning-panel {
      background:
        linear-gradient(
          135deg,
          var(--accent-soft),
          transparent 55%
        ),
        var(--panel);
      border: 1px solid rgba(var(--accent-rgb), 0.42);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      box-shadow:
        inset 0 0 20px rgba(var(--accent-rgb), 0.035),
        0 0 12px rgba(var(--accent-rgb), 0.08);
      overflow: hidden;
    }

    .reasoning-panel summary {
      align-items: center;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      font: 600 11px var(--font-mono);
      gap: 7px;
      list-style: none;
      padding: 8px 10px;
      text-shadow: 0 0 8px var(--accent-glow);
      user-select: none;
    }

    .reasoning-panel summary::-webkit-details-marker {
      display: none;
    }

    .reasoning-panel summary::after {
      border-bottom: 1px solid currentcolor;
      border-right: 1px solid currentcolor;
      content: '';
      height: 6px;
      margin-left: auto;
      transform: rotate(45deg);
      transition: transform 0.15s ease;
      width: 6px;
    }

    .reasoning-panel[open] summary::after {
      transform: rotate(225deg);
    }

    .reasoning-trace {
      border-top: 1px solid rgba(var(--accent-rgb), 0.2);
    }

    .trace-item {
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.65;
      padding: 9px 12px 11px;
    }

    .trace-item + .trace-item {
      border-top: 1px solid rgba(var(--accent-rgb), 0.14);
    }

    .reasoning-redacted {
      align-items: center;
      color: rgba(var(--accent-rgb), 0.72);
      display: flex;
      font-size: 11.5px;
      gap: 6px;
    }

    .tool-activity-header {
      align-items: center;
      display: flex;
      gap: 8px;
      min-width: 0;
    }

    .tool-activity-name {
      color: var(--accent);
      flex: 1;
      font: 500 12px var(--font-mono);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 7px rgba(var(--accent-rgb), 0.25);
      white-space: nowrap;
    }

    .tool-activity-state {
      align-items: center;
      color: var(--faint);
      display: inline-flex;
      flex: none;
      font: 10.5px var(--font-mono);
      gap: 6px;
    }

    .tool-activity-dot {
      background: currentcolor;
      border-radius: 50%;
      box-shadow: 0 0 7px currentcolor;
      height: 6px;
      width: 6px;
    }

    .tool-activity-state.active {
      color: var(--accent);
    }

    .tool-activity-state.active .tool-activity-dot {
      animation: tool-pulse 1.15s infinite ease-in-out;
    }

    .tool-activity-state.completed {
      color: var(--success);
    }

    .tool-activity-state.failed {
      color: var(--error);
    }

    .tool-activity-payload {
      background:
        linear-gradient(
          135deg,
          var(--accent-soft),
          transparent 60%
        ),
        var(--code-background);
      border: 1px solid rgba(var(--accent-rgb), 0.3);
      border-left: 2px solid var(--accent);
      border-radius: var(--radius-small);
      color: var(--muted);
      font: 11px/1.55 var(--font-mono);
      margin: 8px 0 0;
      max-height: 180px;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 8px 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .tool-activity-output {
      border-left-color: var(--accent);
    }

    @keyframes tool-pulse {
      0%,
      100% {
        box-shadow: 0 0 3px currentcolor;
        opacity: 0.36;
        transform: scale(0.8);
      }

      50% {
        box-shadow:
          0 0 7px currentcolor,
          0 0 14px currentcolor;
        opacity: 1;
        transform: scale(1);
      }
    }

    .message-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .attachment {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      position: relative;
    }

    .file-attachment {
      align-items: center;
      color: var(--muted);
      display: flex;
      gap: 7px;
      max-width: 270px;
      padding: 7px 38px 7px 10px;
    }

    .attachment-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-size {
      color: var(--faint);
      font: 10.5px var(--font-mono);
    }

    .image-attachment {
      margin: 0;
      max-width: 220px;
      overflow: hidden;
    }

    .image-attachment img {
      display: block;
      max-height: 150px;
      object-fit: cover;
      width: 100%;
    }

    .image-attachment figcaption {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      padding: 5px 36px 5px 8px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-remove-button {
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-small);
      color: var(--muted);
      cursor: pointer;
      height: 26px;
      opacity: 0;
      position: absolute;
      right: 5px;
      top: 5px;
      width: 26px;
      z-index: 2;
    }

    .attachment:hover .attachment-remove-button,
    .attachment:focus-within .attachment-remove-button {
      opacity: 1;
    }

    .attachment-remove-button:hover {
      background: var(--error-soft);
      border-color: var(--error);
      color: var(--error);
    }

    .message-actions {
      flex-wrap: wrap;
      gap: 2px;
      margin-top: 8px;
      transition: opacity 0.15s ease;
    }

    .message-action-button {
      font-size: 11.5px;
      gap: 5px;
      height: 28px;
      min-width: 28px;
      padding: 0 7px;
    }

    .message-action-button.icon-only {
      padding: 0;
      width: 28px;
    }

    .error-card {
      align-items: center;
      background: var(--error-soft);
      border: 1px solid var(--error);
      border-radius: var(--radius);
      box-shadow: inset 3px 0 0 var(--error);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      padding: 12px 14px;
    }

    .error-card:first-child {
      margin-top: 0;
    }

    .error-card > .icon {
      color: var(--error);
      filter: drop-shadow(0 0 6px rgba(var(--error-rgb), 0.45));
    }

    .error-card p {
      flex: 1;
      font-size: 13px;
      margin: 0;
      min-width: 180px;
      overflow-wrap: anywhere;
    }

    .error-type {
      border: 1px solid var(--error);
      border-radius: 999px;
      color: var(--error);
      font: 10px var(--font-mono);
      padding: 2px 7px;
      text-transform: uppercase;
    }

    .stopped-note {
      align-items: center;
      color: var(--faint);
      display: inline-flex;
      font: 11px var(--font-mono);
      gap: 6px;
      margin-top: 10px;
    }

    .generation-dots {
      align-items: center;
      display: inline-flex;
      gap: 5px;
      padding: 8px 2px;
    }

    .generation-dots span {
      animation: pulse 1.2s infinite ease-in-out;
      background: var(--accent);
      border-radius: 50%;
      box-shadow:
        0 0 7px var(--accent),
        0 0 14px var(--accent-glow);
      height: 7px;
      width: 7px;
    }

    .generation-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .generation-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    .stream-cursor {
      animation: blink 1s steps(2) infinite;
      background: var(--accent);
      box-shadow:
        0 0 8px var(--accent),
        0 0 15px var(--accent-glow);
      display: inline-block;
      height: 15px;
      margin-left: 3px;
      vertical-align: -2px;
      width: 8px;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.25;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .markdown {
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .markdown > :first-child {
      margin-top: 0;
    }

    .markdown > :last-child {
      margin-bottom: 0;
    }

    .markdown p {
      margin: 8px 0;

    .markdown h2 {

    .markdown h3 {
      font-size: 15.5px;

      background: none;
      color: var(--muted);
      min-height: 32px;
      padding: 4px 11px;
    }

    .button-accent {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.2);
      color: var(--accent-ink);
    }

    .button-accent:hover {
      background: var(--accent-strong);
      box-shadow:
        0 0 10px var(--accent),
        0 0 22px var(--accent-glow);
      color: var(--accent-ink);
      transform: translateY(-1px);
    }

    .button-danger {
      background: var(--error);
      border-color: var(--error);
      color: #fff;
    }

    .button-small {
      font-size: 12px;
      min-height: 30px;
      padding: 4px 10px;
    }

    .configuration-actions {
      display: flex;
    }

    .configuration-actions .button {
      width: 100%;
    }

    .field {
      margin-bottom: 16px;
      position: relative;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-header,
    .toggle-row {
      align-items: center;
      display: flex;
    }

    .field-header {
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .field-header > label:first-child,
    .toggle-row > label:first-child {
      font-size: 13px;
      font-weight: 500;
    }

    .parameter-auto {
      align-items: center;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      flex: none;
      font-size: 10.5px;
      gap: 5px;
      white-space: nowrap;
    }

    .parameter-auto input {
      accent-color: var(--accent);
      cursor: pointer;
      height: 14px;
      margin: 0;
      width: 14px;
    }

    .parameter-row {
      align-items: center;
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(0, 1fr) 64px;
      width: 100%;
    }

    .parameter-row input[type='range'] {
      min-width: 0;
      width: 100%;
    }

    .parameter-row .parameter-number {
      min-width: 0;
      text-align: right;
      width: 100%;
    }

    input[type='range'] {
      accent-color: var(--accent);
      cursor: pointer;
      filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), 0.35));
      height: 26px;
    }

    .sampling-field.disabled > .field-header > label:first-child,
    .reasoning-field.disabled label {
      color: var(--faint);
    }

    .text-field,
    .number-field {
      padding: 9px 11px;
      width: 100%;
    }

    textarea.text-field {
      line-height: 1.5;
      resize: vertical;
    }

    .auto-resize-field {
      max-height: 320px;
      overflow-y: hidden;
      resize: none;
    }

    .system-prompt-field {
      min-height: 72px;
    }

    .tools-field {
      min-height: 124px;
    }

    .request-body-preview {
      font-size: 11px;
      line-height: 1.5;
      min-height: 200px;
      overflow: auto;
      overscroll-behavior: contain;
      resize: vertical;
      white-space: pre;
    }

    .toggle-row {
      gap: 10px;
      justify-content: space-between;
    }

    .toggle {
      background: var(--panel-secondary);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      cursor: pointer;
      flex: none;
      height: 22px;
      padding: 0;
      position: relative;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
      width: 40px;
    }

    .toggle-knob {
      background: var(--muted);
      border-radius: 50%;
      height: 16px;
      left: 2px;
      position: absolute;
      top: 2px;
      transition:
        background 0.15s ease,
        box-shadow 0.15s ease,
        transform 0.15s ease;
      width: 16px;
    }

    .toggle[aria-checked='true'] {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow:
        0 0 7px var(--accent),
        0 0 15px var(--accent-glow);
    }

    .toggle[aria-checked='true'] .toggle-knob {
      background: var(--accent-ink);
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.45);
      transform: translateX(18px);
    }

    .field-hint {
      color: var(--faint);
      font-size: 11px;
      margin: 6px 0 0;
      overflow-wrap: anywhere;
    }

    .field-hint:empty {
      display: none;
    }

    .field-hint code {
      color: var(--accent);
      font-family: var(--font-mono);
    }

    .variable-list,
    .endpoint-header-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }

    .variable-empty,
    .endpoint-empty {
      color: var(--faint);
      font-size: 12px;
      text-align: center;
    }

    .variable-empty {
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 10px;
    }

    .variable-row {
      align-items: center;
      display: grid;
      gap: 8px;
      grid-template-columns:
        minmax(0, 0.8fr)
        minmax(0, 1.2fr)
        auto;
    }

    .variable-name,
    .variable-value {
      font-family: var(--font-mono);
      font-size: 12px;
      min-width: 0;
      padding: 7px 9px;
    }

    .variable-row [aria-invalid='true'] {
      background: var(--error-soft);
      border-color: var(--error);
    }

    .variable-error {
      color: var(--error);
      font-size: 11px;
      grid-column: 1 / -1;
    }

    .drawer-backdrop {
      background: var(--scrim);
      inset: 0;
      opacity: 0;
      pointer-events: none;
      position: fixed;
      transition: opacity 0.2s ease;
      z-index: 55;
    }

    .drawer-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .toast-region {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(380px, calc(100vw - 24px));
      pointer-events: none;
      position: fixed;
      right: 18px;
      top: calc(18px + env(safe-area-inset-top));
      z-index: 120;
    }

    .toast {
      align-items: center;
      animation: toast-in 0.2s ease;
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      font-size: 13px;
      gap: 9px;
      padding: 10px 14px;
      pointer-events: auto;
    }

    .toast-success {
      border-left: 3px solid var(--success);
    }

    .toast-error {
      border-left: 3px solid var(--error);
    }

    .toast-info {
      border-left: 3px solid var(--accent);
    }

    .toast-success .icon {
      color: var(--success);
    }

    .toast-error .icon {
      color: var(--error);
    }

    .toast-info .icon {
      color: var(--accent);
    }

    .toast.leaving {
      opacity: 0;
      transform: translateY(-6px);
      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .modal-root,
    .endpoint-dialog-root {
      display: none;
      inset: 0;
      position: fixed;
    }

    .modal-root {
      z-index: 150;
    }

    .endpoint-dialog-root {
      z-index: 140;
    }

    .modal-root.open,
    .endpoint-dialog-root.open {
      display: block;
    }

    .modal-backdrop,
    .endpoint-dialog-backdrop {
      background: var(--scrim);
      inset: 0;
      position: absolute;
    }

    .modal,
    .endpoint-dialog-panel {
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      box-shadow:
        var(--shadow),
        0 0 22px rgba(var(--accent-rgb), 0.1);
      left: 50%;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .modal {
      padding: 18px;
      width: min(440px, calc(100vw - 32px));
    }

    .modal h3 {
      font-size: 15px;
      margin: 0 0 8px;
    }

    .modal-body {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .modal-actions,
    .endpoint-form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .endpoint-dialog-panel {
      display: flex;
      flex-direction: column;
      max-height: min(860px, 92dvh);
      width: min(720px, calc(100vw - 24px));
    }

    .endpoint-dialog-header {
      align-items: center;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      justify-content: space-between;
      padding: 14px 16px;
      position: relative;
    }

    .endpoint-dialog-header::after {
      background: linear-gradient(90deg, var(--accent), transparent);
      bottom: -1px;
      box-shadow: 0 0 9px var(--accent-glow);
      content: '';
      height: 1px;
      left: 16px;
      position: absolute;
      width: 120px;
    }

    .endpoint-dialog-header h2 {
      font-size: 15px;
      margin: 0;
    }

    .endpoint-dialog-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px;
    }

    .endpoint-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      padding: 4px;
    }

    .endpoint-card.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow:
        inset 0 0 16px var(--accent-soft),
        0 0 12px rgba(var(--accent-rgb), 0.12);
    }

    .endpoint-select-button {
      background: none;
      border: 0;
      color: inherit;
      cursor: pointer;
      display: block;
      padding: 8px 10px;
      text-align: left;
      width: 100%;
    }

    .endpoint-card-header {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
    }

    .endpoint-url {
      color: var(--faint);
      display: block;
      font-size: 11px;
      margin-top: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .endpoint-meta {
      color: var(--muted);
      display: block;
      font-size: 11.5px;
      margin-top: 4px;
    }

    .endpoint-models,
    .model-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .endpoint-card-actions {
      align-items: center;
      display: flex;
      gap: 8px;
      padding: 2px 10px 8px;
    }

    .active-endpoint-label {
      color: var(--success);
      font: 10.5px var(--font-mono);
      text-shadow: 0 0 7px rgba(var(--success-rgb), 0.4);
    }

    .endpoint-empty {
      padding: 18px 8px;
    }

    .endpoint-form {
      border-top: 1px dashed var(--border-strong);
      margin-top: 12px;
      padding-top: 14px;
    }

    .endpoint-form h3 {
      font-size: 14px;
      margin: 0 0 12px;
    }

    .endpoint-model-row,
    .endpoint-header-row,
    .endpoint-dialog-footer,
    .endpoint-api-key-row {
      align-items: center;
      display: flex;
      gap: 8px;
    }

    .endpoint-api-key-row .text-field {
      flex: 1;
      min-width: 0;
    }

    .endpoint-api-key-delete-button {
      border-color: var(--border-strong);
    }

    .endpoint-api-key-delete-button:hover:not(:disabled) {
      background: var(--error-soft);
      border-color: var(--error);
      color: var(--error);
    }

    .endpoint-header-row input {
      flex: 1;
      min-width: 0;
    }

    .endpoint-header-name {
      flex: 0 0 38%;
    }

    .endpoint-dialog-footer {
      justify-content: space-between;
      margin-top: 12px;
    }

    .value-chip {
      font: 11.5px var(--font-mono);
      padding: 3px 4px 3px 9px;
    }

    @media (hover: none) {
      .conversation-actions,
      .message-actions,
      .attachment-remove-button {
        opacity: 1;
      }
    }

    @media (max-width: 1279px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar,
      .settings {
        bottom: 0;
        box-shadow: var(--shadow);
        position: fixed;
        top: 0;
        transition: transform 0.22s ease;
        z-index: 60;
      }

      .sidebar,
      .sidebar.closed {
        left: 0;
        transform: translateX(-104%);
        width: min(320px, 88vw);
      }

      .sidebar.drawer-open {
        transform: translateX(0);
      }

      .sidebar-inner {
        width: min(320px, 88vw);
      }

      .settings,
      .settings.closed {
        right: 0;
        transform: translateX(104%);
        width: min(350px, 92vw);
      }

      .settings.drawer-open {
        transform: translateX(0);
      }

      .settings-inner {
        width: min(350px, 92vw);
      }

      .compact-brand,
      .close-settings-button {
        display: flex;
      }
    }

    @media (min-width: 1280px) {
      .close-settings-button {
        display: none;
      }
    }

    @media (max-width: 767px) {
      .top-bar {
        gap: 6px 8px;
        padding: 8px 10px;
      }

      .current-conversation-title {
        display: none;
      }

      .message-list {
        padding: 12px 12px 8px;
      }

      .message {
        gap: 9px;
      }

      .toast-region {
        left: 12px;
        right: 12px;
      }

      .variable-row {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .variable-value {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .variable-remove-button {
        grid-column: 2;
        grid-row: 1;
      }

      .endpoint-header-row {
        flex-wrap: wrap;
      }

      .endpoint-header-row input,
      .endpoint-header-name {
        flex: 1 1 100%;
      }

      .parameter-auto span {
        display: none;
      }
    }

    @media (max-width: 419px) {
      .compact-brand strong {
        display: none;
      }
    }

    @media (max-width: 359px) {
      .status-badge {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .generation-dots span,
      .stream-cursor,
      .toast,
      .tool-activity-state.active .tool-activity-dot {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <aside
      class="sidebar"
      id="sidebar"
      aria-label="Lịch sử trò chuyện"
    >
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <div class="brand">
            <span
              class="brand-image"
              data-icon="terminal"
              aria-hidden="true"
            ></span>

            <div>
              <span class="brand-name">AI Workbench</span>
              <span class="brand-subtitle">Multi-model console</span>
            </div>
          </div>

          <button
            type="button"
            class="icon-button"
            id="sidebar-collapse-button"
            data-icon="panel-left"
            aria-label="Thu gọn lịch sử trò chuyện"
          ></button>
        </div>

        <div class="sidebar-body">
          <button
            type="button"
            class="new-conversation-button"
            id="new-conversation-button"
          >
            <span data-icon="plus"></span>
            Cuộc trò chuyện mới
          </button>

          <div class="conversation-search">
            <span data-icon="search"></span>

            <label
              class="screen-reader-only"
              for="conversation-search"
            >
              Tìm trong lịch sử trò chuyện
            </label>

            <input
              type="search"
              id="conversation-search"
              placeholder="Tìm theo tiêu đề hoặc nội dung"
              autocomplete="off"
            >

            <button
              type="button"
              class="search-clear-button"
              id="clear-conversation-search-button"
              data-icon="x"
              aria-label="Xoá nội dung tìm kiếm"
              hidden
            ></button>
          </div>

          <nav
            class="conversation-list"
            id="conversation-list"
            aria-label="Danh sách cuộc trò chuyện"
          ></nav>
        </div>

        <div class="sidebar-footer">
          <span
            class="status-dot status-dot-idle"
            aria-hidden="true"
          ></span>
          Lịch sử được lưu trên thiết bị
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="top-bar">
        <button
          type="button"
          class="icon-button"
          id="sidebar-toggle-button"
          data-icon="panel-left"
          aria-controls="sidebar"
          aria-expanded="true"
          aria-label="Thu gọn lịch sử trò chuyện"
        ></button>

        <div class="compact-brand">
          <span
            class="brand-image"
            data-icon="terminal"
            aria-hidden="true"
          ></span>
          <strong>AI Workbench</strong>
        </div>

        <div
          class="current-conversation-title"
          id="current-conversation-title"
        ></div>

        <span
          class="status-badge status-badge-idle"
          id="connection-status"
          role="status"
        ></span>

        <div class="top-bar-actions">
          <button
            type="button"
            class="icon-button"
            id="settings-toggle-button"
            data-icon="sliders"
            aria-controls="settings"
            aria-expanded="true"
            aria-label="Thu gọn bảng cấu hình"
          ></button>
        </div>
      </header>

      <section
        class="chat-panel"
        aria-label="Cuộc trò chuyện hiện tại"
      >
        <div
          class="chat-scroll-area"
          id="chat-scroll-area"
        >
          <div
            class="message-list"
            id="message-list"
            role="log"
            aria-live="polite"
            aria-relevant="additions"
            aria-busy="false"
          ></div>
        </div>

        <button
          type="button"
          class="scroll-bottom-button"
          id="scroll-bottom-button"
          data-icon="arrow-down"
          aria-label="Cuộn đến cuối cuộc trò chuyện"
          hidden
        ></button>

        <div class="composer-region">
          <div class="composer">
            <div class="role-toolbar">
              <button
                type="button"
                class="add-message-button"
                id="add-message-button"
              >
                <span data-icon="plus"></span>
                Thêm tin nhắn
              </button>
            </div>

            <div
              class="attachment-list"
              id="attachment-list"
              aria-label="Tệp chờ gửi"
              hidden
            ></div>

            <div class="composer-box">
              <label
                class="screen-reader-only"
                for="message-input"
              >
                Nội dung tin nhắn
              </label>

              <textarea
                id="message-input"
                rows="1"
                placeholder="Nhập nội dung tin nhắn"
              ></textarea>

              <div class="composer-toolbar">
                <button
                  type="button"
                  class="attachment-button"
                  id="attach-files-button"
                  data-icon="paperclip"
                  aria-label="Đính kèm tệp"
                ></button>

                <div class="composer-submit">
                  <span
                    class="character-count"
                    id="character-count"
                    aria-hidden="true"
                  ></span>

                  <button
                    type="button"
                    class="send-button"
                    id="send-message-button"
                    data-icon="send"
                    aria-label="Gửi tin nhắn"
                  ></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <aside
      class="settings"
      id="settings"
      aria-label="Cấu hình yêu cầu API"
    >
      <div class="settings-inner">
        <div class="settings-header">
          <h2>Cấu hình</h2>

          <div class="settings-header-actions">
            <button
              type="button"
              class="button button-small"
              id="reset-settings-button"
            >
              <span data-icon="rotate"></span>
              Đặt lại
            </button>

            <button
              type="button"
              class="icon-button close-settings-button"
              id="close-settings-button"
              data-icon="x"
              aria-label="Đóng bảng cấu hình"
            ></button>
          </div>
        </div>

        <div class="settings-body">
          <section class="settings-section">
            <h3 class="section-title">Giao diện</h3>

            <label
              class="accent-setting-row"
              for="accent-color-input"
            >
              <span class="accent-setting-label">
                Màu accent
              </span>

              <span class="accent-picker">
                <input
                  type="color"
                  class="accent-color-input"
                  id="accent-color-input"
                  value="#00f6ff"
                  aria-label="Chọn màu accent"
                >

                <output
                  class="accent-color-value"
                  id="accent-color-value"
                  for="accent-color-input"
                >
                  #00f6ff
                </output>
              </span>
            </label>
          </section>

          <section class="settings-section">
            <h3 class="section-title">Endpoint và mô hình</h3>

            <div class="select-field">
              <label
                class="select-label"
                for="endpoint-select"
              >
                Endpoint
              </label>

              <div class="select-wrapper">
                <select id="endpoint-select"></select>
              </div>
            </div>

            <div class="select-field">
              <label
                class="select-label"
                for="model-select"
              >
                Mô hình
              </label>

              <div class="select-wrapper">
                <select id="model-select"></select>
              </div>
            </div>

            <div class="configuration-actions">
              <button
                type="button"
                class="button button-ghost"
                id="manage-endpoints-button"
                aria-haspopup="dialog"
                aria-controls="endpoint-dialog-root"
              >
                <span data-icon="plug"></span>
                Quản lí endpoint
              </button>
            </div>
          </section>

          <section class="settings-section">
            <h3 class="section-title">System prompt</h3>

            <div class="field">
              <label
                class="screen-reader-only"
                for="system-prompt"
              >
                System prompt
              </label>

              <textarea

      if (/^#[0-9a-f]{6}$/.test(source)) {
        return source

      if (/^#[0-9a-f]{3}$/.test(source)) {
        return (
          '#' +
          source
            .slice(1)
            .split('')
            .map(character => character + character)
            .join('')

      }

      if (source === 'blue') return DEFAULT_ACCENT
      if (source === 'green') return '#39ff88'

    function hexToRgb (color) {
      const hex = normalizeHexColor(color).slice(1)

      return {

        green: parseInt(hex.slice(2, 4), 16),
        red: parseInt(hex.slice(0, 2), 16)

        '#' +
        [red, green, blue]
          .map(value => {

              Math.round(value),

              255
            ).toString(16).padStart(2, '0')

          .join('')

    function mixHexColors (
      firstColor,
      secondColor,
      amount

      const first = hexToRgb(firstColor)
      const second = hexToRgb(secondColor)
      const ratio = clampValue(amount, 0, 1)

      return rgbToHex(
        first.red +
          (second.red - first.red) * ratio,
        first.green +
          (second.green - first.green) * ratio,
        first.blue +
          (second.blue - first.blue) * ratio
      )
    }

    function getRelativeLuminance (color) {
      const rgb = hexToRgb(color)

      const channels = [
        rgb.red,
        rgb.green,
        rgb.blue
      ].map(value => {
        const channel = value / 255

        return channel <= 0.03928
          ? channel / 12.92
          : Math.pow(
              (channel + 0.055) / 1.055,
              2.4
            )
      })

      return (
        channels[0] * 0.2126 +
        channels[1] * 0.7152 +
        channels[2] * 0.0722
      )
    }

        '--accent-rgb',
        `${rgb.red}, ${rgb.green}, ${rgb.blue}`

      root.style.setProperty(
        '--accent-soft',
        `rgba(${rgb.red}, ${rgb.green}, ${rgb.blue}, 0.13)`

      root.style.setProperty(
        '--accent-glow',
        `rgba(${rgb.red}, ${rgb.green}, ${rgb.blue}, 0.48)`
      )
      root.style.setProperty(
        '--accent-strong',
        mixHexColors(accent, '#fff', 0.45)
      )
      root.style.setProperty(
        '--accent-ink',
        getRelativeLuminance(accent) > 0.42

    function debounce (callback, delay) {
      let timeoutId = null
      let latestArguments = []

      const debounced = (...args) => {
        latestArguments = args
        window.clearTimeout(timeoutId)

        timeoutId = window.setTimeout(() => {
          const callbackArguments = latestArguments

          timeoutId = null
          latestArguments = []
          callback(...callbackArguments)
        }, delay)
      }

      debounced.cancel = () => {
        window.clearTimeout(timeoutId)
        timeoutId = null
        latestArguments = []
      }

      debounced.flush = () => {
        if (timeoutId == null) return

        const callbackArguments = latestArguments

        window.clearTimeout(timeoutId)
        timeoutId = null
        latestArguments = []
        callback(...callbackArguments)
      }

      return debounced
    }

      return VI_DATE_FORMATTER.format(timestamp)

    function formatBytes (bytes) {
      if (!Number.isFinite(bytes)) return ''
      if (bytes < 1024) return bytes + ' B'

      if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + ' KB'
      }

      return (bytes / 1024 / 1024).toFixed(1) + ' MB'
    }

    function bytesToBase64 (bytes) {
      const chunkSize = 0x8000
      let binary = ''

      for (
        let index = 0;
        index < bytes.length;
        index += chunkSize
      ) {
        binary += String.fromCharCode(
          ...bytes.subarray(
            index,
            Math.min(index + chunkSize, bytes.length)
          )
        )
      }

      return window.btoa(binary)
    }

    function arrayBufferToBase64 (buffer) {
      return bytesToBase64(new Uint8Array(buffer))

        const bytes = Uint8Array.from(

          character => character.charCodeAt(0)

        return UTF8_DECODER.decode(bytes)

          textarea.style.position = 'fixed'
          document.body.appendChild(textarea)

    function createConversationTitleFromText (value) {

      return text.length > 60
        ? text.slice(0, 60) + '…'
        : text

    function getAutomaticConversationTitle (conversation) {
      if (!conversation) return TEXT.newConversationTitle

      const messages = Array.isArray(conversation.messages)
        ? conversation.messages
        : []

      const preferredMessage =
        messages.find(message => {
          return (
            message.role === 'user' &&
            typeof message.content === 'string' &&
            message.content.trim()
          )
        }) ||
        messages.find(message => {
          return (
            typeof message.content === 'string' &&
            message.content.trim()
          )
        })

      if (preferredMessage) {
        return createConversationTitleFromText(
          preferredMessage.content
        )
      }

      const attachmentMessage =
        messages.find(message => {
          return (
            Array.isArray(message.attachments) &&
            message.attachments.length
          )
        })

      if (attachmentMessage) {
        return createConversationTitleFromText(
          attachmentMessage.attachments[0].name
        )
      }

      return TEXT.newConversationTitle

    function sanitizeOutputBlock (block) {
      if (!block || typeof block !== 'object') {

        typeof block.id === 'string'

      if (
        block.type === 'text' ||
        block.type === 'reasoning'
      ) {
        return {
          content:
            typeof block.content === 'string'
              ? block.content
              : '',
          id,
          type: block.type

      }

      if (block.type === 'redacted') {
        return {
          id,
          type: 'redacted'
        }
      }

      if (block.type === 'tool') {
        return createToolBlock({
          id,
          input: block.input,
          name:
            typeof block.name === 'string'
              ? block.name
              : '',
          output: block.output,
          serverSide:
            block.serverSide === true,
          status: block.status,
          toolType:
            typeof block.toolType === 'string'
              ? block.toolType
              : 'tool_call'

      const outputBlocks = blocks
        .map(sanitizeOutputBlock)
        .filter(Boolean)

      return {
        blocks: outputBlocks,
        reasoning: joinTextBlocks(
          outputBlocks
            .filter(block => block.type === 'reasoning')
            .map(block => block.content)

        reasoningRedacted:
          outputBlocks.some(block => {
            return block.type === 'redacted'

        text: joinTextBlocks(

            .filter(block => block.type === 'text')
            .map(block => block.content)

    function upsertParsedToolBlock (blocks, options) {
      let block = blocks.find(item => {
        return (
          item.type === 'tool' &&
          item.id === options.id

      if (!block) {
        block = createToolBlock(options)
        blocks.push(block)
        return block
      }

      if (options.name) block.name = options.name
      if (options.toolType) block.toolType = options.toolType

      if (options.status) {
        block.status = normalizeToolStatus(options.status)
      }

      if (options.serverSide != null) {
        block.serverSide = options.serverSide === true
      }

      if (options.input != null) {
        block.input = stringifyToolPayload(options.input)
      }

      if (options.output != null) {
        block.output = stringifyToolPayload(options.output)
      }

      return block

    function finalizeParsedTools (blocks) {
      blocks.forEach(block => {
        if (
          block.type !== 'tool' ||
          !ACTIVE_TOOL_STATUSES.includes(block.status)

        block.status = block.serverSide
          ? 'completed'
          : 'waiting'

      if (message.reasoning) {
        blocks.push(
          createReasoningBlock(
            message.id + ':reasoning',
            message.reasoning

      }

      if (message.reasoningRedacted) {
        blocks.push(
          createRedactedBlock(
            message.id + ':redacted'

        )
      }

      if (message.content) {
        blocks.push(
          createTextBlock(
            message.id + ':text',
            message.content

      message.outputBlocks = blocks
      return blocks

    function getSequentialStreamBlockId (

        return current.id
      }

      streamState.sequence += 1

      const id =
        namespace +
        ':' +
        kind +
        ':' +
        streamState.sequence

      streamState.sequentialBlocks[key] = {
        id,
        kind
      }

      return id

        .toLowerCase()
        .split(';')[0]

    function buildVariablesFromEntries (entries) {
      const variables = Object.create(null)
      const names = new Set()

      entries.forEach(entry => {
        const name = entry.name.trim()
        const source = entry.source.trim()

        if (!name && !source) return

        if (!name) {
          const error = createApiError(
            'config',
            'Tên biến không được để trống.'
          )

          error.entryId = entry.id
          error.field = 'name'
          throw error
        }

        if (names.has(name)) {
          const error = createApiError(
            'config',
            `Tên biến “${name}” bị trùng.`
          )

          error.entryId = entry.id
          error.field = 'name'
          throw error
        }

        let value = ''

        if (source) {
          try {
            value = parseJson5(source)
          } catch (parseError) {
            const error = createApiError(
              'config',
              `Giá trị của biến “${name}” không hợp lệ: ${parseError.message}`
            )

            error.entryId = entry.id
            error.field = 'value'
            throw error
          }
        }

        names.add(name)
        variables[name] = value
      })

      return variables

    function findVariableValue (variables, path) {

          variables,
          path

        return {
          found: true,
          value: variables[path]
        }
      }

      const parts = path.split('.')
      let currentValue = variables

      for (const part of parts) {
        if (
          !currentValue ||
          typeof currentValue !== 'object' ||
          !Object.prototype.hasOwnProperty.call(
            currentValue,
            part
          )
        ) {
          return { found: false }
        }

        currentValue = currentValue[part]
      }

      return {
        found: true,
        value: currentValue
      }
    }
